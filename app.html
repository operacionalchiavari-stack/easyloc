<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#5a5a55">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Acervo">
<title>Acervo</title>
<link rel="manifest" href="app.webmanifest">
<script src="js/app/carregamento-app.js?v=20261106-abertura" data-auto data-sempre></script>
<link rel="icon" type="image/png" href="Modulos/Comercial/Catalogo/app-icone-192.png">
<link rel="apple-touch-icon" href="Modulos/Comercial/Catalogo/app-icone-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles/app-celular.css?v=20261106-avisos">
<script src="https://unpkg.com/@supabase/supabase-js@2.118.0"></script>
<script src="js/core/supabase.js"></script>
<script src="js/core/doisFatores.js?v=20261023-2fa"></script>
<script src="js/core/entrar.js?v=20261106-app"></script>
<script src="js/core/versaoCelular.js?v=20261106-app"></script>
</head>
<body>
<!-- App de celular do sistema (nov/2026): mesmo login do sistema; depois de entrar, os módulos Triagem e Montagem.
     Lógica em js/app/app-celular.js; visual em styles/app-celular.css. -->
<header class="ap-barra"><div class="ap-marca" id="apMarca"><span>Acervo</span></div></header>
<main class="ap-main">
  <section id="apCarregando" class="ap-carregando"><span class="ap-spinner" aria-hidden="true"></span></section>

  <section id="apLogin" class="ap-login" hidden>
    <div class="ap-vitrine" id="apVitrine" aria-hidden="true"></div>
    <form id="apForm" class="ap-form" novalidate>
      <p class="ap-convite">Acesse sua conta</p>
      <label>E-mail ou login<input id="apEmail" name="login" autocomplete="username" autocapitalize="none" spellcheck="false" inputmode="email"></label>
      <label>Senha<input id="apSenha" name="senha" type="password" autocomplete="current-password"></label>
      <p id="apMsg" class="ap-msg" role="alert"></p>
      <button id="apEntrar" class="ap-botao" type="submit">Entrar <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    </form>
  </section>

  <section id="apInicio" class="ap-inicio" hidden>
    <div class="ap-ola">
      <span class="ap-avatar" id="apAvatar"></span>
      <div><small id="apData"></small><h1 id="apOla">Olá</h1></div>
    </div>
    <p class="ap-titulo">O que vamos fazer agora?</p>
    <div class="ap-modulos" id="apModulos"></div>
    <section class="ap-avisos" id="apAvisos" hidden aria-label="Avisos no celular"></section>
    <div class="ap-rodape">
      <button type="button" class="ap-link" id="apCompleta">Abrir a versão completa</button>
      <button type="button" class="ap-sair" id="apSair"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4H4v16h5m6-14 6 6-6 6m-6-6h12"/></svg>Sair</button>
    </div>
  </section>
</main>
<script src="js/app/avisos-app.js?v=20261106-badge"></script>
<script src="js/app/app-celular.js?v=20261106-avisos"></script>
</body>
</html>
