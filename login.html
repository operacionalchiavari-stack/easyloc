<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#5a5a55">
<title>Acervo • Login</title>
<link rel="icon" type="image/png" href="logo%20nova%20-%20com%20fundo%20branco.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="js/core/supabase.js"></script>
<script src="js/core/doisFatores.js?v=20261023-2fa"></script>

<style>
  /* =========================================================
     LOGIN DO SISTEMA — mesmo visual do login do catálogo (out/2026, pedido do usuário: "igual do catálogo,
     mesma coisa"): faixa escura com a logo em branco, a frase, o formulário sem cartão e a vitrine viva do
     acervo ao redor (catalogo-login-vitrine.mjs). As regras abaixo são cópia do bloco "Login do catálogo" de
     Modulos/Comercial/Catalogo/catalogo.css, sem a escolha visitante/exclusivo (aqui só existe o formulário).
     A lógica de acesso não mudou: conta do Acervo, verificação em duas etapas, vínculo e assinatura.
  ========================================================= */
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:"Manrope",system-ui,sans-serif;color:#241d18;background:#fff;-webkit-font-smoothing:antialiased}
.catalog-login{position:fixed;inset:0;z-index:10000;display:flex;flex-direction:column;background:#fff;overflow:hidden}
.catalog-login.hidden{display:none}
.catalog-login-bar{flex:none;display:flex;align-items:center;justify-content:center;height:76px;background:#5a5a55;box-shadow:0 10px 30px -18px rgba(30,28,24,.55)}
.catalog-login-marca{display:flex;align-items:center;justify-content:center;min-height:30px;opacity:0;transition:opacity .9s ease;font:500 26px/1 "Cormorant Garamond",serif;letter-spacing:.18em;text-transform:uppercase;color:#fff}
.catalog-login-marca.is-pronta{opacity:1}
.catalog-login-logo{display:block;height:46px;width:auto;max-width:240px;object-fit:contain;filter:brightness(0) invert(1)}
.catalog-login-logo.is-quadrada{width:200px;height:56px;max-width:none;object-fit:cover;object-position:center 49%}
.catalog-login-palco{position:relative;flex:1;min-height:0;overflow-x:hidden;overflow-y:auto;display:grid;place-items:center;padding:clamp(28px,5vh,56px) 24px}
.catalog-login-palco::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 34% 58% at 50% 50%,rgba(255,255,255,.96) 0%,rgba(255,255,255,.75) 55%,rgba(255,255,255,0) 100%);z-index:1}
.catalog-login-vitrine{position:absolute;inset:0;pointer-events:none}
.catalog-login-peca{position:absolute;opacity:0;transform:translateY(10px) scale(.985);transition:opacity 1.8s cubic-bezier(.22,1,.36,1),transform 2.4s cubic-bezier(.22,1,.36,1);transition-delay:var(--atraso,0ms)}
/* Sem drop-shadow (numa foto opaca ele desenha a sombra do RETÂNGULO, não do móvel). brightness leva o fundo quase branco da foto
   de estúdio a branco puro, multiply some com ele no fundo branco da tela e a máscara radial apaga qualquer borda que sobre. */
.catalog-login-peca img{display:block;width:100%;height:auto;max-height:var(--mh,30vh);object-fit:contain;mix-blend-mode:multiply;animation:catalog-login-flutua var(--flutua,12s) ease-in-out var(--flutua-atraso,0s) infinite alternate;filter:brightness(1.06) contrast(1.03);-webkit-mask-image:radial-gradient(ellipse 72% 72% at 50% 50%,#000 62%,transparent 100%);mask-image:radial-gradient(ellipse 72% 72% at 50% 50%,#000 62%,transparent 100%)}
.catalog-login-peca.is-visivel{opacity:1;transform:none}
.catalog-login-peca.is-fundo.is-visivel{opacity:.42}
.catalog-login-peca.is-fundo img{filter:brightness(1.06) blur(2.5px);max-height:var(--mh,20vh)}
/* Flutuação bem lenta, cada peça no seu ritmo (--flutua/--flutua-atraso sorteados no JS): usa `translate` na imagem, não
   `transform` no bloco, pra não brigar com a entrada/saída (fade + transform) da própria peça. */
@keyframes catalog-login-flutua{from{translate:0 -6px}to{translate:0 7px}}

.catalog-login-centro{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;width:min(440px,100%);text-align:center;animation:catalog-login-in 1.1s cubic-bezier(.22,1,.36,1) both}
@keyframes catalog-login-in{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.catalog-login-centro h1{margin:0;font:500 clamp(34px,3.6vw,54px)/1.08 "Cormorant Garamond",serif;letter-spacing:.01em;color:#2b2622;text-wrap:balance}
.catalog-login-centro h1 em{font-style:italic;font-weight:500;color:#8b6a45}
.catalog-login-rule{display:block;width:44px;height:1px;margin:22px 0 26px;background:#c9b9a2}
/* Sem cartão (pedido do usuário): o formulário fica solto na tela, "Acesse seu catálogo exclusivo" em cima e os campos com o
   nome escrito acima e só uma linha embaixo. */
.catalog-login-card{width:min(340px,100%);padding:0;border:0;background:none;box-shadow:none}
.catalog-login-convite{margin:0 0 30px;font:600 12px/1.4 Manrope,sans-serif;letter-spacing:.28em;text-transform:uppercase;color:#8b6a45}
.catalog-login-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
.catalog-login-campo{display:block;margin:0 0 26px;text-align:left;font:600 12px/1.4 Manrope,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#8a7f73;transition:color .25s}
.catalog-login-campo:focus-within{color:#8b6a45}
.catalog-login-campo input{display:block;width:100%;box-sizing:border-box;margin-top:6px;padding:8px 0 10px;border:0;border-bottom:1px solid #d9d0c2;border-radius:0;background:transparent;color:#241d18;font:16px/1.3 Manrope,sans-serif;letter-spacing:.01em;text-transform:none;transition:border-color .25s}
.catalog-login-campo input:focus{outline:none;border-bottom-color:#8b6a45}
/* Preenchimento automático do navegador pintava o campo de azul claro: mantém o fundo branco e a cor do texto. */
.catalog-login-campo input:-webkit-autofill,.catalog-login-campo input:-webkit-autofill:hover,.catalog-login-campo input:-webkit-autofill:focus{-webkit-box-shadow:0 0 0 40px #fff inset;box-shadow:0 0 0 40px #fff inset;-webkit-text-fill-color:#241d18;caret-color:#241d18;transition:background-color 9999s}
.catalog-login-card button{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:14px;padding:14px;border:0;border-radius:10px;background:#5a5a55;color:#fff;font:600 13px Manrope,sans-serif;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;box-shadow:0 12px 24px -14px rgba(40,40,36,.6);transition:background .25s,transform .25s}
.catalog-login-card button svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;transition:transform .25s}
.catalog-login-card button:hover{background:#44443f}
.catalog-login-card button:hover svg{transform:translateX(3px)}
.catalog-login-card button:focus-visible{outline:2px solid #8b6a45;outline-offset:3px}
.catalog-login-card button:disabled{opacity:.6;cursor:wait}
.catalog-login-card small{display:block;min-height:18px;margin-top:10px;color:#a23d35;font-size:13px}
.catalog-login-card small:empty{min-height:0;margin:0}

/* Peça que encostaria na frase ou no cartão (tela baixa/estreita): não aparece (catalogo-login-vitrine.mjs, evitarCentro). */
.catalog-login-peca.is-fora{visibility:hidden}
/* Nome ao passar o mouse, só nas peças nítidas (pedido do usuário): só o nome, com uma seta "desconstruída" — o traço se
   desenha e a ponta aparece solta, um pouco depois. Aponta pro lado do centro da tela (.is-direita espelha) e, nas peças
   coladas na faixa de cima, fica abaixo delas (.is-abaixo). A peça com o mouse sobe acima da frase/cartão (z-index 3). */
@media(hover:hover){
  .catalog-login-peca:not(.is-fundo):not(.is-fora){pointer-events:auto;cursor:default}
  .catalog-login-peca:not(.is-fundo):hover{z-index:3}
  .catalog-login-peca:not(.is-fundo) img{transition:scale .6s cubic-bezier(.22,1,.36,1)}
  .catalog-login-peca:not(.is-fundo):hover img{scale:1.04}
}
.catalog-login-nome{position:absolute;bottom:calc(100% - 10px);left:56%;display:flex;align-items:flex-start;gap:2px;white-space:nowrap;pointer-events:none;opacity:0;transform:translateY(6px);transition:opacity .45s ease,transform .6s cubic-bezier(.22,1,.36,1)}
.catalog-login-nome em{margin-top:-10px;font:italic 500 22px/1.1 "Cormorant Garamond",serif;letter-spacing:.01em;color:#2b2622;text-shadow:0 0 12px #fff,0 0 4px #fff}
.catalog-login-seta{flex:none;width:44px;height:33px;overflow:visible;fill:none;stroke:#8b6a45;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
.catalog-login-seta .traco{stroke-dasharray:44;stroke-dashoffset:44;transition:stroke-dashoffset .7s cubic-bezier(.22,1,.36,1)}
.catalog-login-seta .ponta{opacity:0;transform:translate(-3px,3px);transition:opacity .3s ease .45s,transform .45s cubic-bezier(.22,1,.36,1) .45s}
.catalog-login-peca.is-direita .catalog-login-nome{left:auto;right:56%;flex-direction:row-reverse}
.catalog-login-peca.is-direita .catalog-login-seta{transform:scaleX(-1)}
.catalog-login-peca.is-abaixo .catalog-login-nome{bottom:auto;top:calc(100% - 10px);align-items:flex-end;transform:translateY(-6px)}
.catalog-login-peca.is-abaixo .catalog-login-nome em{margin:0 0 -10px}
.catalog-login-peca.is-abaixo .catalog-login-seta{transform:scaleY(-1)}
.catalog-login-peca.is-abaixo.is-direita .catalog-login-seta{transform:scale(-1,-1)}
@media(hover:hover){
  .catalog-login-peca:not(.is-fundo):hover .catalog-login-nome{opacity:1;transform:none}
  .catalog-login-peca:not(.is-fundo):hover .catalog-login-seta .traco{stroke-dashoffset:0}
  .catalog-login-peca:not(.is-fundo):hover .catalog-login-seta .ponta{opacity:1;transform:none}
}
@media(max-width:900px){
  .catalog-login-bar{height:64px}
  .catalog-login-logo.is-quadrada{width:170px;height:48px}
  .catalog-login-palco::before{background:radial-gradient(ellipse 80% 55% at 50% 50%,rgba(255,255,255,.95) 0%,rgba(255,255,255,.7) 60%,rgba(255,255,255,.2) 100%)}
  .catalog-login-peca.is-visivel{opacity:.35}
  .catalog-login-peca img{max-height:18vh}
}
@media(prefers-reduced-motion:reduce){.catalog-login-centro{animation:none}.catalog-login-peca{transition:none}.catalog-login-peca img{animation:none}.catalog-login-nome,.catalog-login-seta .traco,.catalog-login-seta .ponta{transition:none}}
  /* Mensagem de erro/aviso do login (texto, sem caixa, como no catálogo). */
  .catalog-login-card .msg{display:block;min-height:0;margin-top:12px;font-size:13px;line-height:1.45;text-align:center}
  .catalog-login-card .msg:empty{margin:0}
  .catalog-login-card .msg.erro{color:#a23d35}
  .catalog-login-card .msg.ok{color:#2f6b45}
  /* Aqui o login é a própria página (no catálogo é uma camada por cima): sem position:fixed/z-index alto, pra
     a janela da verificação em duas etapas aparecer por cima. */
  .catalog-login{position:relative;z-index:auto;height:100vh;height:100dvh}
  .login-rodape{margin:22px 0 0;color:#a39a8e;font-size:12.5px;letter-spacing:.02em}
</style>
<script src="js/core/loading.js?v=20261020" data-global-loading defer></script>
</head>
<body>
  <div class="catalog-login" id="loginTela">
    <header class="catalog-login-bar"><span class="catalog-login-marca" data-login-marca></span></header>
    <div class="catalog-login-palco">
      <div class="catalog-login-vitrine" data-login-vitrine aria-hidden="true"></div>
      <div class="catalog-login-centro">
        <h1>Grandes eventos começam com <em>a nossa equipe</em></h1>
        <i class="catalog-login-rule" aria-hidden="true"></i>
        <form class="catalog-login-card" onsubmit="login(event)">
          <p class="catalog-login-convite">Acesse o sistema</p>
          <label class="catalog-login-campo">E-mail ou login <input type="text" id="email" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
          <label class="catalog-login-campo">Senha <input type="password" id="senha" autocomplete="current-password" required></label>
          <button id="loginBtn" type="submit">Entrar <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
          <div class="msg" id="msg" aria-live="polite"></div>
          <p class="login-rodape">Não consegue acessar? Fale com o administrador.</p>
        </form>
      </div>
    </div>
  </div>

<script type="module">
  // Vitrine viva com as peças do acervo e a logo da empresa (mesma do login do catálogo; a leitura é pública).
  import { iniciarVitrineLogin } from "./Modulos/Comercial/Catalogo/catalogo-login-vitrine.mjs?v=20260926-login-nomes";
  try { iniciarVitrineLogin(window.supabaseClient, { empresaId: new URLSearchParams(location.search).get("empresa") }); }
  catch (e) { console.warn("Vitrine do login:", e); }
</script>

<script>
const supabaseClient = window.supabaseClient;

function mensagem(texto, tipo){
  const el = document.getElementById("msg");
  el.textContent = texto || "";
  el.className = "msg " + (texto ? (tipo || "erro") : "");
}

async function login(ev){
  ev?.preventDefault();
  const btn = document.getElementById("loginBtn");
  btn.disabled = true;
  btn.textContent = "Entrando…";
  mensagem("");

  const email = document.getElementById("email").value.trim();
  const senha = document.getElementById("senha").value;

  if(!email || !senha){
    mensagem("Preencha e-mail e senha.");
    resetButton();
    return;
  }

  let data, error;
  if (email.includes("@")) {
    ({ data, error } = await supabaseClient.auth.signInWithPassword({ email, password: senha }));
  } else {
    const result = await supabaseClient.functions.invoke("funcionarios-admin", {
      body: { action: "login", login: email, password: senha }
    });
    error = result.error;
    if (!error && result.data?.session) {
      ({ data, error } = await supabaseClient.auth.setSession(result.data.session));
    }
  }

  if(error || !data?.user){
    mensagem("E-mail ou senha incorretos.");
    resetButton();
    return;
  }

  const userId = data.user.id;

  // Verificação em duas etapas (out/2026): com a exigência ligada, o código do WhatsApp vem antes de qualquer dado.
  // Se a função não responder, segue: quem barra de verdade é o banco (funcionario_contexto avisa abaixo).
  btn.textContent = "Verificando…";
  try {
    const liberado = await window.EasyLoc2FA.garantir({ supabase: supabaseClient });
    if (!liberado) {
      await supabaseClient.auth.signOut();
      mensagem("Entrada cancelada.");
      resetButton();
      return;
    }
  } catch (e) {
    console.warn("[login] verificação em duas etapas indisponível", e);
  }

  const { data: vinculos, error: erroVinculo } = await supabaseClient
    .from("usuarios_empresas")
    .select("empresa_id")
    .eq("user_id", userId)
    .limit(1);

  if(erroVinculo || !vinculos || vinculos.length === 0){
    mensagem("Usuário não está vinculado a nenhuma empresa.");
    resetButton();
    return;
  }

  const empresaId = vinculos[0].empresa_id;

  const acesso = await supabaseClient.rpc("funcionario_contexto", { p_empresa_id: empresaId });
  if (acesso.error || !acesso.data?.ativo) {
    mensagem(acesso.data?.dois_fatores_pendente
      ? "Não foi possível confirmar o código do WhatsApp. Entre de novo."
      : "Acesso indisponível. Consulte o administrador.");
    await supabaseClient.auth.signOut();
    resetButton();
    return;
  }

  const { data: assinatura, error: erroAssinatura } = await supabaseClient
    .from("assinaturas")
    .select("status,vencimento")
    .eq("empresa_id", empresaId)
    .single();

  if(erroAssinatura || !assinatura){
    mensagem("Nenhuma assinatura encontrada. Entre em contato com o suporte.");
    resetButton();
    return;
  }

  const vencida =
    assinatura.status !== "ativo" ||
    new Date(assinatura.vencimento) < new Date();

  if(vencida){
    mensagem("Assinatura inativa ou vencida. Entre em contato com o suporte.");
    resetButton();
    return;
  }

  const { data: usuario, error: erroUsuario } = await supabaseClient
    .from("usuarios")
    .select("nome")
    .eq("id", userId)
    .single();

  if(erroUsuario){
    console.error("Erro ao buscar usuário:", erroUsuario);
  }

  sessionStorage.setItem("login_ok", "1");
  sessionStorage.setItem("empresa_id", empresaId);
  sessionStorage.setItem("usuario_nome", usuario?.nome || "Usuário");

  location.href = "dashboard.html";
}

function resetButton(){
  const btn = document.getElementById("loginBtn");
  btn.disabled = false;
  btn.innerHTML = 'Entrar <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
}
</script>
</body>
</html>
