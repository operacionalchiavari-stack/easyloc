<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>Acervo - Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/png" href="logo%20nova%20-%20com%20fundo%20branco.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="js/core/supabase.js"></script>

<style>
:root{
  --brand:#2E1F1F;
  --brand-soft:#f4f1ef;
  --surface:#ffffff;
  --surface-soft:#f8f7f6;
  --border:#e7e2df;
  --text:#1f2937;
  --muted:#6b7280;
  --danger:#dc2626;
}

*{
  box-sizing:border-box;
  font-family:"Inter", Arial, sans-serif;
}

body{
  margin:0;
  min-height:100vh;
  color:var(--text);
  background:#fff;
}

.login-shell{
  min-height:100vh;
  display:grid;
  grid-template-columns:minmax(0, 1fr) minmax(0, 1fr);
  overflow:hidden;
}

.login-media{
  position:relative;
  min-height:100vh;
  overflow:hidden;
  background:var(--brand);
}

.login-media::after{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(90deg, rgba(46,31,31,.28), rgba(46,31,31,.04)),
    linear-gradient(180deg, rgba(0,0,0,.1), rgba(0,0,0,.22));
  pointer-events:none;
}

.login-slide{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  opacity:0;
  transform:scale(1.04);
  animation:loginSlide 18s infinite;
}

.login-slide:nth-child(1){
  animation-delay:0s;
}

.login-slide:nth-child(2){
  animation-delay:6s;
}

.login-slide:nth-child(3){
  animation-delay:12s;
}

@keyframes loginSlide{
  0%{
    opacity:0;
    transform:scale(1.04);
  }
  8%,
  33%{
    opacity:1;
  }
  40%,
  100%{
    opacity:0;
    transform:scale(1.1);
  }
}

.login-panel{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:34px;
  background:
    radial-gradient(circle at top right, rgba(46,31,31,.07), transparent 30%),
    linear-gradient(180deg, #fff 0%, #fbfaf9 100%);
}

.login-card{
  width:min(100%, 480px);
  background:rgba(255,255,255,.92);
  border:1px solid var(--border);
  border-radius:28px;
  padding:42px;
  box-shadow:0 28px 80px rgba(46,31,31,.12);
}

.brand{
  display:grid;
  justify-items:center;
  gap:20px;
  margin-bottom:34px;
  text-align:center;
}

.brand img{
  width:min(310px, 78vw);
  height:auto;
  display:block;
}

.brand h1{
  margin:0;
  font-size:28px;
  line-height:1.08;
  letter-spacing:0;
  color:var(--brand);
}

.brand p{
  max-width:330px;
  margin:0;
  color:var(--muted);
  font-size:14px;
  line-height:1.6;
}

.field{
  display:grid;
  gap:7px;
  margin-bottom:16px;
}

.field label{
  font-size:13px;
  font-weight:600;
  color:#4b5563;
}

.field input{
  width:100%;
  min-height:50px;
  padding:13px 14px;
  border:1px solid var(--border);
  border-radius:14px;
  background:var(--surface-soft);
  color:var(--text);
  font-size:15px;
  outline:none;
  transition:border-color .18s ease, box-shadow .18s ease, background .18s ease;
}

.field input:focus{
  border-color:rgba(46,31,31,.42);
  background:#fff;
  box-shadow:0 0 0 4px rgba(46,31,31,.08);
}

.login-btn{
  width:100%;
  min-height:52px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  margin-top:6px;
  border:0;
  border-radius:15px;
  background:var(--brand);
  color:#fff;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
  transition:transform .18s ease, box-shadow .18s ease, filter .18s ease;
  box-shadow:0 16px 34px rgba(46,31,31,.22);
}

.login-btn:hover{
  transform:translateY(-1px);
  filter:brightness(1.04);
}

.login-btn.loading{
  opacity:.86;
  cursor:not-allowed;
  transform:none;
}

.spinner{
  width:16px;
  height:16px;
  border:2px solid rgba(255,255,255,.4);
  border-top-color:#fff;
  border-radius:50%;
  animation:spin .8s linear infinite;
}

@keyframes spin{
  to{ transform:rotate(360deg); }
}

.erro{
  min-height:18px;
  margin-top:14px;
  color:var(--danger);
  font-size:14px;
  text-align:center;
}

.link{
  margin-top:20px;
  text-align:center;
  color:#4b5563;
  font-size:14px;
}

.link a{
  color:var(--brand);
  font-weight:700;
  text-decoration:none;
}

.link a:hover{
  text-decoration:underline;
}

@media(max-width:560px){
  .login-card{
    padding:30px 22px;
    border-radius:22px;
  }

  .brand h1{
    font-size:24px;
  }
}

@media(max-width:900px){
  .login-shell{
    grid-template-columns:1fr;
    min-height:100vh;
    overflow:auto;
  }

  .login-media{
    min-height:32vh;
  }

  .login-panel{
    min-height:68vh;
    padding:24px 18px;
  }
}
</style>
</head>

<body>
<main class="login-shell">
  <section class="login-media" aria-label="Eventos Acervo">
    <img class="login-slide" src="slide1.jpg" alt="">
    <img class="login-slide" src="slide2.jpg" alt="">
    <img class="login-slide" src="slide3.jpg" alt="">
  </section>

  <section class="login-panel">
  <div class="login-card" aria-label="Login">
    <div class="brand">
      <img src="logo%20nova%20-%20com%20fundo%20branco.png" alt="Acervo">
      <div>
        <h1>Acessar o sistema</h1>
      </div>
    </div>

    <div class="field">
      <label for="email">Email</label>
      <input id="email" type="email" placeholder="seu@email.com" autocomplete="email">
    </div>

    <div class="field">
      <label for="senha">Senha</label>
      <input id="senha" type="password" placeholder="Sua senha" autocomplete="current-password">
    </div>

    <button class="login-btn" id="loginBtn" onclick="login()">
      <span class="btn-text">Entrar</span>
    </button>

    <div id="msg" class="erro"></div>

    <div class="link">
      Ainda nao conhece?
      <a href="index.html">Ver o Acervo</a>
    </div>
  </div>
  </section>
</main>

<script>
const supabaseClient = window.supabaseClient;

async function login(){
  const btn = document.getElementById("loginBtn");
  const btnText = btn.querySelector(".btn-text");
  btn.classList.add("loading");
  btn.disabled = true;
  btnText.innerHTML = `<span class="spinner"></span> Entrando...`;

  const email = document.getElementById("email").value.trim();
  const senha = document.getElementById("senha").value.trim();
  const msg = document.getElementById("msg");
  msg.innerText = "";

  if(!email || !senha){
    msg.innerText = "Preencha e-mail e senha";
    resetButton();
    return;
  }

  const { data, error } = await supabaseClient.auth.signInWithPassword({
    email,
    password: senha
  });

  if(error || !data.user){
    msg.innerText = "E-mail ou senha invalidos";
    resetButton();
    return;
  }

  const userId = data.user.id;

  const { data: vinculos, error: erroVinculo } = await supabaseClient
    .from("usuarios_empresas")
    .select("empresa_id")
    .eq("user_id", userId)
    .limit(1);

  if(erroVinculo || !vinculos || vinculos.length === 0){
    msg.innerText = "Usuario nao esta vinculado a nenhuma empresa";
    resetButton();
    return;
  }

  const empresaId = vinculos[0].empresa_id;

  const { data: assinatura, error: erroAssinatura } = await supabaseClient
    .from("assinaturas")
    .select("status,vencimento")
    .eq("empresa_id", empresaId)
    .single();

  if(erroAssinatura || !assinatura){
    location.href = "index.html#planos";
    return;
  }

  const vencida =
    assinatura.status !== "ativo" ||
    new Date(assinatura.vencimento) < new Date();

  if(vencida){
    location.href = "index.html#planos";
    return;
  }

  const { data: usuario, error: erroUsuario } = await supabaseClient
    .from("usuarios")
    .select("nome")
    .eq("id", userId)
    .single();

  if(erroUsuario){
    console.error("Erro ao buscar usuario:", erroUsuario);
  }

  sessionStorage.setItem("login_ok", "1");
  sessionStorage.setItem("empresa_id", empresaId);
  sessionStorage.setItem("usuario_nome", usuario?.nome || "Usuario");

  location.href = "Modulos/Login/Boot/boot.html";
}

function resetButton(){
  const btn = document.getElementById("loginBtn");
  const btnText = btn.querySelector(".btn-text");
  btn.classList.remove("loading");
  btn.disabled = false;
  btnText.innerHTML = "Entrar";
}
</script>
</body>
</html>
