<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>Acervo - Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/png" href="logo%20nova%20-%20com%20fundo%20branco.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="js/core/supabase.js"></script>

<style>
:root{
  --brand:#374151;
  --brand-soft:#f6f3f1;
  --surface:#ffffff;
  --surface-soft:#fbfaf9;
  --border:#e7e2df;
  --text:#1f2937;
  --muted:#6b7280;
  --muted-light:#9ca3af;
  --danger:#dc2626;
}

*{
  box-sizing:border-box;
  font-family:"Inter", Arial, sans-serif;
}

body{
  margin:0;
  min-height:100vh;
  color:var(--text);
  background:#fff;
}

a{
  color:inherit;
}

.login-shell{
  min-height:100vh;
  display:grid;
  grid-template-columns:minmax(0, 1fr) minmax(0, 1fr);
  overflow:hidden;
  background:#fff;
}

.login-media{
  position:relative;
  min-height:100vh;
  overflow:hidden;
  background:var(--brand);
}

.login-slide{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  opacity:0;
  transform:scale(1.04);
  animation:loginSlide 18s infinite;
}

.login-slide:nth-child(1){ animation-delay:0s; }
.login-slide:nth-child(2){ animation-delay:6s; }
.login-slide:nth-child(3){ animation-delay:12s; }

@keyframes loginSlide{
  0%{
    opacity:0;
    transform:scale(1.04);
  }
  8%,
  33%{
    opacity:1;
  }
  40%,
  100%{
    opacity:0;
    transform:scale(1.1);
  }
}

.login-panel{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:clamp(28px, 5vw, 64px);
  background:#fff;
}

.login-form{
  width:min(100%, 440px);
}

.brand{
  display:grid;
  justify-items:center;
  gap:18px;
  margin-bottom:28px;
  text-align:center;
}

.brand img{
  width:min(188px, 58vw);
  height:auto;
  display:block;
}

.login-ornament{
  width:min(170px, 56vw);
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  gap:12px;
  color:rgba(46,31,31,.42);
}

.login-ornament::before,
.login-ornament::after{
  content:"";
  height:1px;
  background:linear-gradient(90deg, transparent, rgba(46,31,31,.2));
}

.login-ornament::after{
  background:linear-gradient(90deg, rgba(46,31,31,.2), transparent);
}

.login-ornament span{
  width:6px;
  height:6px;
  display:block;
  border-radius:999px;
  background:currentColor;
}

.login-heading{
  margin-bottom:28px;
  text-align:center;
}

.login-heading h1{
  margin:0;
  color:var(--brand);
  font-size:clamp(24px, 3.2vw, 30px);
  font-weight:600;
  line-height:1.15;
  letter-spacing:-.01em;
}

.login-heading p{
  margin:10px auto 0;
  color:var(--muted);
  font-size:14px;
  line-height:1.55;
}

.field{
  display:grid;
  gap:7px;
  margin-bottom:16px;
}

.field label{
  color:#4b5563;
  font-size:13px;
  font-weight:600;
}

.input-wrap{
  position:relative;
  display:flex;
  align-items:center;
}

.input-icon{
  position:absolute;
  left:14px;
  width:18px;
  height:18px;
  color:#9ca3af;
  pointer-events:none;
}

.input-icon svg,
.password-toggle svg{
  width:18px;
  height:18px;
  stroke:currentColor;
  stroke-width:1.9;
  fill:none;
}

.field input{
  width:100%;
  min-height:52px;
  padding:14px 14px 14px 44px;
  border:1px solid var(--border);
  border-radius:15px;
  background:#fff;
  color:var(--text);
  font-size:15px;
  outline:none;
  transition:border-color .18s ease, box-shadow .18s ease, background .18s ease;
}

.field input::placeholder{
  color:var(--muted-light);
}

.field input:focus{
  border-color:rgba(46,31,31,.48);
  background:#fff;
  box-shadow:0 0 0 4px rgba(46,31,31,.07);
}

.password-field input{
  padding-right:46px;
}

.password-toggle{
  position:absolute;
  right:9px;
  width:38px;
  height:38px;
  display:grid;
  place-items:center;
  border:0;
  border-radius:12px;
  background:transparent;
  color:#8b949e;
  cursor:pointer;
  transition:background .18s ease, color .18s ease;
}

.password-toggle:hover{
  background:var(--brand-soft);
  color:var(--brand);
}

.login-options{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  margin:2px 0 22px;
  color:#4b5563;
  font-size:13px;
}

.remember{
  display:inline-flex;
  align-items:center;
  gap:8px;
  cursor:pointer;
}

.remember input{
  width:16px;
  height:16px;
  accent-color:var(--brand);
}

.forgot-link{
  color:var(--brand);
  text-decoration:none;
  font-weight:600;
}

.forgot-link:hover{
  text-decoration:underline;
}

.login-btn{
  width:100%;
  min-height:52px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  border:0;
  border-radius:15px;
  background:var(--brand);
  color:#fff;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
  transition:background .18s ease;
  box-shadow:none;
}

.login-btn:hover{
  background:#283241;
}

.login-btn:active{
  background:#1F2937;
}

.login-btn.loading{
  opacity:.86;
  cursor:not-allowed;
  transform:none;
}

.spinner{
  width:16px;
  height:16px;
  border:2px solid rgba(255,255,255,.4);
  border-top-color:#fff;
  border-radius:50%;
  animation:spin .8s linear infinite;
}

@keyframes spin{
  to{ transform:rotate(360deg); }
}

.erro{
  min-height:18px;
  margin-top:14px;
  color:var(--danger);
  font-size:13px;
  text-align:center;
}

.divider{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  gap:14px;
  margin:22px 0 18px;
  color:#9ca3af;
  font-size:12px;
  font-weight:600;
}

.divider::before,
.divider::after{
  content:"";
  height:1px;
  background:var(--border);
}

.link{
  text-align:center;
  color:#4b5563;
  font-size:14px;
}

.link a{
  color:var(--brand);
  font-weight:700;
  text-decoration:none;
}

.link a:hover{
  text-decoration:underline;
}

@media(max-width:900px){
  .login-shell{
    grid-template-columns:1fr;
    min-height:100vh;
    overflow:auto;
  }

  .login-media{
    min-height:28vh;
  }

  .login-panel{
    min-height:72vh;
    padding:34px 20px;
  }

  .brand img{
    width:min(160px, 52vw);
  }
}

@media(max-width:560px){
  .login-media{
    display:none;
  }

  .login-panel{
    min-height:100vh;
  }

  .login-form{
    width:100%;
  }

  .login-options{
    align-items:flex-start;
    flex-direction:column;
    gap:10px;
  }
}
</style>
</head>

<body>
<main class="login-shell">
  <section class="login-media" aria-label="Eventos Acervo">
    <img class="login-slide" src="slide1.jpg" alt="">
    <img class="login-slide" src="slide2.jpg" alt="">
    <img class="login-slide" src="slide3.jpg" alt="">
  </section>

  <section class="login-panel">
    <div class="login-form" aria-label="Login">
      <div class="login-heading">
        <h1>Entrar na sua conta</h1>
        <p>Bem-vindo de volta! Acesse para continuar.</p>
      </div>

      <div class="field">
        <label for="email">E-mail ou login</label>
        <div class="input-wrap">
          <span class="input-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M4 6h16v12H4z"></path><path d="m4 7 8 6 8-6"></path></svg>
          </span>
          <input id="email" type="text" placeholder="Seu e-mail ou login" autocomplete="username">
        </div>
      </div>

      <div class="field password-field">
        <label for="senha">Senha</label>
        <div class="input-wrap">
          <span class="input-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M6 10V8a6 6 0 0 1 12 0v2"></path><path d="M5 10h14v10H5z"></path></svg>
          </span>
          <input id="senha" type="password" placeholder="Sua senha" autocomplete="current-password">
          <button class="password-toggle" type="button" id="togglePassword" aria-label="Mostrar senha">
            <svg class="eye-open" viewBox="0 0 24 24"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6Z"></path><path d="M12 9a3 3 0 1 1 0 6 3 3 0 0 1 0-6Z"></path></svg>
          </button>
        </div>
      </div>

      <div class="login-options">
        <label class="remember">
          <input id="lembrar" type="checkbox">
          <span>Lembrar-me</span>
        </label>
        <a class="forgot-link" href="#" onclick="event.preventDefault()">Esqueci minha senha</a>
      </div>

      <button class="login-btn" id="loginBtn" onclick="login()">
        <span class="btn-text">Entrar</span>
      </button>

      <div id="msg" class="erro"></div>
    </div>
  </section>
</main>

<script>
const supabaseClient = window.supabaseClient;

const togglePassword = document.getElementById("togglePassword");
if (togglePassword) {
  togglePassword.addEventListener("click", () => {
    const input = document.getElementById("senha");
    if (!input) return;

    const shouldShow = input.type === "password";
    input.type = shouldShow ? "text" : "password";
    togglePassword.setAttribute("aria-label", shouldShow ? "Ocultar senha" : "Mostrar senha");
  });
}

async function login(){
  const btn = document.getElementById("loginBtn");
  const btnText = btn.querySelector(".btn-text");
  btn.classList.add("loading");
  btn.disabled = true;
  btnText.innerHTML = `<span class="spinner"></span> Entrando...`;

  const email = document.getElementById("email").value.trim();
  const senha = document.getElementById("senha").value;
  const msg = document.getElementById("msg");
  msg.innerText = "";

  if(!email || !senha){
    msg.innerText = "Preencha e-mail e senha";
    resetButton();
    return;
  }

  let data, error;
  if (email.includes("@")) {
    ({ data, error } = await supabaseClient.auth.signInWithPassword({ email, password: senha }));
  } else {
    const result = await supabaseClient.functions.invoke("funcionarios-admin", {
      body: { action: "login", login: email, password: senha }
    });
    error = result.error;
    if (!error && result.data?.session) {
      ({ data, error } = await supabaseClient.auth.setSession(result.data.session));
    }
  }

  if(error || !data?.user){
    msg.innerText = "E-mail ou senha inválidos";
    resetButton();
    return;
  }

  const userId = data.user.id;

  const { data: vinculos, error: erroVinculo } = await supabaseClient
    .from("usuarios_empresas")
    .select("empresa_id")
    .eq("user_id", userId)
    .limit(1);

  if(erroVinculo || !vinculos || vinculos.length === 0){
    msg.innerText = "Usuário não está vinculado a nenhuma empresa";
    resetButton();
    return;
  }

  const empresaId = vinculos[0].empresa_id;

  const acesso = await supabaseClient.rpc("funcionario_contexto", { p_empresa_id: empresaId });
  if (acesso.error || !acesso.data?.ativo) {
    msg.innerText = "Acesso indisponível. Consulte o administrador.";
    await supabaseClient.auth.signOut();
    resetButton();
    return;
  }

  const { data: assinatura, error: erroAssinatura } = await supabaseClient
    .from("assinaturas")
    .select("status,vencimento")
    .eq("empresa_id", empresaId)
    .single();

  if(erroAssinatura || !assinatura){
    msg.innerText = "Nenhuma assinatura encontrada. Entre em contato com o suporte.";
    resetButton();
    return;
  }

  const vencida =
    assinatura.status !== "ativo" ||
    new Date(assinatura.vencimento) < new Date();

  if(vencida){
    msg.innerText = "Assinatura inativa ou vencida. Entre em contato com o suporte.";
    resetButton();
    return;
  }

  const { data: usuario, error: erroUsuario } = await supabaseClient
    .from("usuarios")
    .select("nome")
    .eq("id", userId)
    .single();

  if(erroUsuario){
    console.error("Erro ao buscar usuário:", erroUsuario);
  }

  sessionStorage.setItem("login_ok", "1");
  sessionStorage.setItem("empresa_id", empresaId);
  sessionStorage.setItem("usuario_nome", usuario?.nome || "Usuário");

  location.href = "dashboard.html";
}

function resetButton(){
  const btn = document.getElementById("loginBtn");
  const btnText = btn.querySelector(".btn-text");
  btn.classList.remove("loading");
  btn.disabled = false;
  btnText.innerHTML = "Entrar";
}
</script>
</body>
</html>
