<!-- Menu no estilo do Portal Interno da Chiavari: styles/portal-shell.css + js/ui/portalNav.js -->
<button class="abrir-menu" type="button" aria-label="Abrir menu" onclick="toggleMenu()"><i data-lucide="menu"></i></button>

<aside class="portal-menu" id="sidebar" aria-label="Menu">
  <div class="menu-topo">
    <!-- Clicar na logo leva ao Início (o botão Início saiu do menu, pedido do usuário). -->
    <button type="button" class="menu-nome" onclick="portalIrInicio()" title="Início" aria-label="Ir para o Início">
      <!-- Logo da empresa (EasyLocTheme troca o src em js/core/companyTheme.js). -->
      <img id="sidebarLogo" class="menu-logo-empresa" src="logo%20nova%20branca%20-%20sem%20fundo.png" alt="Logo da empresa"
        onload="this.classList.toggle('is-quadrada', !!this.naturalWidth && this.naturalWidth / this.naturalHeight < 1.6)">
    </button>
  </div>
  <script>
    // Anti-flash: aplica a logo da empresa guardada em cache (mesma URL que
    // EasyLocTheme.withCacheBust gera) antes do resto da página carregar.
    try {
      const empresaId = sessionStorage.getItem("empresa_id");
      const cached = empresaId && localStorage.getItem("easyloc_theme_" + empresaId);
      const theme = cached ? JSON.parse(cached) : null;
      if (theme?.logo_url) {
        const cleanUrl = theme.logo_url.replace(/([?&])v=[^&]*(&?)/, (m, prefix, suffix) => suffix ? prefix : "");
        const separator = cleanUrl.includes("?") ? "&" : "?";
        document.getElementById("sidebarLogo").src = theme.logo_url.startsWith("blob:") || theme.logo_url.startsWith("data:")
          ? theme.logo_url : cleanUrl + separator + "v=stable";
      }
    } catch (error) {}
  </script>

  <nav class="menu-lista" id="appMenu"></nav>
  <script src="js/ui/sidebarMenu.js?v=20261008-ideia-premiada"></script>

  <div class="menu-rodape">
    <div class="usuario" role="button" tabindex="0" aria-label="Opções da conta" onclick="toggleUserMenu(event)" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleUserMenu(event);}">

      <div class="dropdown-item" onclick="abrirPerfil()">

      </div>
      <div class="dropdown-item" onclick="ativarAusencia()">

        <span>Entrar em ausência</span>
      </div>
    </div>

    <button class="menu-item" type="button" onclick="logout()"><i data-lucide="log-out"></i><span class="rotulo">Sair</span></button>
  </div>
</aside>
