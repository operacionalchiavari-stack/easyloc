<!DOCTYPE html>

<body>
<main class="el-page reunioes-page" id="acervo-reunioes">
  <header class="el-page-header rn-header">
    <div class="rn-header-titulo"><h1>Reuniões</h1></div>
    <label class="rn-busca"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="rnBusca" type="search" placeholder="Pesquisar reunião" aria-label="Pesquisar reuniões"></label>
    <nav class="rn-abas-top rn-abas-esq el-tabs" role="tablist" aria-label="Reuniões">
      <button type="button" role="tab" data-vista="proximas" aria-selected="true">Próximas</button>
      <button type="button" role="tab" data-vista="convites" aria-selected="false">Convites<b class="rn-bolinha" id="rnQtdConvites" hidden></b></button>
    </nav>
    <nav class="rn-abas-top rn-abas-dir el-tabs" role="tablist" aria-label="Reuniões anteriores">
      <button type="button" role="tab" data-vista="realizadas" aria-selected="false">Realizadas<b class="rn-bolinha" id="rnQtdRevisar" hidden></b></button>
    </nav>
    <div class="rn-header-acoes"><button type="button" class="rn-btn rn-btn-pri" id="rnNova"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>Nova reunião</span></button></div>
  </header>


  <section class="rn-vista" id="rnVista" aria-live="polite"></section>

  <div class="rn-detalhe" id="rnDetalhe" hidden>
    <div class="rn-det-topo"><button type="button" class="rn-voltar" id="rnVoltar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg><span>Voltar</span></button><div class="rn-capa-linha" id="rnCapa"></div></div>
    <div class="rn-det-grade">
      <section class="rn-col rn-centro" id="rnCentro" aria-live="polite"></section>
      <aside class="rn-col rn-dir" id="rnDireita"></aside>
    </div>
  </div>
</main>

<dialog class="rn-dialog" id="rnDialog"></dialog>
