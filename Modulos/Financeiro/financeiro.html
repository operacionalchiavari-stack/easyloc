<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acervo - Financeiro</title>
  <link rel="icon" type="image/png" href="../../logo%20nova%20-%20com%20fundo%20branco.png">
  <script src="../../js/core/limpezaDados.js?v=20261026"></script><script src="../../js/core/systemZoom.js?v=20261108"></script>
<script src="../../js/core/themePrepaint.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../styles/global.css?v=20261107-titulos-30">
  <link rel="stylesheet" href="financeiro.css?v=20261119-fatura-lilas">
  <link rel="stylesheet" href="../../styles/planilha.css?v=20261030">

  <link rel="stylesheet" href="financeiro-clara.css?v=20261114-cartoes">
<script src="../../js/core/pedidoFluxo.js?v=20261024-fluxo"></script>
<script src="../../js/app/relatorio-app.js?v=20261120-app2" data-titulo="Financeiro gerencial" data-esconder=".fin-topo > h2, #finAbas, #grPainelCfo, #grImprimir, #grExcel"></script>
</head>
<body>
<div class="container el-page fin-page">
  <div class="header-list fin-topo">
    <h2>Financeiro</h2>
    <!-- Título no centro e as abas divididas, metade de cada lado (out/2026). Cada lado é uma .fin-abas. -->
    <nav class="fin-abas-duplas" id="finAbas" aria-label="Áreas do financeiro">
      <div class="fin-abas fin-abas-esq">
        <button type="button" data-aba="geral" class="ativa">Fluxo de caixa</button>
        <button type="button" data-aba="receber">A receber <span class="fin-conta-aba" data-cont="receber"></span></button>
        <button type="button" data-aba="previstos">Recebimentos previstos <span class="fin-conta-aba fin-conta-amarela" data-cont="previstos"></span></button>
        <button type="button" data-aba="pagar">A pagar <span class="fin-conta-aba" data-cont="pagar"></span></button>
        <button type="button" data-aba="fechamentos">Fechamentos de parceiros</button>
        <button type="button" data-aba="bv">Decoradores</button>
      </div>
      <div class="fin-abas fin-abas-dir">
        <button type="button" data-aba="gerencial">Gerencial</button>
        <button type="button" data-aba="posicao">Posição final</button>
        <button type="button" data-aba="bancos">Bancos e cartões <span class="fin-conta-aba" data-cont="bancos"></span></button>
        <button type="button" data-aba="gateways">Gateways</button>
        <button type="button" data-aba="dre">DRE</button>
        <button type="button" data-aba="clara">Clara</button>
      </div>
    </nav>
  </div>
  <nav class="fin-subabas" id="finSubAbas" aria-label="Partes desta aba" hidden></nav>

  <p class="fin-aviso" id="finAviso" hidden></p>
  <main id="finConteudo"><div class="fin-vazio">Carregando o financeiro…</div></main>
</div>

<dialog class="fin-modal" id="finModal">
  <form method="dialog" class="fin-modal-caixa" id="finModalForm">
    <header><h3 id="finModalTitulo"></h3><button type="button" class="fin-x" data-fechar aria-label="Fechar">×</button></header>
    <div class="fin-modal-corpo" id="finModalCorpo"></div>
    <footer id="finModalRodape"></footer>
  </form>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0"></script>
<script src="../../js/core/supabase.js"></script>

<script src="financeiro-bv.js?v=20261114-credito-linha"></script>
<script src="financeiro-gestao.js?v=20261029-uber"></script>
<script src="../../js/core/evidenciasOperacao.js?v=20261024"></script>
<script src="financeiro-posicao-final.js?v=20261111-bv-cab"></script>
<script src="../../js/core/campoProtegido.js?v=20261023-cofre"></script>
<script src="relatorio-a4.js?v=20261111-clara-cfo"></script>
<script src="financeiro-clara.js?v=20261121-miguel"></script>
<script src="financeiro-cartoes.js?v=20261114-cartoes2"></script>
<script src="financeiro-fechamentos.js?v=20261114-semanal"></script>

<script src="financeiro-gateways.js?v=20261030-por-conta"></script>
<script src="financeiro-gerencial.js?v=20261114-cfo2"></script>
<script src="financeiro.js?v=20261121-busca-viva"></script>
<script src="../../js/core/moduleTheme.js?v=20261114-autofill-email"></script>
</body>
</html>
