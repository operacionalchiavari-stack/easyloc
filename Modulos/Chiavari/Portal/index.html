<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Portal Interno</title>
  <style>html,body{margin:0;height:100%;background:#f6f4ef}</style>
  <script>
    /* Mesmo roteamento do doGet do Portal: ?page=portal, ?page=mural, senão login */
    (function () {
      var pagina = new URLSearchParams(location.search).get("page");
      var destino = pagina === "portal" ? "portal.html" : pagina === "mural" ? "mural-admin.html" : "login.html";
      location.replace(destino + location.search + location.hash);
    })();
  </script>
</head>
<body></body>
</html>
