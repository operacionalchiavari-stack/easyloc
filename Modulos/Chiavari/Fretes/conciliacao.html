<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acervo - Conciliação de Fretes</title>
  <link rel="icon" type="image/png" href="../../../logo%20nova%20-%20com%20fundo%20branco.png">
  <script src="../../../js/core/limpezaDados.js?v=20261026"></script><script src="../../../js/core/themePrepaint.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../../styles/global.css?v=20261024-abas-globais">
  <link rel="stylesheet" href="conciliacao.css?v=20261029-banco">
</head>
<body>
<!-- Conciliação de Fretes (out/2026, no banco): compara o que o SISTEMA registrou (cada caminhão escalado no Painel
     Logístico, por entrega e por coleta) com o que a TRANSPORTADORA informou no Cadastro de Fretes. A logística define o
     valor final e fecha várias viagens da mesma transportadora: vira uma conta a pagar no Financeiro e o custo de cada
     pedido em Resultados. -->
<main class="el-page cf-page" data-module-root>
  <header class="header-list">
    <h1>Conciliação de Fretes</h1>
  </header>

  <div class="cf-barra">
    <label>Transportadora<select id="cfTransp"><option value="">Todas</option></select></label>
    <label>Mostrar<select id="cfSituacao"><option value="aberto">Em aberto</option><option value="fechado">Fechadas</option></select></label>
    <label class="cf-busca">Buscar<input id="cfBusca" type="search" placeholder="Pedido, cliente ou caminhão" autocomplete="off"></label>
    <span class="cf-esp"></span>
    <button type="button" class="btn" id="cfAtualizar">Atualizar</button>
  </div>
  <p class="cf-aviso" id="cfAvisoForn" hidden></p>

  <div id="cfConteudo"><div class="cf-vazio">Carregando…</div></div>

  <section class="cf-bloco" id="cfFechamentos" hidden>
    <h2>Fechamentos enviados ao Contas a Pagar</h2>
    <div id="cfFechLista"></div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0"></script>
<script src="../../../js/core/supabase.js"></script>
<script src="../../../js/core/alerta.js"></script>
<script src="../../../js/core/companyTheme.js?v=20260913m"></script>
<script src="../../../js/core/context.js?v=20261026-limpeza"></script>
<script src="../../../js/core/permissions.js?v=20261019-painel-logistico"></script>
<script src="conciliacao.js?v=20261029-banco"></script>
<script src="../../../js/core/moduleTheme.js?v=20261025-mascaras"></script>
</body>
</html>
