<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acervo - Controle de Uber</title>
  <link rel="icon" type="image/png" href="../../../logo%20nova%20-%20com%20fundo%20branco.png">
  <script src="../../../js/core/limpezaDados.js?v=20261026"></script><script src="../../../js/core/themePrepaint.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../../styles/global.css?v=20261107-titulos-30">
  <!-- mesmo visual da Conciliação de Fretes -->
  <link rel="stylesheet" href="../Fretes/conciliacao.css?v=20261029-banco">
</head>
<body>
<!-- Controle de Uber (out/2026, no banco): corridas que os motoristas fizeram (check-in e check-out pelo QR do
     responsável da etapa). A logística confere o valor de cada uma e fecha várias do mesmo motorista: vira uma conta a
     pagar no Financeiro (PIX do motorista) e o custo de cada pedido em Resultados. -->
<main class="el-page cf-page" data-module-root>
  <header class="header-list">
    <h1>Controle de Uber</h1>
  </header>

  <div class="cf-barra">
    <label>Motorista<select id="ucMotorista"><option value="">Todos</option></select></label>
    <label>Mostrar<select id="ucSituacao"><option value="abertas">A conferir e fechar</option><option value="fechadas">Fechadas</option></select></label>
    <label class="cf-busca">Buscar<input id="ucBusca" type="search" placeholder="Pedido, cliente ou motorista" autocomplete="off"></label>
    <span class="cf-esp"></span>
    <a class="btn" href="motorista.html" target="_blank" rel="noopener">Abrir o App do Motorista</a>
    <button type="button" class="btn" id="ucAtualizar">Atualizar</button>
  </div>

  <div id="ucConteudo"><div class="cf-vazio">Carregando…</div></div>

  <section class="cf-bloco" id="ucFechamentos" hidden>
    <h2>Fechamentos enviados ao Contas a Pagar</h2>
    <div id="ucFechLista"></div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0"></script>
<script src="../../../js/core/supabase.js"></script>
<script src="../../../js/core/alerta.js"></script>
<script src="../../../js/core/companyTheme.js?v=20260913m"></script>
<script src="../../../js/core/context.js?v=20261026-limpeza"></script>
<script src="../../../js/core/permissions.js?v=20261019-painel-logistico"></script>
<script src="corridas.js?v=20261029-banco"></script>
<script src="../../../js/core/moduleTheme.js?v=20261025-mascaras"></script>
</body>
</html>
