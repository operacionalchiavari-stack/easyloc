<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <script src="../gas-cliente.js?v=20261008-servidor" data-projeto="uber"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login • Corridas Uber</title>

<style>
    :root {
        --preto: #000000;
        --preto-claro: #222222;
        --cinza-fundo: #e5e7eb;
        --texto: #111827;
        --branco: #ffffff;
    }

    body {
        background: var(--cinza-fundo);
        margin: 0;
        padding: 0;
        font-family: "Segoe UI", sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    .card {
        width: 380px;
        background: var(--branco);
        padding: 40px 30px;
        border-radius: 16px;
        box-shadow: 0 6px 18px rgba(0,0,0,0.15);
        text-align: center;
    }

    h1 {
        margin: 0;
        font-size: 28px;
        font-weight: 800;
        color: var(--preto);
    }

    .sub {
        margin-top: 4px;
        margin-bottom: 25px;
        font-size: 15px;
        color: rgba(0,0,0,0.65);
    }

    input {
        width: 100%;
        padding: 12px;
        font-size: 16px;
        margin-top: 10px;
        border-radius: 8px;
        border: 1px solid #d1d5db;
        background: #f9fafb;
        outline: none;
        transition: 0.2s;
    }

    input:focus {
        border-color: var(--preto);
    }

    button {
        width: 100%;
        padding: 14px;
        margin-top: 25px;
        background: var(--preto);
        color: var(--branco);
        border: none;
        border-radius: 8px;
        font-size: 17px;
        cursor: pointer;
        font-weight: bold;
        transition: 0.2s;
    }

    button:hover {
        background: var(--preto-claro);
    }

    .erro {
        margin-top: 12px;
        display: none;
        font-weight: 600;
        text-align: center;
    }
</style>

<!-- =====================================================
     TEMA CHIAVARI (mesmo padrão dos outros sistemas)
====================================================== -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="tema-chiavari-base">
:root{
  --primary:#5a5a55; --primary-dark:#44443f; --fundo-suave:#f8f6f0; --line:#e7e1d7; --borda-card:#eee8df; --linha-tabela:#f3efe8;
  --text:#251e19; --muted:#5f5952; --serif:"Cormorant Garamond", Georgia, serif; --sans:"Manrope", system-ui, sans-serif;
  --sombra-card:0 1px 2px rgba(37,30,25,.04), 0 10px 30px rgba(37,30,25,.07);
}
html, body{ font-family:var(--sans) !important; color:var(--text) !important; -webkit-font-smoothing:antialiased; }
button, input, select, textarea{ font-family:inherit !important; }
</style>
<style id="tema-login">
*, *::before, *::after{ box-sizing:border-box; }
body{ background:#fbfaf7 !important; }
.card{ width:min(400px, calc(100vw - 32px)) !important; padding:40px 32px 34px !important; border:1px solid var(--borda-card); border-radius:18px !important; box-shadow:var(--sombra-card) !important; }
h1{ font-family:var(--serif) !important; font-size:28px !important; white-space:nowrap; font-weight:500 !important; letter-spacing:.12em; text-transform:uppercase; color:var(--text) !important; }
.sub{ color:var(--muted) !important; font-weight:600; }
input{ min-height:48px; padding:0 16px !important; border:1px solid var(--line) !important; border-radius:12px !important; background:var(--fundo-suave) !important; font-size:15px !important; font-weight:500; }
input:focus{ border-color:var(--primary) !important; background:#ffffff !important; box-shadow:0 0 0 3px rgba(90,90,85,.12); }
button{ min-height:48px; border-radius:999px !important; background:var(--primary-dark) !important; font-size:13px !important; font-weight:800 !important; letter-spacing:.12em; text-transform:uppercase; }
button:hover{ background:#2f2f2b !important; }
</style>
</head>

<body>

<div class="card">

    <h1>Chiavari Eventos</h1>
    <div class="sub">Acesso ao Sistema de Corridas</div>

    <input type="text" id="usuario" placeholder="Usuário">
    <input type="password" id="senha" placeholder="Senha">

    <button onclick="login()">Entrar</button>

    <div id="erro" class="erro"></div>
</div>

<script>
function login() {
    const usuario = document.getElementById("usuario").value.trim();
    const senha = document.getElementById("senha").value.trim();
    const erro = document.getElementById("erro");

    erro.style.display = "block";
    erro.style.color = "black";
    erro.innerText = "Entrando...";

    google.script.run
        .withFailureHandler(() => {
            erro.innerText = "Sem conexão com o servidor!";
            erro.style.color = "red";
        })
        .withSuccessHandler(function(resp) {

            if (resp.status === "OK") {

                localStorage.setItem("usuarioLogado", JSON.stringify({
                    usuario: resp.usuario,
                    cargo: resp.cargo
                }));

                window.location.href = "corridas.html";

            } else {
                erro.innerText = "Usuário ou senha incorretos!";
                erro.style.color = "red";
            }
        })
        .login(usuario, senha);
}
</script>

</body>
</html>
