<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <script src="../gas-cliente.js?v=20261008-servidor" data-projeto="ocorrencias"></script>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Indicadores Operacionais</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
/* =========================================================
   INDICADORES OPERACIONAIS — painel claro no padrão Chiavari
========================================================= */
:root{
  --fundo:#fbfaf7; --card:#ffffff; --borda:#eee8df; --linha:#e7e1d7;
  --texto:#251e19; --texto2:#5f5952; --grade:#efebe4; --trilho:#f1eee8;
  --primary:#5a5a55; --primary-dark:#44443f;
  --ok:#16a34a; --aviso:#d97706; --ruim:#dc2626; --s1:#2a78d6;
  --serif:"Cormorant Garamond", Georgia, serif;
  --sans:"Manrope", system-ui, sans-serif;
  --sombra:0 1px 2px rgba(37,30,25,.04), 0 10px 30px rgba(37,30,25,.07);
}
*{ box-sizing:border-box; }
html, body{ margin:0; }
body{
  min-height:100vh;
  background:
    radial-gradient(900px 380px at 10% -10%, rgba(42,120,214,.05), transparent 60%),
    radial-gradient(700px 320px at 100% 0%, rgba(235,104,52,.04), transparent 60%),
    var(--fundo);
  color:var(--texto);
  font-family:var(--sans);
  -webkit-font-smoothing:antialiased;
}
button{ font-family:inherit; }

/* ---------- Topo ---------- */
.topo{ display:flex; align-items:center; flex-wrap:wrap; gap:12px 18px; padding:16px 28px; background:#ffffff; border-bottom:1px solid var(--borda); }
.topo h1{ margin:0; font-family:var(--serif); font-size:clamp(26px, 2.8vw, 38px); font-weight:500; letter-spacing:.16em; text-transform:uppercase; line-height:1.1; }
.topo p{ margin:3px 0 0; font-size:13px; font-weight:600; color:var(--texto2); }
.topo-dir{ display:flex; align-items:center; gap:10px; margin-left:auto; flex-wrap:wrap; }
.vivo{ display:inline-flex; align-items:center; gap:7px; font-size:12px; font-weight:700; color:var(--texto2); }
.vivo i{ width:8px; height:8px; border-radius:50%; background:var(--ok); animation:pulso 1.8s infinite; }
.botao{
  display:inline-flex; align-items:center; gap:8px; min-height:40px; padding:0 18px;
  border:1px solid var(--primary-dark); border-radius:999px; background:var(--primary-dark); color:#ffffff;
  font-size:12px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; cursor:pointer;
  transition:background-color .15s, transform .15s, box-shadow .15s;
}
.botao:hover{ background:#2f2f2b; transform:translateY(-1px); box-shadow:0 6px 16px rgba(37,30,25,.18); }
.botao.contorno{ background:#ffffff; border-color:var(--linha); color:var(--texto); }
.botao.contorno:hover{ background:var(--fundo); border-color:var(--primary); box-shadow:none; }
.botao svg{ width:15px; height:15px; }

/* ---------- Corpo ---------- */
.corpo{ padding:20px 28px 36px; display:grid; gap:16px; }
.secao{ display:flex; align-items:center; gap:12px; margin:8px 0 -4px; font-size:12px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; color:#7d766d; }
.secao::after{ content:""; flex:1; height:1px; background:var(--borda); }

.card{
  min-width:0; padding:18px; border:1px solid var(--borda); border-radius:18px; background:var(--card); box-shadow:var(--sombra);
  animation:subir .6s cubic-bezier(.2,.8,.2,1) both;
}
.card h3{ margin:0; font-size:15px; font-weight:800; }
.sub{ margin:3px 0 14px; font-size:13px; font-weight:600; color:var(--texto2); }
.card-topo{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; flex-wrap:wrap; }

.g4{ display:grid; grid-template-columns:repeat(4, minmax(0, 1fr)); gap:14px; }
.g2{ display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:14px; }

/* Indicadores do topo */
.kpi{ display:flex; align-items:center; gap:14px; }
.kpi:nth-child(2){ animation-delay:.06s; } .kpi:nth-child(3){ animation-delay:.12s; } .kpi:nth-child(4){ animation-delay:.18s; }
.ico{ width:44px; height:44px; flex:0 0 44px; border-radius:12px; display:grid; place-items:center; }
.ico svg{ width:22px; height:22px; }
.kpi strong{ display:block; font-size:28px; font-weight:800; line-height:1; font-variant-numeric:tabular-nums; }
.kpi span{ display:block; margin-top:5px; font-size:13px; font-weight:700; color:var(--texto2); }
.kpi.ruim strong{ color:var(--ruim); } .kpi.ok strong{ color:var(--ok); } .kpi.aviso strong{ color:#b45309; }

/* Etiqueta de resumo */
.selo{ display:inline-flex; align-items:center; gap:6px; padding:5px 11px; border-radius:999px; font-size:12px; font-weight:800; white-space:nowrap; }
.selo.ok{ background:#dcfce7; color:#166534; } .selo.aviso{ background:#fef3c7; color:#92400e; } .selo.ruim{ background:#fee2e2; color:#b91c1c; }

/* Linhas de indicador (valor x limite) */
.lista{ display:grid; gap:14px; }
.item{ display:grid; grid-template-columns:minmax(0, 1fr) auto; align-items:baseline; gap:6px 12px; }
.item .nome{ font-size:14px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.item .vl{ font-size:14px; font-weight:800; font-variant-numeric:tabular-nums; }
.item .vl small{ font-size:12px; font-weight:700; color:var(--texto2); }
.item .trilho{ grid-column:1 / -1; position:relative; height:10px; border-radius:999px; background:var(--trilho); overflow:hidden; }
.item .cheio{ display:block; height:100%; width:0; border-radius:999px; transition:width 1.1s cubic-bezier(.2,.8,.2,1); }
.item .rodape{ grid-column:1 / -1; margin-top:-2px; font-size:12px; font-weight:600; color:var(--texto2); }
.cheio.ok{ background:linear-gradient(90deg, #138a60, #22c55e); }
.cheio.aviso{ background:linear-gradient(90deg, #b45309, #f59e0b); }
.cheio.ruim{ background:linear-gradient(90deg, #b91c1c, #f87171); }
.cheio.neutro{ background:#cfc8bc; }

/* Cabeçalho do cartão de equipe */
.card-topo.equipe{ align-items:center; margin-bottom:14px; }
.equipe-ico{ width:52px; height:52px; flex:0 0 52px; border-radius:14px; display:grid; place-items:center; background:#f4f1eb; color:var(--primary-dark); }
.equipe-ico svg{ width:26px; height:26px; }
.equipe-texto{ flex:1; min-width:0; }
.equipe-texto .sub{ margin-bottom:0; }

/* Indicador em linha: ícone · nome com barra · número grande · limite */
.ind-lista{ display:grid; gap:10px; }
.ind{
  display:grid; grid-template-columns:48px minmax(0, 1fr) 84px 92px; align-items:center; gap:14px;
  min-height:76px; padding:12px 16px 12px 12px;
  border:1px solid var(--borda); border-left:4px solid var(--cor-ind, #cfc8bc); border-radius:14px;
  background:#ffffff; box-shadow:0 2px 8px rgba(37,30,25,.04);
  animation:subir .5s cubic-bezier(.2,.8,.2,1) both;
  transition:transform .15s, box-shadow .15s;
}
.ind:hover{ transform:translateY(-1px); box-shadow:0 8px 20px rgba(37,30,25,.08); }
.ind.ok{ --cor-ind:#16a34a; --fundo-ind:#dcfce7; }
.ind.aviso{ --cor-ind:#d97706; --fundo-ind:#fef3c7; }
.ind.ruim{ --cor-ind:#dc2626; --fundo-ind:#fee2e2; background:#fffafa; }
.ind.neutro{ --cor-ind:#a8a29a; --fundo-ind:#f1eee8; }
.ind-ico{ width:46px; height:46px; border-radius:12px; display:grid; place-items:center; background:var(--fundo-ind); color:var(--cor-ind); }
.ind-ico svg{ width:22px; height:22px; }
.ind-meio{ display:grid; gap:6px; min-width:0; }
.ind-nome{ font-size:16px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.ind-trilho{ height:7px; border-radius:999px; background:var(--trilho); overflow:hidden; }
.ind-trilho .cheio{ display:block; height:100%; width:0; border-radius:999px; transition:width 1.1s cubic-bezier(.2,.8,.2,1); }
.ind-rodape{ font-size:12px; font-weight:600; color:var(--texto2); }
.ind.ruim .ind-rodape{ color:#b91c1c; }
.ind-valor{ font-size:34px; font-weight:800; line-height:1; text-align:center; color:var(--cor-ind); font-variant-numeric:tabular-nums; }
.ind.ok .ind-valor{ color:var(--texto); }
.ind-limite{ display:grid; justify-items:end; gap:2px; padding-left:14px; border-left:1px dashed var(--linha); font-size:20px; font-weight:800; color:var(--texto2); font-variant-numeric:tabular-nums; }
.ind-limite small{ font-size:11px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:#7d766d; }

@media(max-width:600px){
  .ind{ grid-template-columns:42px minmax(0, 1fr) 64px; }
  .ind-ico{ width:40px; height:40px; }
  .ind-limite{ grid-column:2 / -1; justify-items:start; padding-left:0; border-left:0; font-size:14px; display:flex; gap:6px; align-items:baseline; }
  .ind-valor{ font-size:26px; }
}

/* Medidor (teto de gastos) */
.teto{ display:grid; grid-template-columns:auto minmax(0, 1fr); gap:18px; align-items:center; }
.medidor{ position:relative; width:190px; height:190px; }
.medidor svg{ width:190px; height:190px; display:block; }
.medidor .arco{ transition:stroke-dashoffset 1.4s cubic-bezier(.2,.8,.2,1); }
.medidor .num{ font-size:38px; font-weight:800; fill:var(--texto); font-family:var(--sans); }
.medidor .txt{ font-size:11px; font-weight:800; letter-spacing:.12em; fill:var(--texto2); font-family:var(--sans); }
.teto-vazio{ font-size:14px; font-weight:600; color:var(--texto2); line-height:1.5; }

/* Ocorrências RH por setor */
.rh-total{ font-size:13px; font-weight:800; color:var(--texto2); }

.vazio{ padding:26px; text-align:center; color:var(--texto2); font-weight:600; }
.carregando{ padding:90px 20px; text-align:center; color:var(--texto2); font-weight:700; }
.carregando i{ display:block; width:34px; height:34px; margin:0 auto 14px; border-radius:50%; border:3px solid var(--grade); border-top-color:var(--s1); animation:girar .8s linear infinite; }
.erro{ color:var(--ruim); }

@keyframes subir{ from{ opacity:0; transform:translateY(12px); } to{ opacity:1; transform:none; } }
@keyframes pulso{ 0%{ box-shadow:0 0 0 0 rgba(34,197,94,.55); } 70%{ box-shadow:0 0 0 8px rgba(34,197,94,0); } 100%{ box-shadow:0 0 0 0 rgba(34,197,94,0); } }
@keyframes girar{ to{ transform:rotate(360deg); } }

@media (prefers-reduced-motion: reduce){
  .card, .vivo i, .ind{ animation:none; }
  .item .cheio, .ind-trilho .cheio, .medidor .arco{ transition:none; }
}
@media(max-width:1100px){
  .g4{ grid-template-columns:repeat(2, minmax(0, 1fr)); }
  .g2{ grid-template-columns:1fr; }
}
@media(max-width:600px){
  .g4{ grid-template-columns:1fr; }
  .topo, .corpo{ padding-left:14px; padding-right:14px; }
  .topo-dir{ margin-left:0; width:100%; }
  .teto{ grid-template-columns:1fr; justify-items:center; }
}
  </style>
</head>

<body>

  <header class="topo">
    <div>
      <h1>Indicadores Operacionais</h1>
      <p id="ultimaAtualizacao">Atualizando...</p>
    </div>
    <div class="topo-dir">
      <span class="vivo"><i></i>Ao vivo</span>
      <button type="button" class="botao contorno" onclick="iniciar()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>Atualizar
      </button>
      <button type="button" class="botao" onclick="abrirOcorrenciasOperacionais()">
        Ocorrências Operacionais
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </div>
  </header>

  <main class="corpo" id="corpo">
    <div class="carregando"><i></i>Carregando indicadores...</div>
  </main>

  <script>
/* =========================================================
   DADOS
   - buscarDadosPainelQualidade: indicadores do mês (ocorrências x limite) e teto de gastos
   - getOcorrenciasRHOperacoes: ocorrências do RH por setor e tipo (quantidade x meta máxima)
========================================================= */

const SETORES_RH = ["Setor 01", "Setor 02", "Setor 03", "Montagem"];
const TIPOS_RH = ["Atraso", "Sem Uniforme", "Sem EPI", "Uso de Celular", "Falta", "Advertência", "Ausência de Jornada"];

let dadosPainel = null;
let dadosRH = null;
let erroRH = "";

function $(id){ return document.getElementById(id); }

function escaparHTML(valor){
  if (valor === null || valor === undefined) return "";
  return String(valor).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
}
function formatarNumero(valor){ return (Number(valor) || 0).toLocaleString("pt-BR", { maximumFractionDigits:0 }); }
function normalizar(t){ return String(t || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/\s+/g, " ").trim(); }
function semMovimento(){ return !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches); }
function depois(fn){ requestAnimationFrame(function(){ requestAnimationFrame(fn); }); }

function contar(el, alvo, formato){
  if (!el) return;
  if (semMovimento()){ el.textContent = formato(alvo); return; }
  const t0 = performance.now();
  (function passo(agora){
    const t = Math.min(1, (agora - t0) / 1000);
    el.textContent = formato(alvo * (1 - Math.pow(1 - t, 3)));
    if (t < 1) requestAnimationFrame(passo);
  })(t0);
}

/* Situação de um valor contra o limite: verde, amarelo ou vermelho */
function situacao(valor, limite, aviso, ruim){
  if (!(limite > 0)) return valor > 0 ? "neutro" : "ok";
  const p = valor / limite * 100;
  if (p >= ruim) return "ruim";
  if (p >= aviso) return "aviso";
  return "ok";
}

function abrirOcorrenciasOperacionais(){
  window.location.href = "./?page=OcorrenciasOperacionais";
}

function iniciar(){
  dadosPainel = null; dadosRH = null; erroRH = "";
  $("ultimaAtualizacao").textContent = "Atualizando...";
  $("corpo").innerHTML = '<div class="carregando"><i></i>Carregando indicadores...</div>';

  google.script.run
    .withSuccessHandler(function(res){
      if (!res || !res.ok){
        $("corpo").innerHTML = '<div class="vazio erro">' + escaparHTML(res && res.msg ? res.msg : "Erro ao carregar painel.") + '</div>';
        return;
      }
      dadosPainel = res;
      desenhar();
    })
    .withFailureHandler(function(err){
      $("corpo").innerHTML = '<div class="vazio erro">Erro ao buscar dados: ' + escaparHTML(err && err.message ? err.message : err) + '</div>';
    })
    .buscarDadosPainelQualidade();

  google.script.run
    .withSuccessHandler(function(lista){ dadosRH = Array.isArray(lista) ? lista : []; desenharRH(); })
    .withFailureHandler(function(e){ console.error("Erro ao carregar ocorrências RH:", e); erroRH = "Erro ao carregar as ocorrências do RH."; desenharRH(); })
    .getOcorrenciasRHOperacoes();
}

/* ---------- Montagem ---------- */
const ICONES = {
  ok:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.5 2.5L16 9.5"/></svg>',
  ruim:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l10 18H2L12 3z"/><path d="M12 10v5M12 18h.01"/></svg>',
  interno:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21V9l9-6 9 6v12"/><path d="M9 21v-6h6v6"/></svg>',
  externo:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h11v9H3z"/><path d="M14 9h4l3 3v3h-7"/><circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/></svg>'
};
const icone = function(svg, cor){ return '<span class="ico" style="background:' + cor + '1f;color:' + cor + '">' + svg + '</span>'; };

function desenhar(){
  const d = dadosPainel;
  const mes = new Date().toLocaleDateString("pt-BR", { month:"long", year:"numeric" });
  $("ultimaAtualizacao").textContent = mes.charAt(0).toUpperCase() + mes.slice(1) + " · Atualizado às " + (d.atualizadoAs || "");

  const internos = (d.indicadores && d.indicadores.internos) || [];
  const externos = (d.indicadores && d.indicadores.externos) || [];
  const todos = internos.concat(externos).filter(function(i){ return Number(i.meta) > 0; });
  const acima = todos.filter(function(i){ return Number(i.valor) >= Number(i.meta); }).length;
  const dentro = todos.length - acima;
  const teto = d.tetoGastos || {};
  const pctInt = Number(teto.interno && teto.interno.percentual) || 0;
  const pctExt = Number(teto.externo && teto.externo.percentual) || 0;
  const corTeto = function(p){ return p >= 90 ? "ruim" : p >= 70 ? "aviso" : "ok"; };

  $("corpo").innerHTML =
    '<div class="secao">Indicadores do mês</div>' +
    '<div class="g2">' +
      cartaoIndicadores("Operações Internas", "Preparação, revisão e organização dos materiais", "listaInternos", internos, ICONES.interno) +
      cartaoIndicadores("Operações Externas", "Entrega, montagem, desmontagem e atendimento", "listaExternos", externos, ICONES.externo) +
    '</div>' +

    '<div class="secao">Teto de gastos</div>' +
    '<div class="g2">' +
      '<section class="card"><h3>Operações Internas</h3><p class="sub">Consumo do teto de gastos do mês</p>' +
        '<div class="teto">' + medidor("mInt", pctInt) + '<div class="lista" id="tetoSetores"></div></div></section>' +
      '<section class="card" style="animation-delay:.06s"><h3>Operações Externas</h3><p class="sub">Consumo do teto de gastos do mês</p>' +
        '<div class="teto">' + medidor("mExt", pctExt) + '<div class="teto-vazio">' + textoTeto(pctExt) + '</div></div></section>' +
    '</div>' +

    '<div class="secao">Ocorrências RH · ' + escaparHTML(mes) + '</div>' +
    '<div class="g4" id="ocorrenciasRH"><div class="card vazio" style="grid-column:1 / -1">Carregando ocorrências do RH...</div></div>';


  preencherIndicadores("listaInternos", internos);
  preencherIndicadores("listaExternos", externos);

  const setores = (teto.interno && teto.interno.setores) || [];
  $("tetoSetores").innerHTML = setores.length ? setores.map(function(s, i){
    const p = Number(s.percentual) || 0, sit = p >= 90 ? "ruim" : p >= 70 ? "aviso" : "ok";
    return '<div class="item"><span class="nome">' + escaparHTML(s.nomeExibicao || s.nome) + '</span><span class="vl">' + p.toFixed(0) + '%</span>' +
      '<span class="trilho"><span class="cheio ' + sit + '" data-l="' + Math.min(100, Math.max(0, p)).toFixed(1) + '" style="transition-delay:' + (0.3 + i * 0.07) + 's"></span></span></div>';
  }).join("") : '<div class="teto-vazio">Sem setores cadastrados no teto interno.</div>';

  animarMedidor("mInt", pctInt);
  animarMedidor("mExt", pctExt);
  encherBarras();
  desenharRH();
}

function textoTeto(p){
  if (p >= 100) return "<strong>Teto estourado.</strong> O gasto do mês passou do limite definido.";
  if (p >= 90) return "<strong>Atenção:</strong> o gasto está muito perto do limite do mês.";
  if (p >= 70) return "O gasto já passou de 70% do teto do mês.";
  return "Gasto dentro do esperado para o mês.";
}

function cartaoIndicadores(titulo, descricao, id, lista, icone){
  const comMeta = lista.filter(function(i){ return Number(i.meta) > 0; });
  const acima = comMeta.filter(function(i){ return Number(i.valor) >= Number(i.meta); }).length;
  const selo = !comMeta.length ? "" : acima
    ? '<span class="selo ruim">' + acima + (acima === 1 ? " no limite ou acima" : " no limite ou acima") + '</span>'
    : '<span class="selo ok">Tudo dentro do limite</span>';
  return '<section class="card"><div class="card-topo equipe"><span class="equipe-ico">' + (icone || "") + '</span>' +
    '<div class="equipe-texto"><h3>' + titulo + '</h3><p class="sub">' + descricao + '</p></div>' + selo + '</div>' +
    '<div class="ind-lista" id="' + id + '"></div></section>';
}

/* Ocorrências do mês x limite: verde até 70%, amarelo até 99%, vermelho no limite ou acima */
const SIMBOLO = {
  ok:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  aviso:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6v7M12 17.5h.01"/></svg>',
  ruim:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg>',
  neutro:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 12h12"/></svg>'
};

function preencherIndicadores(id, lista){
  const caixa = $(id);
  if (!lista.length){ caixa.innerHTML = '<div class="vazio">Nenhum indicador cadastrado.</div>'; return; }
  caixa.innerHTML = lista.map(function(item, i){
    const valor = Number(item.valor) || 0, meta = Number(item.meta) || 0;
    const sit = situacao(valor, meta, 70, 100);
    const largura = meta > 0 ? Math.min(100, valor / meta * 100) : (valor > 0 ? 100 : 0);
    const rodape = meta > 0
      ? (valor >= meta ? (valor > meta ? "Passou " + formatarNumero(valor - meta) + " do limite" : "Chegou no limite") : "Faltam " + formatarNumero(meta - valor) + " para o limite")
      : "Sem limite definido";
    return '<div class="ind ' + sit + '" style="animation-delay:' + (0.05 * i).toFixed(2) + 's">' +
      '<span class="ind-ico">' + SIMBOLO[sit] + '</span>' +
      '<div class="ind-meio"><span class="ind-nome" title="' + escaparHTML(item.nome) + '">' + escaparHTML(item.nome) + '</span>' +
        '<span class="ind-trilho"><span class="cheio ' + sit + '" data-l="' + largura.toFixed(1) + '" style="transition-delay:' + (0.2 + i * 0.06) + 's"></span></span>' +
        '<span class="ind-rodape">' + rodape + '</span></div>' +
      '<strong class="ind-valor" data-v="' + valor + '">0</strong>' +
      '<span class="ind-limite"><small>Limite</small>' + (meta > 0 ? formatarNumero(meta) : "—") + '</span>' +
    '</div>';
  }).join("");
  caixa.querySelectorAll(".ind-valor").forEach(function(el){ contar(el, Number(el.dataset.v), formatarNumero); });
}

function medidor(id, pct){
  const R = 78, C = 2 * Math.PI * R, arco = C * 0.75;
  const cor = pct >= 90 ? "#dc2626" : pct >= 70 ? "#d97706" : "#16a34a";
  return '<div class="medidor"><svg viewBox="0 0 190 190" role="img" aria-label="' + pct.toFixed(1) + '% do teto utilizado">' +
    '<circle cx="95" cy="95" r="' + R + '" fill="none" stroke="#efebe4" stroke-width="15" stroke-linecap="round" stroke-dasharray="' + arco.toFixed(1) + ' ' + C.toFixed(1) + '" transform="rotate(135 95 95)"/>' +
    '<circle class="arco" id="' + id + '" cx="95" cy="95" r="' + R + '" fill="none" stroke="' + cor + '" stroke-width="15" stroke-linecap="round" stroke-dasharray="' + arco.toFixed(1) + ' ' + C.toFixed(1) + '" stroke-dashoffset="' + arco.toFixed(1) + '" data-arco="' + arco.toFixed(1) + '" transform="rotate(135 95 95)"/>' +
    '<text class="num" x="95" y="102" text-anchor="middle" id="' + id + 'n">0%</text><text class="txt" x="95" y="126" text-anchor="middle">UTILIZADO</text></svg></div>';
}

function animarMedidor(id, pct){
  const c = $(id), arco = Number(c.dataset.arco);
  depois(function(){ c.setAttribute("stroke-dashoffset", (arco * (1 - Math.min(100, Math.max(0, pct)) / 100)).toFixed(1)); });
  contar($(id + "n"), pct, function(v){ return Math.round(v) + "%"; });
}

function encherBarras(raiz){
  depois(function(){ (raiz || document).querySelectorAll(".cheio[data-l]").forEach(function(b){ b.style.width = b.dataset.l + "%"; }); });
}

/* ---------- Ocorrências RH por setor ---------- */
function setorRH(valor){
  const t = normalizar(valor);
  if (t === "setor 1" || t === "setor 01" || t === "setor01") return "setor 01";
  if (t === "setor 2" || t === "setor 02" || t === "setor02") return "setor 02";
  if (t === "setor 3" || t === "setor 03" || t === "setor03") return "setor 03";
  if (t.includes("montagem")) return "montagem";
  return t;
}

/* Quantidade x meta máxima: verde até 50%, amarelo até 79%, vermelho a partir de 80% (mesma regra de antes) */
function desenharRH(){
  const caixa = $("ocorrenciasRH");
  if (!caixa) return;
  if (erroRH){ caixa.innerHTML = '<div class="card vazio erro" style="grid-column:1 / -1">' + erroRH + '</div>'; return; }
  if (!dadosRH) return;

  const mapa = {};
  dadosRH.forEach(function(item){ mapa[setorRH(item.setor)] = item; });

  caixa.innerHTML = SETORES_RH.map(function(nome, s){
    const dados = mapa[setorRH(nome)] || { ocorrencias:[] };
    const porTipo = {};
    (Array.isArray(dados.ocorrencias) ? dados.ocorrencias : []).forEach(function(o){
      porTipo[normalizar(o.tipo)] = { qtd:Number(o.qtd || 0), meta:Number(o.meta || 0) };
    });
    let total = 0;
    const linhas = TIPOS_RH.map(function(tipo, i){
      const v = porTipo[normalizar(tipo)] || { qtd:0, meta:0 };
      total += v.qtd;
      const sit = situacao(v.qtd, v.meta, 50, 80);
      const largura = v.meta > 0 ? Math.min(100, v.qtd / v.meta * 100) : 0;
      return '<div class="item"><span class="nome">' + escaparHTML(tipo) + '</span>' +
        '<span class="vl">' + v.qtd + (v.meta > 0 ? ' <small>/ ' + v.meta + '</small>' : "") + '</span>' +
        '<span class="trilho"><span class="cheio ' + sit + '" data-l="' + largura.toFixed(1) + '" style="transition-delay:' + (0.2 + i * 0.05) + 's"></span></span></div>';
    }).join("");
    return '<section class="card" style="animation-delay:' + (s * 0.06) + 's"><div class="card-topo"><div><h3>' + escaparHTML(nome) + '</h3>' +
      '<p class="sub">Meta máxima por tipo</p></div><span class="rh-total">' + total + (total === 1 ? " ocorrência" : " ocorrências") + '</span></div>' +
      '<div class="lista">' + linhas + '</div></section>';
  }).join("");
  encherBarras(caixa);
}

window.addEventListener("DOMContentLoaded", iniciar);
  </script>
