  transition:border-color .15s, background-color .15s, box-shadow .15s;
}
.busca-campo:focus-within{ border-color:var(--primary); background:#ffffff; box-shadow:0 0 0 3px rgba(90,90,85,.12); }
.busca-campo svg{ width:18px; height:18px; flex:0 0 18px; color:var(--muted); }
.busca-campo input{ flex:1; min-width:0; border:0 !important; outline:none; background:transparent !important; font-size:15px; font-weight:500; color:var(--text); box-shadow:none !important; }

.btn-filtros{
  display:inline-flex; align-items:center; gap:8px; min-height:46px; padding:0 18px;
  border:1px solid var(--line); border-radius:999px; background:#ffffff; color:var(--text);
  font-size:12px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; cursor:pointer;
  transition:background-color .15s, border-color .15s, color .15s;
}
.btn-filtros svg{ width:17px; height:17px; }
.btn-filtros:hover{ border-color:var(--primary); background:var(--fundo-suave); }
.btn-filtros[aria-expanded="true"]{ background:var(--primary-dark); border-color:var(--primary-dark); color:#ffffff; }
.filtros-contador{ display:none; min-width:20px; height:20px; padding:0 6px; border-radius:999px; background:#dc2626; color:#ffffff; font-size:11px; letter-spacing:0; place-items:center; }
.filtros-contador.ativo{ display:inline-grid; }

.barra-acoes{ display:flex; gap:10px; margin-left:auto; }
.barra-acoes .btn{ min-height:46px; }

.filtros-card.filtros-recolhidos{ display:none !important; }
.filtros-card{ animation:filtros-abrir .2s ease; }
.filtros-rodape{ display:flex; justify-content:flex-end; margin-top:14px; }
@keyframes filtros-abrir{ from{ opacity:0; transform:translateY(-6px); } to{ opacity:1; transform:none; } }

@media (max-width:760px){
  .atualizado-canto{ position:static; justify-content:center; margin:10px 0 -6px; }
  .barra-acoes{ width:100%; margin-left:0; }
  .barra-acoes .btn{ flex:1; }
}

<body>

    <section class="tabela-card">

<tr>

      <div class="modal-body">
<div class="modal-grid">

  <!-- DEPARTAMENTO -->

  <!-- IDENTIFICAÇÃO DO ITEM -->

  >

<!-- CATEGORIA -->
<div class="area-categoria-item">

  <input

      <div class="modal-footer">
        <button class="btn btn-light" onclick="fecharModalNovaOcorrencia()">Cancelar</button>
        <button class="btn btn-primary" id="btnSalvarOcorrencia" onclick="salvarOcorrencia()">Salvar ocorrência</button>

  <script>
let paginaAtual = 1;
let totalPaginas = 1;
let timeoutBusca = null;

let catalogoItensOcorrencias = null;
let carregandoCatalogoItens = false;

    const ocorrenciasInternas = [
      "Material sem capa",
      "Item sem revisão",
      "Itens danificados",
      "Galpão desorganizado",
      "Prazo"
    ];

const ocorrenciasExternas = [
  "Itens esquecidos",
  "Itens sem capa de proteção",
  "Descuido com material"
];

    const supervisoresPorDepartamento = {
      "Operações Internas": ["Jonathan"],
      "Operações Externas": ["Matheus Martins", "Paulo Henrique"]
    };

    function iniciar() {
      definirDatasPadrao();
      preencherFiltroOcorrencias();
      carregarOcorrencias(1);
    }

    // Datas começam vazias: ao entrar, mostra todas as ocorrências (paginadas)
    function definirDatasPadrao() {
      document.getElementById("filtroDataInicial").value = "";
      document.getElementById("filtroDataFinal").value = "";
    }

    function preencherFiltroOcorrencias() {
      const select = document.getElementById("filtroOcorrencia");
      const todos = [...new Set([...ocorrenciasInternas, ...ocorrenciasExternas])];

      select.innerHTML = `<option value="">Todas</option>` +
        todos.map(item => `<option value="${escaparHTML(item)}">${escaparHTML(item)}</option>`).join("");
    }

    function carregarOcorrencias(pagina = 1) {
      paginaAtual = pagina;

      const filtros = {
        pagina: paginaAtual,
        limite: 20,
        dataInicial: document.getElementById("filtroDataInicial").value || "",
        dataFinal: document.getElementById("filtroDataFinal").value || "",
        departamento: document.getElementById("filtroDepartamento").value || "",
        supervisor: document.getElementById("filtroSupervisor").value || "",
        ocorrencia: document.getElementById("filtroOcorrencia").value || "",
        status: document.getElementById("filtroStatus").value || "",
        busca: document.getElementById("filtroBusca").value.trim() || ""
      };

      const tbody = document.getElementById("tbodyOcorrencias");
      tbody.innerHTML = `<tr><td colspan="7" class="vazio">Carregando ocorrências...</td></tr>`;

      google.script.run
        .withSuccessHandler(function(res) {
          if (!res || !res.ok) {
tbody.innerHTML = `<tr><tdcolspan="7" class="vazio">Erro ao carregar ocorrências.</td></tr>`;
            return;
          }

          renderizarOcorrencias(res);
        })
        .withFailureHandler(function(err) {
          tbody.innerHTML = `<tr><td colspan="7" class="vazio">Erro: ${escaparHTML(err.message || err)}</td></tr>`;
        })
        .buscarOcorrenciasOperacionais(filtros);
    }

function renderizarOcorrencias(res) {

  const tbody =
    document.getElementById(
      "tbodyOcorrencias"
    );

  const dados =
    res.dados || [];


  paginaAtual =
    res.pagina || 1;

  totalPaginas =
    res.totalPaginas || 1;


  document.getElementById(
    "contadorOcorrencias"
  ).innerText =
    `Mostrando ${dados.length} de ${res.total || 0} ocorrência(s)`;


  document.getElementById(
    "paginaAtual"
  ).innerText =
    paginaAtual;


  document.getElementById(
    "btnAnterior"
  ).disabled =
    paginaAtual <= 1;


  document.getElementById(
    "btnProxima"
  ).disabled =
    paginaAtual >= totalPaginas;


  document.getElementById(
    "ultimaAtualizacao"
  ).innerText =
    "Atualizado às " +
    (res.atualizadoAs || "");


  if (!dados.length) {

    tbody.innerHTML = `
      <tr>
        <td colspan="7" class="vazio">
          Nenhuma ocorrência encontrada.
        </td>
      </tr>
    `;

    return;
  }


  tbody.innerHTML =
    dados.map(function(item) {

      const tagDepartamento =
        item.departamento ===
        "Operações Internas"
          ? "tag-interno"
          : "tag-externo";


      /*
       * Registros antigos podem não possuir
       * quantidade ou item.
       * Nesse caso mostramos "-".
       */
      const quantidade =
        item.quantidade
          ? escaparHTML(item.quantidade)
          : '<span class="status-vazio">-</span>';


      const nomeItem =
        item.item
          ? escaparHTML(item.item)
          : '<span class="status-vazio">-</span>';


      return `
        <tr>

          <td>
            ${escaparHTML(
              item.dataHora || ""
            )}
          </td>

<td>
  ${
    item.numeroPedido
      ? `<span class="pedido-destaque">
          ${escaparHTML(item.numeroPedido)}
        </span>`
      : '<span class="status-vazio">-</span>'
  }
</td>

          <td>
            <span class="tag ${tagDepartamento}">
              ${escaparHTML(
                item.departamento || ""
              )}
            </span>
          </td>

          <td>
            ${escaparHTML(
              item.supervisor || ""
            )}
          </td>

          <td>
            ${escaparHTML(
              item.ocorrencia || ""
            )}
          </td>

          <td class="col-quantidade">
            ${quantidade}
          </td>

          <td class="col-item-ocorrencia">
            ${nomeItem}
          </td>

        </tr>
      `;

    }).join("");
}
function abrirModalNovaOcorrencia() {

  limparModal();

  document
    .getElementById("modalOcorrencia")
    .classList
    .add("ativo");

  /*
   * Já deixa o catálogo carregando
   * enquanto a pessoa começa o preenchimento.
   */
  carregarCatalogoItensOcorrencias();
}


function fecharModalNovaOcorrencia() {

  document
    .getElementById("modalOcorrencia")
    .classList
    .remove("ativo");
}


/* =========================================================
   LIMPAR MODAL
   ========================================================= */

function limparModal() {

  document.getElementById("novoDepartamento").value = "";
  document.getElementById("novoSupervisor").value = "";
  document.getElementById("novaOcorrencia").value = "";

  document.getElementById("novaCategoria").value = "";
  document.getElementById("novoItem").value = "";

  document.getElementById("novoPedido").value = "";
  document.getElementById("novaObservacao").value = "";
  document.getElementById("novaSenha").value = "";

  document.getElementById("novoStatus").value = "Aberto";


  document
    .querySelectorAll(
      "#modalOcorrencia .btn-selecao"
    )
    .forEach(function(botao) {
      botao.classList.remove("selecionado");
    });


  document.getElementById(
    "botoesSupervisor"
  ).innerHTML = "";

  document.getElementById(
    "botoesOcorrencia"
  ).innerHTML = "";

document.getElementById(
  "listaCategoriasOcorrencia"
).innerHTML = "";

document.getElementById(
  "listaItensOcorrencia"
).innerHTML = "";


  document.getElementById(
    "campoSupervisorNovo"
  ).style.display = "none";

  document.getElementById(
    "campoOcorrenciaNova"
  ).style.display = "none";

  document.getElementById(
    "blocoIdentificacaoItem"
  ).style.display = "none";

  document.getElementById(
    "areaSelecaoItem"
  ).style.display = "none";

  document.getElementById(
    "campoStatusNovo"
  ).style.display = "none";


  const msg =
    document.getElementById(
      "mensagemModal"
    );

  msg.className = "mensagem";
  msg.innerText = "";
}


/* =========================================================
   MARCAR UM BOTÃO COMO SELECIONADO
   ========================================================= */

function marcarBotaoSelecionado(botao) {

  if (!botao || !botao.parentElement) {
    return;
  }

  botao
    .parentElement
    .querySelectorAll(".btn-selecao")
    .forEach(function(item) {
      item.classList.remove("selecionado");
    });

  botao.classList.add("selecionado");
}


/* =========================================================
   DEPARTAMENTO
   ========================================================= */

function selecionarDepartamento(
  botao,
  departamento
) {

  document.getElementById(
    "novoDepartamento"
  ).value = departamento;

  marcarBotaoSelecionado(botao);


  /*
   * Ao trocar departamento,
   * limpa tudo que depende dele.
   */
  document.getElementById(
    "novoSupervisor"
  ).value = "";

  document.getElementById(
    "novaOcorrencia"
  ).value = "";

  document.getElementById(
    "novaCategoria"
  ).value = "";

  document.getElementById(
    "novoItem"
  ).value = "";


  document.getElementById(
    "blocoIdentificacaoItem"
  ).style.display = "none";

  document.getElementById(
    "areaSelecaoItem"
  ).style.display = "none";

  document.getElementById(
    "campoStatusNovo"
  ).style.display = "none";


  renderizarSupervisores(
    departamento
  );

  renderizarOcorrenciasDepartamento(
    departamento
  );


  document.getElementById(
    "campoSupervisorNovo"
  ).style.display = "flex";

  document.getElementById(
    "campoOcorrenciaNova"
  ).style.display = "flex";
}


/* =========================================================
   SUPERVISORES
   ========================================================= */

function renderizarSupervisores(
  departamento
) {

  const container =
    document.getElementById(
      "botoesSupervisor"
    );

  container.innerHTML = "";

  const supervisores =
    supervisoresPorDepartamento[
      departamento
    ] || [];


  supervisores.forEach(function(nome) {

    const botao =
      document.createElement("button");

    botao.type = "button";
    botao.className = "btn-selecao";
    botao.textContent = nome;

    botao.addEventListener(
      "click",
      function() {

        selecionarSupervisor(
          botao,
          nome
        );

      }
    );

    container.appendChild(botao);
  });
}


function selecionarSupervisor(
  botao,
  supervisor
) {

  document.getElementById(
    "novoSupervisor"
  ).value = supervisor;

  marcarBotaoSelecionado(botao);
}


/* =========================================================
   OCORRÊNCIAS
   ========================================================= */

function renderizarOcorrenciasDepartamento(
  departamento
) {

  const container =
    document.getElementById(
      "botoesOcorrencia"
    );

  container.innerHTML = "";


  const ocorrencias =
    departamento === "Operações Internas"
      ? ocorrenciasInternas
      : departamento === "Operações Externas"
        ? ocorrenciasExternas
        : [];


  ocorrencias.forEach(function(nome) {

    const botao =
      document.createElement("button");

    botao.type = "button";
    botao.className = "btn-selecao";
    botao.textContent = nome;

    botao.addEventListener(
      "click",
      function() {

        selecionarOcorrencia(
          botao,
          nome
        );

      }
    );

    container.appendChild(botao);
  });
}


function selecionarOcorrencia(
  botao,
  ocorrencia
) {

  document.getElementById(
    "novaOcorrencia"
  ).value = ocorrencia;

  marcarBotaoSelecionado(botao);


  /*
   * Limpa categoria/item quando
   * muda o tipo de ocorrência.
   */
  limparIdentificacaoItem();


  atualizarStatusObrigatorio();

  atualizarIdentificacaoItem();
}


/* =========================================================
   STATUS
   ========================================================= */

function atualizarStatusObrigatorio() {

  const ocorrencia =
    document.getElementById(
      "novaOcorrencia"
    ).value;

  document.getElementById(
    "campoStatusNovo"
  ).style.display =
    ocorrencia === "Itens esquecidos"
      ? "flex"
      : "none";
}


/* =========================================================
   NORMALIZAÇÃO NO HTML
   ========================================================= */

function normalizarTextoOcorrencia(
  valor
) {

  return String(valor || "")
    .trim()
    .toLowerCase()
    .normalize("NFD")
    .replace(
      /[\u0300-\u036f]/g,
      ""
    );
}

function ocorrenciaExigeQuantidade(
  ocorrencia
) {

  const valor =
    normalizarTextoOcorrencia(
      ocorrencia
    );

const ocorrenciasComQuantidade = [
  "material sem capa",
  "item sem revisao",
  "itens sem revisao",
  "itens danificados",
  "itens sem capa de protecao"
];

  return ocorrenciasComQuantidade.includes(
    valor
  );
}
/* =========================================================
   OCORRÊNCIAS QUE EXIGEM ITEM
   ========================================================= */

function ocorrenciaExigeItem(
  ocorrencia
) {

  const valor =
    normalizarTextoOcorrencia(
      ocorrencia
    );

  const ocorrenciasComItem = [
    "material sem capa",
    "item sem revisao",
    "itens danificados",
    "itens sem capa de protecao"
  ];

  return ocorrenciasComItem.includes(
    valor
  );
}


/* =========================================================
   MOSTRAR / ESCONDER IDENTIFICAÇÃO
   ========================================================= */
function atualizarIdentificacaoItem() {

  const ocorrencia =
    document.getElementById(
      "novaOcorrencia"
    ).value;

  const bloco =
    document.getElementById(
      "blocoIdentificacaoItem"
    );

  const areaQuantidade =
    document.getElementById(
      "areaQuantidadeItem"
    );


  /*
   * Se a ocorrência não trabalha
   * com identificação do item,
   * esconde todo o bloco.
   */
  if (
    !ocorrenciaExigeItem(
      ocorrencia
    )
  ) {

    bloco.style.display = "none";

    limparIdentificacaoItem();

    return;
  }


  bloco.style.display = "block";


  /*
   * Quantidade aparece somente para:
   *
   * - Material sem capa
   * - Item sem revisão
   * - Itens danificados
   */
  if (
    ocorrenciaExigeQuantidade(
      ocorrencia
    )
  ) {

    areaQuantidade.style.display = "flex";

  } else {

    areaQuantidade.style.display = "none";

    document.getElementById(
      "novaQuantidade"
    ).value = "";
  }


  if (
    catalogoItensOcorrencias !== null
  ) {

    renderizarCategorias();

  } else {

    carregarCatalogoItensOcorrencias();

  }
}

/* =========================================================
   CARREGAR CATÁLOGO DA PLANILHA
   ========================================================= */

function carregarCatalogoItensOcorrencias() {

  // Já carregou anteriormente
  if (catalogoItensOcorrencias !== null) {
    renderizarCategorias();
    return;
  }

  // Já existe uma chamada em andamento
  if (carregandoCatalogoItens) {
    return;
  }

  carregandoCatalogoItens = true;


  google.script.run

    .withSuccessHandler(function(res) {

      carregandoCatalogoItens = false;

      if (!res || !res.ok) {

        catalogoItensOcorrencias = null;

        console.error(
          "Erro ao carregar catálogo:",
          res && res.msg
            ? res.msg
            : "Resposta inválida."
        );

        mostrarMensagem(
          res && res.msg
            ? res.msg
            : "Não foi possível carregar as categorias.",
          "erro"
        );

        return;
      }


      catalogoItensOcorrencias =
        res.categorias || [];


      console.log(
        "Catálogo carregado:",
        catalogoItensOcorrencias
      );


      renderizarCategorias();

    })

    .withFailureHandler(function(err) {

      carregandoCatalogoItens = false;

      catalogoItensOcorrencias = null;

      console.error(
        "Erro ao carregar catálogo:",
        err
      );

      mostrarMensagem(
        "Erro ao carregar categorias: " +
        (err.message || err),
        "erro"
      );

    })

    .buscarCatalogoItensOcorrencias();
}
/* =========================================================
   CATEGORIAS
   ========================================================= */

function renderizarCategorias() {

  const lista =
    document.getElementById(
      "listaCategoriasOcorrencia"
    );

  if (!lista) {
    console.error(
      "Elemento listaCategoriasOcorrencia não encontrado."
    );
    return;
  }

  lista.innerHTML = "";


  const categorias =
    catalogoItensOcorrencias || [];


  categorias.forEach(function(categoria) {

    const option =
      document.createElement("option");

    option.value =
      categoria.nome;

    lista.appendChild(option);

  });


  console.log(
    categorias.length +
    " categorias carregadas no autocomplete."
  );
}

function atualizarAutocompleteCategoria() {

  const campoCategoria =
    document.getElementById(
      "novaCategoria"
    );

  const valorDigitado =
    normalizarTextoOcorrencia(
      campoCategoria.value
    );


  const categorias =
    catalogoItensOcorrencias || [];


  const categoriaEncontrada =
    categorias.find(
      function(categoria) {

        return (
          normalizarTextoOcorrencia(
            categoria.nome
          ) === valorDigitado
        );

      }
    );


  /*
   * Sempre que alterar categoria,
   * limpa o item anterior.
   */
  document.getElementById(
    "novoItem"
  ).value = "";


  document.getElementById(
    "listaItensOcorrencia"
  ).innerHTML = "";


  const areaItem =
    document.getElementById(
      "areaSelecaoItem"
    );


  /*
   * Enquanto a categoria digitada
   * ainda não corresponder a uma
   * categoria real, não libera os itens.
   */
  if (!categoriaEncontrada) {

    areaItem.style.display = "none";

    return;
  }


  /*
   * Corrige automaticamente a escrita
   * para o nome oficial da categoria.
   */
  campoCategoria.value =
    categoriaEncontrada.nome;


  preencherAutocompleteItens(
    categoriaEncontrada
  );


  areaItem.style.display = "flex";
}

/* =========================================================
   ITENS DA CATEGORIA
   ========================================================= */

function obterItensCategoriaSelecionada() {

  const categoriaSelecionada =
    document.getElementById(
      "novaCategoria"
    ).value;


  if (!categoriaSelecionada) {
    return [];
  }


  const categorias =
    catalogoItensOcorrencias || [];


  const registro =
    categorias.find(
      function(categoria) {

        return (
          normalizarTextoOcorrencia(
            categoria.nome
          ) ===
          normalizarTextoOcorrencia(
            categoriaSelecionada
          )
        );

      }
    );


  return registro
    ? (registro.itens || [])
    : [];
}
function preencherAutocompleteItens(
  categoria
) {

  const datalist =
    document.getElementById(
      "listaItensOcorrencia"
    );

  datalist.innerHTML = "";


  const itens =
    categoria &&
    Array.isArray(categoria.itens)
      ? categoria.itens
      : [];


  itens.forEach(
    function(nomeItem) {

      const option =
        document.createElement(
          "option"
        );

      option.value =
        nomeItem;

      datalist.appendChild(
        option
      );

    }
  );
}


/* =========================================================
   VALIDAR ITEM DIGITADO
   ========================================================= */

function validarItemDigitado() {

  const categoriaDigitada =
    document.getElementById(
      "novaCategoria"
    ).value;


  const itemDigitado =
    document.getElementById(
      "novoItem"
    ).value;


  const aviso =
    document.getElementById(
      "avisoCategoriaItem"
    );


  aviso.style.display = "none";
  aviso.innerText = "";


  if (!itemDigitado) {
    return;
  }


  const categorias =
    catalogoItensOcorrencias || [];


  const categoria =
    categorias.find(
      function(registro) {

        return (
          normalizarTextoOcorrencia(
            registro.nome
          ) ===
          normalizarTextoOcorrencia(
            categoriaDigitada
          )
        );

      }
    );


  if (!categoria) {
    return;
  }


  const itemEncontrado =
    (categoria.itens || []).find(
      function(nomeItem) {

        return (
          normalizarTextoOcorrencia(
            nomeItem
          ) ===
          normalizarTextoOcorrencia(
            itemDigitado
          )
        );

      }
    );


  /*
   * Se selecionou uma opção verdadeira
   * do autocomplete, corrige para o
   * nome oficial.
   */
  if (itemEncontrado) {

    document.getElementById(
      "novoItem"
    ).value = itemEncontrado;

  }
}
/* =========================================================
   LIMPAR CATEGORIA / ITEM
   ========================================================= */

function limparIdentificacaoItem() {

  document.getElementById(
    "novaCategoria"
  ).value = "";

  document.getElementById(
    "novoItem"
  ).value = "";

  document.getElementById(
    "novaQuantidade"
  ).value = "";


  document.getElementById(
    "listaItensOcorrencia"
  ).innerHTML = "";


  document.getElementById(
    "areaSelecaoItem"
  ).style.display = "none";


  document.getElementById(
    "areaQuantidadeItem"
  ).style.display = "none";


  const aviso =
    document.getElementById(
      "avisoCategoriaItem"
    );

  if (aviso) {
    aviso.style.display = "none";
    aviso.innerText = "";
  }
}
/* =========================================================
   SALVAR
   ========================================================= */

function salvarOcorrencia() {

  const btn =
    document.getElementById(
      "btnSalvarOcorrencia"
    );


  const dados = {

    departamento:
      document.getElementById(
        "novoDepartamento"

quantidade:

if (

) {

    );

    (catalogoItensOcorrencias || [])

          );

      );


  if (!categoriaValida) {

  /*

   */
  dados.categoria =

  if (!dados.item) {

    mostrarMensagem(
      "Informe qual é o item.",
      "erro"
    );

    return;
  }


  const itemValido =
    (categoriaValida.itens || [])
      .find(
        function(nomeItem) {

          return (
            normalizarTextoOcorrencia(
              nomeItem
            ) ===
            normalizarTextoOcorrencia(
              dados.item
            )
          );

        }
      );


  if (!itemValido) {

    mostrarMensagem(
      "Selecione um item válido da lista.",
      "erro"
    );

    return;
  }


  /*
   * Usa sempre o nome oficial
   * cadastrado na planilha.
   */
  dados.item =
    itemValido;
}


  if (false) {

    mostrarMensagem(
      "Digite a senha para salvar.",
      "erro"
    );

    return;
  }


  btn.disabled = true;
  btn.innerText = "Salvando...";


  google.script.run

    .withSuccessHandler(
      function(res) {

        btn.disabled = false;

        btn.innerText =
          "Salvar ocorrência";


        if (!res || !res.ok) {

          mostrarMensagem(
            res && res.msg
              ? res.msg
              : "Erro ao salvar ocorrência.",
            "erro"
          );

          return;
        }


        mostrarMensagem(
          "Ocorrência salva com sucesso.",

        );


        setTimeout(
          function() {

            fecharModalNovaOcorrencia();

            carregarOcorrencias(1);

          },
          700
        );

      }
    )

    .withFailureHandler(
      function(err) {

        btn.disabled = false;

        btn.innerText =
          "Salvar ocorrência";

        mostrarMensagem(
          "Erro: " +
          (err.message || err),
          "erro"
        );

      }
    )

    .salvarOcorrenciaOperacional(
      dados
    );
}

    function mostrarMensagem(texto, tipo) {

          }

          carregarOcorrencias(paginaAtual);
        })

      const dia = String(data.getDate()).padStart(2, "0");
      return `${ano}-${mes}-${dia}`;
    }

    function escaparHTML(valor) {
      if (valor === null || valor === undefined) return "";

      return String(valor)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function escaparAtributo(valor) {
      if (valor === null || valor === undefined) return "";

      return String(valor)
        .replace(/\\/g, "\\\\")
        .replace(/'/g, "\\'")
        .replace(/"/g, "&quot;");

<script>
/* Filtros recolhidos: o ícone abre e fecha; o número mostra quantos estão em uso */
function alternarFiltros(forcar){
  const painel = document.getElementById("painelFiltros");
  const botao = document.getElementById("btnFiltros");
  const abrir = typeof forcar === "boolean" ? forcar : painel.classList.contains("filtros-recolhidos");
  painel.classList.toggle("filtros-recolhidos", !abrir);
  botao.setAttribute("aria-expanded", abrir ? "true" : "false");
}

function atualizarContadorFiltros(){
  const ativos = ["filtroDataInicial", "filtroDataFinal", "filtroDepartamento", "filtroSupervisor", "filtroOcorrencia", "filtroStatus"]
    .filter(function(id){ const el = document.getElementById(id); return el && el.value; }).length;
  const c = document.getElementById("contadorFiltros");
  c.textContent = ativos || "";
  c.classList.toggle("ativo", ativos > 0);
}

["filtroDataInicial", "filtroDataFinal", "filtroDepartamento", "filtroSupervisor", "filtroOcorrencia", "filtroStatus"].forEach(function(id){
  const el = document.getElementById(id);
  if (el) el.addEventListener("change", atualizarContadorFiltros);
});

document.addEventListener("keydown", function(e){
  if (e.key === "Escape" && !document.getElementById("painelFiltros").classList.contains("filtros-recolhidos")) alternarFiltros(false);
});
</script>
