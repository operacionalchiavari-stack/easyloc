  <title>RH · Equipe Free</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* =========================================================
       PAINEL DA RH — pagamento dos free por ciclo (ter a seg),
       fotos dos eventos e avaliação de uniforme.
    ========================================================= */
    :root{
      --bg:#f6f4ef; --card:#ffffff; --campo:#fbfaf7; --line:#e7e1d7; --borda:#eee8df;
      --text:#251e19; --muted:#77716a; --suave:#a8a29a; --soft:#f1eee8;
      --escuro:#2b2a26; --escuro-2:#44443f;
      --ok:#16a34a; --ok-forte:#166534; --ok-soft:#ecf8ef; --ok-borda:#c9ecd3;
      --aviso:#b45309; --aviso-soft:#fdf4e3; --aviso-borda:#f3dfb4;
      --erro:#dc2626; --erro-soft:#fdeeee;
      --azul:var(--el-button-primary-bg,#7d603d); --azul-soft:var(--el-button-primary-soft,#f4efe8);
      --serif:"Cormorant Garamond", Georgia, serif; --sans:"Manrope", system-ui, sans-serif;
      --sombra:0 1px 2px rgba(37,30,25,.04), 0 8px 28px rgba(37,30,25,.06);
    }
    *{ box-sizing:border-box; margin:0; padding:0; }
    html{ background:var(--bg); }
    body{ width:100%; margin:0; padding:24px clamp(16px, 2.4vw, 40px) 60px; background:var(--bg); color:var(--text); font-family:var(--sans); font-size:14px; line-height:1.45; -webkit-font-smoothing:antialiased; }
    button, input, select, textarea{ font:inherit; color:inherit; }
    button{ cursor:pointer; }
    a{ color:inherit; }

    .tela{ display:none; }
    .tela.ativa{ display:block; }
    .carregando{ display:grid; place-items:center; min-height:50vh; color:var(--muted); }
    .spinner{ width:30px; height:30px; border-radius:50%; border:3px solid var(--line); border-top-color:var(--escuro); animation:girar .8s linear infinite; margin:0 auto 12px; }
    @keyframes girar{ to{ transform:rotate(360deg); } }

    .btn{ display:inline-flex; align-items:center; justify-content:center; gap:7px; min-height:40px; padding:0 16px; border-radius:12px; border:1px solid var(--escuro); background:var(--escuro); color:#fff; font-weight:600; font-size:13px; white-space:nowrap; }
    .btn[disabled]{ opacity:.5; cursor:default; }
    .btn-claro{ background:var(--card); border-color:var(--line); color:var(--text); }
    .btn-ok{ background:var(--ok); border-color:var(--ok); }
    .btn-mini{ min-height:30px; padding:0 10px; font-size:12px; border-radius:9px; }
    .link{ background:none; border:0; font-weight:600; text-decoration:underline; text-underline-offset:3px; }

    .campo{ display:block; margin-bottom:12px; }
    .campo > span{ display:block; font-size:12px; font-weight:600; color:var(--muted); margin-bottom:6px; }
    .campo input, .campo select, .campo textarea{ width:100%; min-height:44px; padding:10px 12px; border-radius:12px; border:1px solid var(--line); background:var(--campo); outline:none; font-size:15px; }
    .erro{ display:none; margin-bottom:12px; padding:10px 12px; border-radius:12px; background:var(--erro-soft); color:var(--erro); font-weight:600; font-size:13px; }
    .erro.ver{ display:block; }

    /* ---------- Login ---------- */
    .login{ max-width:380px; margin:12vh auto 0; }
    .login h1{ font-family:var(--serif); font-size:40px; font-weight:600; text-align:center; }
    .login p{ text-align:center; color:var(--muted); margin:6px 0 22px; }
    .cartao{ background:var(--card); border:1px solid var(--line); border-radius:20px; padding:22px; box-shadow:var(--sombra); }

    /* ---------- Topo ---------- */
    .topo{ display:flex; flex-wrap:wrap; align-items:center; gap:14px 20px; margin-bottom:20px; }
    .topo h1{ font-family:var(--serif); font-size:34px; font-weight:600; letter-spacing:.04em; }
    .topo small{ display:block; color:var(--muted); font-size:12.5px; }
    .ciclo{ display:flex; align-items:center; gap:4px; margin-left:auto; }
    .ciclo button{ width:38px; height:38px; border-radius:50%; border:1px solid var(--line); background:var(--card); font-size:18px; }
    .ciclo strong{ min-width:230px; text-align:center; font-size:15px; }
    .ciclo strong small{ display:block; font-weight:600; }
    .topo-acoes{ display:flex; gap:8px; }

    .resumo{ display:grid; grid-template-columns:repeat(5, minmax(0,1fr)); gap:10px; margin-bottom:18px; }
    .tile{ background:var(--card); border:1px solid var(--borda); border-radius:16px; padding:14px 16px; box-shadow:var(--sombra); }
    .tile small{ display:block; font-size:11px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--suave); }
    .tile strong{ display:block; font-size:24px; font-weight:600; margin-top:4px; }
    .tile.verde strong{ color:var(--ok-forte); }
    .tile.ambar strong{ color:var(--aviso); }
    .tile.vermelho strong{ color:var(--erro); }

    .abas{ display:flex; gap:6px; padding:5px; background:var(--soft); border-radius:14px; margin-bottom:16px; width:max-content; max-width:100%; overflow:auto; }
    .aba{ border:0; background:none; min-height:38px; padding:0 16px; border-radius:10px; font-weight:600; color:var(--muted); white-space:nowrap; }
    .aba.ativa{ background:var(--card); color:var(--text); box-shadow:0 1px 3px rgba(37,30,25,.08); }

    /* ---------- Evento ---------- */
    .evento{ background:var(--card); border:1px solid var(--borda); border-radius:18px; box-shadow:var(--sombra); margin-bottom:14px; overflow:hidden; }
    .evento-topo{ display:flex; flex-wrap:wrap; align-items:center; gap:8px 16px; padding:14px 18px; border-bottom:1px solid var(--borda); }
    .evento-titulo{ flex:1; min-width:240px; }
    .evento-titulo strong{ display:block; font-family:var(--serif); font-size:22px; font-weight:600; line-height:1.15; }
    .evento-titulo span{ color:var(--muted); font-size:13px; }
    .evento-total{ text-align:right; }
    .evento-total small{ display:block; color:var(--suave); font-size:11px; font-weight:600; text-transform:uppercase; }
    .evento-total strong{ font-size:18px; }

    table{ width:100%; border-collapse:collapse; }
    th{ text-align:left; font-size:11px; font-weight:600; letter-spacing:.05em; text-transform:uppercase; color:var(--suave); padding:10px 12px; background:var(--campo); border-bottom:1px solid var(--borda); white-space:nowrap; }
    td{ padding:10px 12px; border-bottom:1px solid var(--borda); vertical-align:top; }
    tr:last-child td{ border-bottom:0; }
    .num{ text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums; }
    .pessoa{ display:flex; gap:10px; align-items:center; }
    .foto{ width:38px; height:38px; border-radius:50%; object-fit:cover; background:var(--soft); flex:none; display:grid; place-items:center; color:var(--muted); font-weight:600; overflow:hidden; }
    .foto img{ width:100%; height:100%; object-fit:cover; }
    .pessoa b{ display:block; }
    .pessoa small{ color:var(--muted); }
    .nota{ display:inline-flex; padding:1px 7px; border-radius:999px; background:var(--aviso-soft); color:var(--aviso); font-size:11px; font-weight:600; }
    .chip{ display:inline-flex; align-items:center; gap:4px; padding:3px 9px; border-radius:999px; background:var(--soft); color:var(--escuro-2); font-size:11.5px; font-weight:600; white-space:nowrap; }
    .chip.PAGAR, .chip.ok{ background:var(--ok-soft); color:var(--ok-forte); }
    .chip.REVISAR, .chip.aviso{ background:var(--aviso-soft); color:var(--aviso); }
    .chip.NAO_PAGAR, .chip.erro{ background:var(--erro-soft); color:var(--erro); }
    .chip.PAGO{ background:var(--el-color-surface-soft,#f6f7f9); color:var(--el-color-text,#1f2020); }
    .chip.EM_ANDAMENTO{ background:var(--soft); color:var(--muted); }
    .motivos{ margin-top:4px; font-size:11.5px; color:var(--aviso); }
    .motivos div::before{ content:"• "; }
    .hora{ font-weight:600; }
    .sub{ display:block; font-size:11.5px; color:var(--muted); }
    .extra label{ display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600; cursor:pointer; }
    .extra input{ width:16px; height:16px; accent-color:var(--escuro); }
    .acoes-linha{ display:flex; flex-wrap:wrap; gap:6px; justify-content:flex-end; }

    /* ---------- Fotos e uniforme ---------- */
    .galeria{ display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:10px; padding:14px 18px; }
    .miniatura{ position:relative; border-radius:12px; overflow:hidden; border:1px solid var(--line); background:var(--soft); cursor:zoom-in; aspect-ratio:4/3; }
    .miniatura img{ width:100%; height:100%; object-fit:cover; display:block; }
    .miniatura span{ position:absolute; left:6px; right:6px; bottom:6px; padding:3px 7px; border-radius:7px; background:rgba(16,15,13,.66); color:#fff; font-size:11px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .uniforme-lista{ display:grid; grid-template-columns:repeat(auto-fill, minmax(330px, 1fr)); gap:10px; padding:0 18px 18px; }
    .uniforme{ display:grid; grid-template-columns:70px 110px 1fr; gap:10px; padding:10px; border:1px solid var(--line); border-radius:14px; }
    .uniforme .cad{ width:70px; height:70px; border-radius:12px; object-fit:cover; background:var(--soft); display:grid; place-items:center; color:var(--muted); font-weight:600; overflow:hidden; }
    .uniforme .cad img{ width:100%; height:100%; object-fit:cover; }
    .uniforme .uni{ width:110px; height:146px; border-radius:12px; overflow:hidden; background:var(--soft); display:grid; place-items:center; text-align:center; color:var(--suave); font-size:11px; font-weight:600; cursor:zoom-in; }
    .uniforme .uni img{ width:100%; height:100%; object-fit:cover; }
    .uniforme b{ display:block; }
    .botoes-uniforme{ display:flex; flex-wrap:wrap; gap:5px; margin:8px 0 6px; }
    .botoes-uniforme button{ padding:5px 9px; border-radius:9px; border:1px solid var(--line); background:#fff; font-size:12px; font-weight:600; }
    .botoes-uniforme button.ativo.OK{ background:var(--ok-soft); border-color:var(--ok); color:var(--ok-forte); }
    .botoes-uniforme button.ativo.INCOMPLETO{ background:var(--aviso-soft); border-color:var(--aviso); color:var(--aviso); }
    .botoes-uniforme button.ativo.SEM{ background:var(--erro-soft); border-color:var(--erro); color:var(--erro); }
    .uniforme input{ width:100%; padding:6px 9px; border-radius:9px; border:1px solid var(--line); background:var(--campo); font-size:12.5px; }
    .rotulo-secao{ padding:12px 18px 0; font-size:11px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--suave); }

    .vazio{ text-align:center; padding:40px; color:var(--muted); }
    .vazio strong{ display:block; color:var(--text); font-size:16px; margin-bottom:4px; }

    /* ---------- Janela e lightbox ---------- */
    .fundo{ position:fixed; inset:0; background:rgba(37,30,25,.5); z-index:20; display:none; align-items:center; justify-content:center; padding:20px; }
    .fundo.ver{ display:flex; }
    .janela{ width:min(560px, 100%); max-height:90vh; overflow:auto; background:var(--card); border-radius:20px; padding:22px; box-shadow:0 30px 80px rgba(37,30,25,.25); }
    .janela.larga{ width:min(860px, 100%); }
    .janela h2{ font-family:var(--serif); font-size:28px; font-weight:600; margin-bottom:6px; }
    .janela p{ color:var(--muted); margin-bottom:14px; }
    .janela .acoes{ display:flex; justify-content:flex-end; gap:8px; margin-top:8px; }
    .luz{ position:fixed; inset:0; z-index:30; background:rgba(16,15,13,.88); display:none; align-items:center; justify-content:center; flex-direction:column; gap:12px; padding:20px; }
    .luz.ver{ display:flex; }
    .luz img{ max-width:100%; max-height:82vh; border-radius:12px; }
    .luz div{ display:flex; gap:8px; }

    .toast{ position:fixed; left:50%; bottom:22px; transform:translate(-50%, 20px); background:var(--escuro); color:#fff; padding:12px 18px; border-radius:14px; font-weight:600; opacity:0; pointer-events:none; transition:.25s; z-index:40; }
    .toast.ver{ opacity:1; transform:translate(-50%, 0); }
    .toast.erro{ background:var(--erro); }

    /* Telas grandes: aproveita a largura toda */
    @media (min-width:1500px){
      .galeria{ grid-template-columns:repeat(auto-fill, minmax(190px, 1fr)); }
      .uniforme-lista{ grid-template-columns:repeat(auto-fill, minmax(360px, 1fr)); }
    }

    @media (max-width:1100px){
      .resumo{ grid-template-columns:repeat(3, minmax(0,1fr)); }
      .ciclo{ margin-left:0; }
      .tabela-rolavel{ overflow-x:auto; }
      table{ min-width:900px; }
    }

    /* Celular: cada linha da tabela vira um cartão, como num app */
    @media (max-width:760px){
      body{ padding:16px 12px 50px; font-size:14.5px; }
      .topo h1{ font-size:28px; }
      .ciclo{ width:100%; justify-content:space-between; }
      .ciclo strong{ min-width:0; flex:1; }
      .topo-acoes{ width:100%; overflow-x:auto; }
      .resumo{ grid-template-columns:repeat(2, minmax(0,1fr)); }
      .tile strong{ font-size:20px; }
      .abas{ width:100%; }
      .aba{ flex:1; padding:0 10px; }
      .evento-topo .btn{ width:100%; }
      .evento-total{ text-align:left; }
      .tabela-rolavel{ overflow:visible; }
      table, tbody, tr, td{ display:block; width:100%; min-width:0; }
      thead{ display:none; }
      tr{ padding:12px 14px; border-bottom:1px solid var(--borda); }
      tr:last-child{ border-bottom:0; }
      td{ display:grid; grid-template-columns:auto 1fr; column-gap:12px; row-gap:2px; padding:6px 0; border:0; text-align:right; }
      td > *{ grid-column:2; justify-self:end; }
      td br{ display:none; }
      td.num{ text-align:right; }
      td::before{ grid-column:1; grid-row:1 / span 6; content:attr(data-label); font-size:11px; font-weight:600; letter-spacing:.05em; text-transform:uppercase; color:var(--suave); text-align:left; padding-top:2px; }
      td[data-label="Free"]{ display:block; text-align:left; padding-bottom:8px; }
      td[data-label="Free"] > *{ justify-self:start; }
      td[data-label="Free"]::before, td.td-acoes::before{ display:none; }
      td.td-acoes{ display:block; padding-top:10px; }
      td.td-acoes .acoes-linha{ justify-content:stretch; }
      td.td-acoes .btn{ flex:1; min-height:38px; }
      .motivos{ text-align:right; }
      .uniforme-lista{ grid-template-columns:1fr; padding:0 12px 12px; }
      .uniforme{ grid-template-columns:56px 96px 1fr; }
      .uniforme .cad{ width:56px; height:56px; }
      .uniforme .uni{ width:96px; height:128px; }
      .galeria{ grid-template-columns:repeat(2, minmax(0,1fr)); padding:12px; }
    }
    .abas{ display:flex; align-items:center; flex-wrap:wrap; gap:6px 4px; }
  .filtro-situacao{ display:inline-flex; gap:6px; margin-right:18px; padding-right:18px; border-right:1px solid #e3e7ec; }
  .filtro-situacao button{ border:1px solid #dfe4ea; background:#fff; color:#2b2b2b; border-radius:999px; padding:6px 14px; font:500 13px Inter,sans-serif; cursor:pointer; }
  .filtro-situacao button.ativo{ background:#123f86; border-color:#123f86; color:#fff; }
  .filtro-situacao button span:empty{ display:none; }
  .filtro-situacao button span{ display:inline-block; min-width:18px; margin-left:4px; padding:0 5px; border-radius:999px; background:rgba(0,0,0,.08); font-size:11px; }
  .filtro-situacao button.ativo span{ background:rgba(255,255,255,.25); }
  /* Nov/2026: cards finos, como os de Funcionários (rótulo à esquerda, número à direita, numa linha) */
  #resumo .tile{ display:flex; align-items:center; justify-content:space-between; gap:10px; min-height:44px; padding:0 14px; border-radius:10px; }
  #resumo .tile small{ margin:0; font-size:11px; letter-spacing:.06em; text-transform:uppercase; }
  #resumo .tile strong{ margin:0; font-size:18px; line-height:1; white-space:nowrap; }
  #telaPainel{ padding-top:4px; }
  #resumo[hidden]{ display:none !important; }
  .agrupar{ display:inline-flex; align-items:center; gap:8px; font:500 13px Inter,sans-serif; color:#4f4f4f; }
  .agrupar select{ min-height:34px; padding:0 30px 0 12px; border:1px solid #dfe4ea; border-radius:999px; background:#fff; font:500 13px Inter,sans-serif; color:#1f2020; cursor:pointer; }
  .agrupar[hidden]{ display:none !important; }
  .agrupar{ margin-left:14px; }
  .dia-grupo{ margin-bottom:22px; }
  .dia-titulo{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin:0 0 10px; padding:0 2px 6px; border-bottom:2px solid #123f86; font:700 16px Inter,sans-serif !important; color:#1f2020; }
  .dia-info{ font:500 13px Inter,sans-serif; color:#4f4f4f; }
  html, body{ background:#f3f5f6 !important; }
  /* Nov/2026: uma fonte só (Inter, a do sistema) em toda a tela */
  :root{ --sans:"Inter", system-ui, sans-serif !important; --serif:"Inter", system-ui, sans-serif !important; }
  body, button, input, select, textarea, .evento-titulo strong, .janela h2, .tile strong, .chip, table, th, td{ font-family:"Inter", system-ui, sans-serif !important; }
  .evento-topo{ align-items:center; }
  .evento-cli{ position:relative; flex:none; width:52px; height:52px; border-radius:50%; overflow:hidden; display:grid; place-items:center; background:#e7ebf1; color:#4f4f4f; font:600 15px Inter,sans-serif; }
  .evento-cli img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .evento-linha1{ display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
  .evento-titulo strong{ font-size:17px !important; font-weight:600 !important; }
  .evento-pedido{ display:inline-block; padding:2px 9px; border-radius:999px; background:#123f86; color:#fff !important; font:600 12px Inter,sans-serif; }
  .evento-local{ margin:2px 0 1px; font:500 13.5px Inter,sans-serif; color:#1f2020; }
  .evento-data{ flex:none; display:flex; flex-direction:column; align-items:center; min-width:54px; padding:4px 8px; border-right:1px solid #e3e7ec; }
  .evento-data small{ font:600 11px Inter,sans-serif; color:#6b6b6b; text-transform:uppercase; letter-spacing:.06em; }
  .evento-data b{ font:700 16px Inter,sans-serif; color:#1f2020; }
  .evento-topo > .evento-pedido{ flex:none; align-self:center; }
  .evento-data .evento-pedido{ margin-bottom:5px; white-space:nowrap; }
  .evento-titulo{ min-width:200px; }
</style>

<!-- Nov/2026: menos negrito (pedido do usuário). Só o total do evento e o total da linha ficam em semi-negrito. -->
<style id="rh-barra-pagamentos">
  .pg-barra{ display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin:0 0 16px; border-bottom:1px solid #e3e7ec; }
  .pg-abas{ display:flex; gap:22px; border:0 !important; margin:0 !important; padding:0 !important; background:none !important; }
  .pg-abas button{ border:0; background:none; padding:10px 0 11px; margin-bottom:-1px; border-bottom:2px solid transparent; font:500 12px/1 Inter,sans-serif; letter-spacing:.06em; text-transform:uppercase; color:#6b6b6b; cursor:pointer; }
  .pg-abas button.ativo{ color:#1f2020; border-bottom-color:#123f86; }
  .pg-abas button span:empty{ display:none; }
  .pg-abas button span{ display:inline-block; min-width:18px; margin-left:5px; padding:2px 6px; border-radius:999px; background:#eef1f4; color:#4f4f4f; font-size:11px; letter-spacing:0; }
  .pg-abas button[data-filtro="apagar"] span{ background:#e60012; color:#fff; }
  .pg-agrupar{ display:inline-flex; gap:4px; padding:3px; margin-bottom:6px; border:1px solid #e3e7ec; border-radius:10px; background:#fff; }
  .pg-agrupar button{ width:34px; height:30px; display:grid; place-items:center; border:0; border-radius:7px; background:none; color:#6b6b6b; cursor:pointer; }
  .pg-agrupar button:hover{ background:#f3f5f6; color:#1f2020; }
  .pg-agrupar button.ativo{ background:#123f86; color:#fff; }
  .pg-agrupar svg{ width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
</style>
<style id="rh-valores-vermelho">
  /* Nov/2026: valores em vermelho (é dinheiro que sai: diária, hora extra, ajuste e totais). */
  html:root:is(#rhv#rhv#rhv#rhv#rhv,html) #telaPainel :is(.evento-total strong, td.num > b, .rs, .dia-info b){ color:#b42318 !important; }
  /* cabeçalho da tabela em cinza claro (pedido do usuário) */

<body>

  <section class="tela ativa" id="telaCarregando"><div class="carregando"><div><div class="spinner"></div>Carregando…</div></div></section>

  <!-- Nov/2026: sem a tela "Senha da RH": entra sozinho com o login do sistema (o acesso é conferido por permissão). -->

  <section class="tela" id="telaPainel">
    <!-- Nov/2026: como um contas a pagar — sem semana, sem título, sem "Valor da hora", "Exportar planilha" e "Sair". -->

    <!-- Nov/2026: sem os cards de resumo (A pagar, Já pago, Diárias, Para revisar, Faltas). -->
    <div class="resumo" id="resumo" hidden></div>

    <!-- Nov/2026: abas A pagar / Pagos (sem Todos, sem Pagamentos e sem Fotos e uniforme) e, à direita, agrupar por evento, dia ou pessoa em ícones. -->
    <nav class="pg-barra">
      <div class="el-tabs pg-abas" role="tablist" aria-label="Situação">
        <button type="button" role="tab" aria-selected="true" data-filtro="apagar" class="ativo" onclick="trocarFiltro('apagar')">A pagar <span data-conta="apagar"></span></button>
        <button type="button" role="tab" aria-selected="false" data-filtro="financeiro" onclick="trocarFiltro('financeiro')">No financeiro <span data-conta="financeiro"></span></button>
        <button type="button" role="tab" aria-selected="false" data-filtro="pagos" onclick="trocarFiltro('pagos')">Pagos <span data-conta="pagos"></span></button>
      </div>
      <div class="pg-agrupar" role="group" aria-label="Agrupar por">
        <button type="button" data-agrupar="eventos" class="ativo" title="Agrupar por evento" aria-label="Agrupar por evento" onclick="trocarAba('eventos')"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg></button>
        <button type="button" data-agrupar="dias" title="Agrupar por dia" aria-label="Agrupar por dia" onclick="trocarAba('dias')"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="4" cy="6" r=".6"/><circle cx="4" cy="12" r=".6"/><circle cx="4" cy="18" r=".6"/></svg></button>
        <button type="button" data-agrupar="pessoas" title="Agrupar por pessoa" aria-label="Agrupar por pessoa" onclick="trocarAba('pessoas')"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5"/><circle cx="17" cy="9" r="2.6"/><path d="M16.5 14.6c2.6.2 4.4 1.8 5 4.4"/></svg></button>
        <select id="agruparPor" hidden onchange="trocarAba(this.value)"><option value="eventos">Evento</option><option value="dias">Dia</option><option value="pessoas">Pessoa</option></select>
      </div>
    </nav>

    <main id="conteudo"></main>
  </section>

  <div class="fundo" id="fundo" onclick="if(event.target === this) fecharJanela()"><div class="janela" id="janela"></div></div>
  <div class="luz" id="luz" onclick="if(event.target === this) fecharLuz()"><img id="luzImg" alt=""><div><a class="btn btn-claro" id="luzLink" target="_blank" rel="noopener">Abrir no Drive</a><button class="btn" type="button" onclick="fecharLuz()">Fechar</button></div></div>
  <div class="toast" id="toast"></div>

<script>
  /* =========================================================
     ESTADO E APOIO
  ========================================================= */
  const CHAVE = "rhToken";
  const estado = { token: lerToken(), ciclo: "tudo", dados: null, aba: "eventos", filtro: "apagar", envio: {} };
  const SITUACAO = { PAGAR: "Pagar", REVISAR: "Revisar", NAO_PAGAR: "Não pagar", PAGO: "Pago", EM_ANDAMENTO: "Em andamento", FINANCEIRO: "No financeiro" };
  const UNIFORME = { OK: "✅ Ok", INCOMPLETO: "⚠️ Incompleto", SEM: "❌ Sem uniforme" };

  function lerToken(){ try{ return localStorage.getItem(CHAVE) || ""; }catch(e){ return ""; } }
  function salvarToken(t){ estado.token = t || ""; try{ t ? localStorage.setItem(CHAVE, t) : localStorage.removeItem(CHAVE); }catch(e){} }
  function esc(v){ return String(v == null ? "" : v).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;"); }
  function moeda(n){ return (Number(n) || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" }); }
  function hora(t){ const m = String(t || "").match(/(\d{1,2}):(\d{2})/); return m ? ("0" + m[1]).slice(-2) + ":" + m[2] : ""; }
  function dataBR(iso){ const p = String(iso || "").split("-"); return p.length === 3 ? p[2] + "/" + p[1] : "-"; }
  function diaSemana(iso){ const p = String(iso || "").split("-"); if(p.length !== 3){ return ""; } return ["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"][new Date(+p[0], +p[1] - 1, +p[2]).getDay()]; }
  function idDrive(url){ const m = String(url || "").match(/\/d\/([\w-]{10,})/) || String(url || "").match(/[?&]id=([\w-]{10,})/); return m ? m[1] : ""; }
  function miniDrive(url, w){ const id = idDrive(url); return window.supabaseArquivoUrl(url); }

  function chamar(fn){
    const args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function(ok, falha){
      google.script.run.withSuccessHandler(ok).withFailureHandler(function(e){ falha(new Error((e && e.message) || String(e))); })[fn].apply(null, args);
    });
  }
  function msg(e){ return String((e && e.message) || e || "").replace(/^(Error|Exception):\s*/, "").replace(/^SESSAO_EXPIRADA:\s*/, ""); }
  function expirou(e){ return /SESSAO_EXPIRADA/.test(String(e && e.message || e)); }

  let toastT = null;
  function toast(t, erro){ const el = document.getElementById("toast"); el.textContent = t; el.classList.toggle("erro", !!erro); el.classList.add("ver"); clearTimeout(toastT); toastT = setTimeout(function(){ el.classList.remove("ver"); }, erro ? 4500 : 2500); }
  function tela(id){ document.querySelectorAll(".tela").forEach(function(t){ t.classList.toggle("ativa", t.id === id); }); }

  function abrirJanela(html, larga){ const j = document.getElementById("janela"); j.innerHTML = html; j.classList.toggle("larga", !!larga); document.getElementById("fundo").classList.add("ver"); }
  function fecharJanela(){ document.getElementById("fundo").classList.remove("ver"); }
  function abrirLuz(url){
    document.getElementById("luzImg").src = miniDrive(url, 1600) || url;
    document.getElementById("luzLink").href = url;
    document.getElementById("luz").classList.add("ver");
  }
  function fecharLuz(){ document.getElementById("luz").classList.remove("ver"); }

  /* =========================================================
     LOGIN E CARGA
  ========================================================= */
  function entrarAuto(){
    document.getElementById("conteudo").innerHTML = '<div class="carregando"><div><div class="spinner"></div>Carregando…</div></div>';
    tela("telaPainel");
    return chamar("RH_login", "").then(function(r){ salvarToken(r.token); estado.ciclo = "tudo"; return carregar(); })
      .catch(function(e){ semAcesso(msg(e)); });
  }
  function semAcesso(texto){
    tela("telaPainel");
    document.getElementById("resumo").innerHTML = "";
    document.getElementById("conteudo").innerHTML = '<div class="vazio"><strong>Sem acesso</strong>' + esc(texto || "Seu usuário não tem permissão para o pagamento de freelancer.") + '</div>';
  }

  function sair(){
    const t = estado.token;
    salvarToken("");
    if(t){ chamar("RH_sair", t).catch(function(){}); }
    entrarAuto();
  }

  function tratar(e){
    if(expirou(e)){ salvarToken(""); if(!estado.reentrou){ estado.reentrou = true; entrarAuto(); } else { semAcesso("Não foi possível entrar. Recarregue a página."); } return; }
    toast(msg(e), true);
  }

  function carregar(){
    if(!estado.token){ return entrarAuto(); }
    return chamar("RH_carregarCiclo", estado.token, "tudo").then(aplicar).catch(function(e){
      if(!estado.dados){ semAcesso(msg(e)); }
      tratar(e);
    });
  }

  function aplicar(d){
    estado.dados = d;
    estado.ciclo = "tudo";
    renderResumo();
    render();
    tela("telaPainel");
  }

  function mudarCiclo(dias){
    const p = estado.ciclo.split("-");
    const d = new Date(+p[0], +p[1] - 1, +p[2] + dias);
    estado.ciclo = d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2);
    document.getElementById("conteudo").innerHTML = '<div class="carregando"><div><div class="spinner"></div>Carregando ciclo…</div></div>';
    carregar();
  }

  const NO_FILTRO = { apagar: ["PAGAR", "REVISAR", "EM_ANDAMENTO"], financeiro: ["FINANCEIRO"], pagos: ["PAGO"] };
  function passaFiltro(p, filtro){ const l = NO_FILTRO[filtro || estado.filtro]; return !l || l.indexOf(p.calc.situacao) >= 0; }
  function trocarFiltro(f){
    estado.filtro = f;
    document.querySelectorAll("[data-filtro]").forEach(function(b){ const on = b.dataset.filtro === f; b.classList.toggle("ativo", on); b.setAttribute("aria-selected", on ? "true" : "false"); });
    render();
  }
  // A pagar: o mais antigo primeiro (o que vence antes); pagos e todos: o mais recente primeiro.
  function eventosFiltrados(){
    const lista = (estado.dados.eventos || []).map(function(ev){ return Object.assign({}, ev, { pessoas: ev.pessoas.filter(function(p){ return passaFiltro(p); }) }); })
      .filter(function(ev){ return ev.pessoas.length; })
      .sort(function(a, b){ return (a.dataISO + a.horario).localeCompare(b.dataISO + b.horario); });
    return estado.filtro === "apagar" ? lista : lista.reverse();
  }
  /* Nov/2026: enviar ao Contas a Pagar. Marca-se em "A pagar" e envia: o Financeiro recebe uma conta por freelancer. */
  function pessoaPorInscricao(id){ let r = null; (estado.dados.eventos || []).forEach(function(ev){ (ev.pessoas || []).forEach(function(p){ if(p.idInscricao === id){ r = { ev: ev, p: p }; } }); }); return r; }
  function marcadosEnvio(){
    return Object.keys(estado.envio).map(pessoaPorInscricao).filter(function(x){ return x && (x.p.calc.situacao === "PAGAR" || x.p.calc.situacao === "REVISAR") && x.p.calc.total > 0; });
  }
  function pintarBarraEnvio(){
    let barra = document.getElementById("barraEnvio");
    const lista = estado.filtro === "apagar" ? marcadosEnvio() : [];
    if(!lista.length){ if(barra){ barra.hidden = true; } return; }
    if(!barra){ barra = document.createElement("div"); barra.id = "barraEnvio"; barra.className = "envio-barra"; document.body.appendChild(barra); }
    const total = lista.reduce(function(s, x){ return s + x.p.calc.total; }, 0);
    const pessoas = {}; lista.forEach(function(x){ pessoas[x.p.idFree] = 1; });
    barra.innerHTML = '<span><b>' + lista.length + (lista.length === 1 ? " diária" : " diárias") + '</b> de ' + Object.keys(pessoas).length + (Object.keys(pessoas).length === 1 ? " freelancer" : " freelancers") + ' · <b class="rs">' + moeda(total) + '</b></span>' +
      '<button type="button" class="btn btn-claro" data-envio-limpar>Desmarcar</button><button type="button" class="btn" data-envio-abrir>Enviar ao Contas a Pagar</button>';
    barra.hidden = false;
  }
  function abrirEnvio(){
    const lista = marcadosEnvio(); if(!lista.length){ return; }
    const porFree = {};
    lista.forEach(function(x){ const k = x.p.idFree; (porFree[k] = porFree[k] || { nome: x.p.nome, itens: [], total: 0 }).itens.push(x); porFree[k].total += x.p.calc.total; });
    const revisar = lista.filter(function(x){ return x.p.calc.situacao === "REVISAR"; });
    const total = lista.reduce(function(s, x){ return s + x.p.calc.total; }, 0);
    const venc = new Date(Date.now() + 3 * 864e5).toISOString().slice(0, 10);
    abrirJanela(
      '<h2>Enviar ao Contas a Pagar</h2>' +
      '<p>Cada freelancer vira uma conta a pagar no Financeiro (para pagar no PIX dele). O custo também entra no resultado de cada pedido.</p>' +
      (revisar.length ? '<div class="envio-aviso">' + revisar.length + (revisar.length === 1 ? " diária está" : " diárias estão") + ' em <b>Revisar</b>: ' + revisar.map(function(x){ return esc(x.p.nome) + " (" + esc(x.p.calc.motivos.join(", ")) + ")"; }).join("; ") + '. Confira antes de enviar.</div>' : "") +
      '<table class="envio-resumo"><thead><tr><th>Freelancer</th><th class="num">Diárias</th><th class="num">Total</th></tr></thead><tbody>' +
        Object.keys(porFree).map(function(k){ const g = porFree[k]; return '<tr><td>' + esc(g.nome) + '<span class="sub">' + g.itens.map(function(x){ return esc(x.ev.etapa || "") + " " + dataBR(x.ev.dataISO) + " · " + moeda(x.p.calc.total); }).join(" · ") + '</span></td><td class="num">' + g.itens.length + '</td><td class="num"><b class="rs">' + moeda(g.total) + '</b></td></tr>'; }).join("") +
      '</tbody><tfoot><tr><td>Total</td><td class="num">' + lista.length + '</td><td class="num"><b class="rs">' + moeda(total) + '</b></td></tr></tfoot></table>' +
      '<div class="envio-campos"><label class="campo"><span>Vencimento</span><input type="date" id="envioVenc" value="' + venc + '"></label>' +
      '<label class="campo" style="flex:1"><span>Observação (opcional)</span><input type="text" id="envioObs" maxlength="300"></label></div>' +
      '<div class="acoes"><button type="button" class="btn btn-claro" onclick="fecharJanela()">Cancelar</button><button type="button" class="btn" id="envioConfirmar">Enviar ' + moeda(total) + '</button></div>', true);
    document.getElementById("envioConfirmar").onclick = function(){
      const v = document.getElementById("envioVenc").value;
      if(!v){ toast("Informe o vencimento.", true); return; }
      const botao = this; botao.disabled = true;
      chamar("RH_enviarFinanceiro", estado.token, estado.ciclo, lista.map(function(x){ return { inscricao: x.p.idInscricao, valor: x.p.calc.total }; }), v, document.getElementById("envioObs").value)
        .then(function(d){ estado.envio = {}; fecharJanela(); aplicar(d); toast("Enviado ao Contas a Pagar: " + Object.keys(porFree).length + (Object.keys(porFree).length === 1 ? " conta" : " contas")); })
        .catch(function(e){ botao.disabled = false; tratar(e); });
    };
  }
  document.addEventListener("change", function(e){
    const t = e.target;
    if(t.matches && t.matches(".sel-envio")){ if(t.checked){ estado.envio[t.dataset.envio] = 1; } else { delete estado.envio[t.dataset.envio]; } t.closest("tr").classList.toggle("marcada", t.checked); pintarBarraEnvio(); }
    if(t.matches && t.matches(".sel-evento")){
      const sec = t.closest(".evento");
      sec.querySelectorAll(".sel-envio").forEach(function(c){ c.checked = t.checked; if(t.checked){ estado.envio[c.dataset.envio] = 1; } else { delete estado.envio[c.dataset.envio]; } c.closest("tr").classList.toggle("marcada", t.checked); });
      pintarBarraEnvio();
    }
  });
  document.addEventListener("click", function(e){
    const b = e.target.closest && e.target.closest("[data-envio-abrir],[data-envio-limpar],[data-desfazer-envio],[data-envio-pessoa]");
    if(!b){ return; }
    if(b.hasAttribute("data-envio-pessoa")){ estado.envio = {}; b.dataset.envioPessoa.split(",").forEach(function(id){ estado.envio[id] = 1; }); abrirEnvio(); return; }

  function fotoEquipeHtml(evFiltrado){

  function abrirUniformeEquipe(idVaga){
    const ev = eventoCompleto(idVaga); if(!ev){ return; }

    const algumSem = gente.some(function(p){ return p.uniforme && p.uniforme.avaliacao !== "OK"; });

  // Agrupar por dia: um título por dia (com total e número de pessoas) e os eventos daquele dia embaixo.
  function htmlDias(){
    const dias = [], porDia = {};
    eventosFiltrados().forEach(function(ev){ if(!porDia[ev.dataISO]){ porDia[ev.dataISO] = []; dias.push(ev.dataISO); } porDia[ev.dataISO].push(ev); });
    return dias.map(function(d){
      const evs = porDia[d], pessoas = evs.reduce(function(n, ev){ return n + ev.pessoas.length; }, 0);
      const total = evs.reduce(function(s, ev){ return s + ev.pessoas.reduce(function(t, p){ return t + (p.calc.situacao === "NAO_PAGAR" || p.calc.situacao === "EM_ANDAMENTO" ? 0 : p.calc.total); }, 0); }, 0);
      return '<div class="dia-grupo"><h3 class="dia-titulo"><span class="dia-nome">' + diaSemana(d) + ' ' + dataBR(d) + '</span><span class="dia-info">' + evs.length + (evs.length === 1 ? " evento" : " eventos") + ' · ' + pessoas + (pessoas === 1 ? " pessoa" : " pessoas") + ' · <b>' + moeda(total) + '</b></span></h3>' + htmlEventos(evs) + '</div>';
    }).join("");
  }
  function htmlEventos(lista){

      const total = ev.pessoas.reduce(function(s, p){ return s + (p.calc.situacao === "NAO_PAGAR" || p.calc.situacao === "EM_ANDAMENTO" ? 0 : p.calc.total); }, 0);

      const linhas = ev.pessoas.map(function(p){
        const c = p.calc;
        const pag = p.pagamento || {};
        const pago = c.situacao === "PAGO";
        const editavel = !pago && (c.situacao === "PAGAR" || c.situacao === "REVISAR" || pag.naoPagar);
        const enviavel = estado.filtro === "apagar" && (c.situacao === "PAGAR" || c.situacao === "REVISAR") && c.total > 0;
        const fin = p.financeiro;
        return '<tr' + (enviavel && estado.envio[p.idInscricao] ? ' class="marcada"' : "") + '>' +
          (estado.filtro === "apagar" ? '<td class="td-sel" data-label="">' + (enviavel ? '<input type="checkbox" class="sel-envio" data-envio="' + esc(p.idInscricao) + '"' + (estado.envio[p.idInscricao] ? " checked" : "") + ' aria-label="Enviar ao Contas a Pagar">' : "") + '</td>' : "") +
          '<td data-label="Free"><div class="pessoa">' + fotoCadastro(p) + '<div><b><button class="link" type="button" onclick="abrirFicha(\'' + esc(p.idFree) + '\')">' + esc(p.nome) + '</button></b><small>' + esc(p.cpf) + ' <span class="nota">★ ' + Number(p.nota).toFixed(1).replace(".", ",") + '</span></small></div></div></td>' +
          '<td data-label="Check-in"><span class="hora">' + (hora(p.checkinEm) || "—") + '</span><span class="sub">' + esc(p.via || "") + '</span></td>' +
          '<td data-label="Local do check-in">' + localCheckinHtml(p) + '</td>' +
          '<td data-label="Uniformizado">' + uniformizadoHtml(ev, p) + '</td>' +
          '<td data-label="Check-out"><span class="hora">' + (hora(p.checkoutEm) || "—") + '</span></td>' +

            : '<span class="sub">—</span>') + '</td>' +
          '<td data-label="Ajuste" class="num">' + (pag.ajuste ? '<b class="rs">' + (pag.ajuste > 0 ? "+" : "") + moeda(pag.ajuste) + '</b><span class="sub">' + esc(pag.motivoAjuste) + '</span>' : '<span class="sub">—</span>') +

              pago ? '<span class="sub">' + esc(pag.forma) + ' · ' + esc(String(pag.pagoEm).slice(0, 10)) + '</span>' : "") +

            // Nov/2026: sem "Pago" e "Não pagar" na linha (o pagamento é marcado em Agrupar por pessoa). Quem já estava em "não pagar" pode voltar.

        (ev.pessoas.length

  /* =========================================================
     POR PESSOA (o que pagar a cada um no ciclo)
  ========================================================= */
  function agruparPessoas(){
    const mapa = {};
    todasPessoas(true).forEach(function(x){
      const p = x.p, c = p.calc;
      const r = mapa[p.idFree] = mapa[p.idFree] || { p: p, dias: [], total: 0, pago: 0, pendentes: [] };
      if(c.situacao === "NAO_PAGAR" || c.situacao === "EM_ANDAMENTO"){ return; }
      r.dias.push(x);
      r.total += c.total;
      if(c.situacao === "PAGO"){ r.pago += c.total; } else if(c.situacao === "FINANCEIRO"){ r.fin = (r.fin || 0) + c.total; } else if(c.total > 0){ r.pendentes.push(p.idInscricao); }
    });
    return Object.keys(mapa).map(function(k){ return mapa[k]; }).filter(function(r){ return r.dias.length; })
      .sort(function(a, b){ return (b.total - b.pago) - (a.total - a.pago) || a.p.nome.localeCompare(b.p.nome); });
  }

  function htmlPessoas(){
    const grupos = agruparPessoas();
    if(!grupos.length){ return '<div class="vazio"><strong>Nada por aqui</strong></div>'; }

    const linhas = grupos.map(function(g){
      const p = g.p;
      const aPagar = g.total - g.pago - (g.fin || 0);
      const dias = g.dias.map(function(x){
        return diaSemana(x.ev.dataISO) + " " + dataBR(x.ev.dataISO) + " · " + x.ev.cliente + " · " + (hora(x.p.checkinEm) || "—") + "–" + (hora(x.p.checkoutEm) || "—") + " · " + moeda(x.p.calc.total);
      });
      const tel = String(p.telefone || "").replace(/\D/g, "");
      const texto = "Oi " + String(p.nome).split(" ")[0] + "! Resumo do seu pagamento:\n" +
        dias.map(function(d){ return "• " + d; }).join("\n") + "\nTotal: " + moeda(g.total) + (p.pix ? "\nPIX: " + p.pix : "");

      return '<tr>' +
        '<td data-label="Free"><div class="pessoa">' + fotoCadastro(p) + '<div><b><button class="link" type="button" onclick="abrirFicha(\'' + esc(p.idFree) + '\')">' + esc(p.nome) + '</button></b><small>' + esc(p.cpf) + ' · ' + esc(p.telefone) + '</small></div></div></td>' +
        '<td data-label="Chave PIX">' + (p.pix ? '<b>' + esc(p.pix) + '</b><br><button class="link" style="font-size:11.5px" type="button" onclick="copiar(\'' + esc(p.pix) + '\')">copiar</button>' : '<span class="chip erro">Sem PIX</span>') + '</td>' +
        '<td data-label="Dias trabalhados">' + dias.map(function(d){ return '<div class="sub" style="color:var(--text)">' + esc(d) + '</div>'; }).join("") + '</td>' +
        '<td data-label="Total" class="num"><b>' + moeda(g.total) + '</b>' + (g.pago ? '<span class="sub">pago ' + moeda(g.pago) + '</span>' : "") + '</td>' +
        '<td data-label="Situação"><span class="chip ' + (aPagar > 0.004 ? "aviso" : "PAGO") + '">' + (aPagar > 0.004 ? "A pagar " + moeda(aPagar) : "Pago") + '</span></td>' +
        '<td data-label="" class="td-acoes"><div class="acoes-linha">' +
          (tel.length >= 10 ? '<a class="btn btn-claro btn-mini" target="_blank" rel="noopener" href="https://wa.me/55' + tel + '?text=' + encodeURIComponent(texto) + '">WhatsApp</a>' : "") +
          (g.pendentes.length ? '<button class="btn btn-mini" type="button" data-envio-pessoa="' + esc(g.pendentes.join(",")) + '">Enviar ao Contas a Pagar</button>' : "") +
        '</div></td>' +
      '</tr>';
    }).join("");

    return '<section class="evento"><div class="tabela-rolavel"><table><thead><tr><th>Free</th><th>Chave PIX</th><th>Dias trabalhados</th><th class="num">Total</th><th>Situação</th><th></th></tr></thead><tbody>' + linhas + '</tbody></table></div></section>';
  }

  /* =========================================================
     FOTOS E UNIFORME
  ========================================================= */
  function htmlFotos(){
    return eventosFiltrados().map(function(ev){
      const fotos = (ev.fotos || []).map(function(f){
        const mini = miniDrive(f.url, 500);
        return '<div class="miniatura" onclick="abrirLuz(\'' + esc(f.url) + '\')">' + (mini ? '<img src="' + esc(mini) + '" alt="" loading="lazy">' : "") + '<span>' + esc(f.legenda) + '</span></div>';
      }).join("");

      const pessoas = ev.pessoas.filter(function(p){ return p.checkinEm || p.calc.fase === "FALTOU"; }).map(function(p){
        const u = p.uniforme || {};
        const mini = miniDrive(p.fotoUniforme, 400);
        return '<div class="uniforme">' +
          '<div class="cad">' + (p.miniatura ? '<img src="' + esc(p.miniatura) + '" alt="Foto do cadastro">' : esc(String(p.nome).charAt(0))) + '</div>' +
          '<div class="uni"' + (p.fotoUniforme ? ' onclick="abrirLuz(\'' + esc(p.fotoUniforme) + '\')"' : "") + '>' + (mini ? '<img src="' + esc(mini) + '" alt="Foto do uniforme">' : (p.calc.fase === "FALTOU" ? "Faltou" : "Sem foto no check-in")) + '</div>' +
          '<div><b>' + esc(p.nome) + '</b><span class="sub">Check-in ' + (hora(p.checkinEm) || "—") + '</span>' +
            (p.calc.fase === "FALTOU" ? "" :
              '<div class="botoes-uniforme">' + ["OK", "INCOMPLETO", "SEM"].map(function(op){
                return '<button type="button" class="' + op + (u.avaliacao === op ? " ativo" : "") + '" onclick="avaliar(\'' + esc(p.idInscricao) + '\', \'' + op + '\')">' + UNIFORME[op] + '</button>';
              }).join("") + '</div>' +
              '<input type="text" placeholder="Observação (opcional)" value="' + esc(u.observacao || "") + '" id="obsUni_' + esc(p.idInscricao) + '" onchange="avaliar(\'' + esc(p.idInscricao) + '\', null)">' +
              (u.avaliadoPor ? '<span class="sub">Avaliado por ' + esc(u.avaliadoPor) + '</span>' : "")) +
          '</div>' +
        '</div>';
      }).join("");

      return '<section class="evento">' +
        '<div class="evento-topo">' + tituloEvento(ev) + '</div>' +
        '<div class="rotulo-secao">Fotos enviadas pela equipe (' + (ev.fotos || []).length + ')</div>' +
        (fotos ? '<div class="galeria">' + fotos + '</div>' : '<div class="vazio" style="padding:14px">A equipe ainda não enviou fotos deste evento.</div>') +
        '<div class="rotulo-secao">Uniforme · conferido pela foto da equipe (clique na foto acima)</div>' +
        (pessoas ? '<div class="uniforme-lista" style="padding-top:10px">' + pessoas + '</div>' : '<div class="vazio" style="padding:14px">Ninguém fez check-in ainda.</div>') +
      '</section>';
    }).join("");
  }

  /* =========================================================
     AÇÕES
  ========================================================= */
  function salvarDiaria(id, mudanca){
    const p = todasPessoas().filter(function(x){ return x.p.idInscricao === id; })[0].p;
    const pag = p.pagamento || {};
    const dados = Object.assign({ pagarExtra: !!pag.pagarExtra, ajuste: pag.ajuste || 0, motivoAjuste: pag.motivoAjuste || "", naoPagar: !!pag.naoPagar }, mudanca);
    chamar("RH_salvarDiaria", estado.token, estado.ciclo, id, dados).then(function(d){ aplicar(d); toast("Salvo"); }).catch(tratar);
  }

  function abrirAjuste(id){
    const p = todasPessoas().filter(function(x){ return x.p.idInscricao === id; })[0].p;
    const pag = p.pagamento || {};
    abrirJanela(
      '<h2>Ajuste da diária</h2><p>' + esc(p.nome) + ' · valor positivo é bônus, negativo é desconto.</p>' +
      '<label class="campo"><span>Valor (R$)</span><input id="ajValor" inputmode="decimal" placeholder="Ex.: 30 ou -20" value="' + esc(pag.ajuste ? String(pag.ajuste).replace(".", ",") : "") + '"></label>' +
      '<label class="campo"><span>Motivo</span><input id="ajMotivo" placeholder="Ex.: ajudou a carregar o caminhão" value="' + esc(pag.motivoAjuste || "") + '"></label>' +
      '<div class="acoes"><button class="btn btn-claro" type="button" onclick="fecharJanela()">Cancelar</button>' +
      '<button class="btn" type="button" onclick="salvarAjuste(\'' + esc(id) + '\')">Salvar ajuste</button></div>'
    );
  }

  function salvarAjuste(id){
    const valor = document.getElementById("ajValor").value;
    const motivo = document.getElementById("ajMotivo").value;
    fecharJanela();
    salvarDiaria(id, { ajuste: valor, motivoAjuste: motivo });
  }

  function pagar(ids, quem){
    abrirJanela(
      '<h2>Registrar pagamento</h2><p>' + ids.length + (ids.length === 1 ? " diária" : " diárias") + ' · ' + esc(quem) + '. O valor fica travado depois de pago.</p>' +
      '<label class="campo"><span>Forma de pagamento</span><select id="pgForma"><option>PIX</option><option>Transferência</option><option>Dinheiro</option></select></label>' +
      '<div class="acoes"><button class="btn btn-claro" type="button" onclick="fecharJanela()">Cancelar</button>' +
      '<button class="btn btn-ok" type="button" id="pgBtn">Confirmar pagamento</button></div>'
    );
    document.getElementById("pgBtn").onclick = function(){
      const forma = document.getElementById("pgForma").value;
      this.disabled = true;
      chamar("RH_marcarPago", estado.token, estado.ciclo, ids, forma)
        .then(function(d){ fecharJanela(); aplicar(d); toast("Pagamento registrado"); })
        .catch(function(e){ fecharJanela(); tratar(e); });
    };
  }

  function desfazerPago(id){
    if(!confirm("Desfazer o pagamento desta diária?")){ return; }
    chamar("RH_desfazerPago", estado.token, estado.ciclo, id).then(function(d){ aplicar(d); toast("Pagamento desfeito"); }).catch(tratar);
  }

  function avaliar(id, opcao){
    const p = todasPessoas().filter(function(x){ return x.p.idInscricao === id; })[0].p;
    const atual = (p.uniforme && p.uniforme.avaliacao) || "";
    const avaliacao = opcao === null ? atual : opcao;
    if(!avaliacao){ toast("Escolha primeiro Ok, Incompleto ou Sem uniforme.", true); return; }
    const obs = (document.getElementById("obsUni_" + id) || {}).value || "";
    chamar("RH_avaliarUniforme", estado.token, estado.ciclo, id, avaliacao, obs)
      .then(function(d){ aplicar(d); toast(avaliacao === "OK" ? "Uniforme ok" : "Avaliação salva · nota do free atualizada"); })
      .catch(tratar);
  }

  function abrirConfig(){
    const c = estado.dados.config;
    abrirJanela(
      '<h2>Hora extra</h2><p>O sistema calcula as horas que passaram do que a diária cobre. Você decide em cada diária se paga.</p>' +
      '<label class="campo"><span>Valor da hora extra (R$)</span><input id="cfValor" inputmode="decimal" value="' + esc(c.valorHora ? String(c.valorHora).replace(".", ",") : "") + '" placeholder="Ex.: 25"></label>' +
      '<label class="campo"><span>Horas que a diária cobre</span><input id="cfHoras" inputmode="decimal" value="' + esc(String(c.horasDiaria).replace(".", ",")) + '"></label>' +
      '<div class="acoes"><button class="btn btn-claro" type="button" onclick="fecharJanela()">Cancelar</button><button class="btn" type="button" onclick="salvarConfig()">Salvar</button></div>'
    );
  }

  function salvarConfig(){
    const valor = document.getElementById("cfValor").value;
    const horas = document.getElementById("cfHoras").value.replace(",", ".");
    fecharJanela();
    chamar("RH_salvarConfig", estado.token, estado.ciclo, valor, horas).then(function(d){ aplicar(d); toast("Valores salvos"); }).catch(tratar);
  }

  function exportar(btn){
    btn.disabled = true;
    btn.textContent = "Gerando…";
    chamar("RH_exportarCiclo", estado.token, estado.ciclo)
      .then(function(url){
        abrirJanela('<h2>Planilha pronta</h2><p>Abas "Por pessoa" e "Detalhado", no seu Google Drive.</p><div class="acoes"><button class="btn btn-claro" type="button" onclick="fecharJanela()">Fechar</button><a class="btn" href="' + esc(url) + '" target="_blank" rel="noopener">Abrir planilha</a></div>');
      })
      .catch(tratar)
      .finally(function(){ btn.disabled = false; btn.textContent = "Exportar planilha"; });
  }

  function copiar(texto){
    (navigator.clipboard ? navigator.clipboard.writeText(texto) : Promise.reject()).then(function(){ toast("PIX copiado"); }).catch(function(){ prompt("Copie a chave PIX:", texto); });
  }

  /* ---------- Ficha do free ---------- */
  function abrirFicha(idFree){
    abrirJanela('<div class="carregando" style="min-height:200px"><div><div class="spinner"></div>Carregando ficha…</div></div>', true);
    chamar("RH_fichaFree", estado.token, idFree).then(function(f){
      const n = f.pontuacao || {};
      const linhas = (f.historico || []).map(function(h){
        const c = h.calc;
        const sit = h.status === "CANCELADO" ? '<span class="chip erro">Cancelou' + (h.cimaDaHora ? " em cima" : "") + '</span>' + (h.motivoCancelamento ? '<span class="sub">' + esc(h.motivoCancelamento) + '</span>' : "")
          : h.status === "REMOVIDO" ? '<span class="chip">Retirado</span>'
          : c ? '<span class="chip ' + c.situacao + '">' + SITUACAO[c.situacao] + '</span>' : "";
        return '<tr><td data-label="Data">' + diaSemana(h.dataISO) + ' ' + dataBR(h.dataISO) + '</td><td data-label="Evento">' + esc(h.cliente || "-") + '<span class="sub">' + esc(h.etapa || "") + '</span></td>' +
          '<td data-label="Horário">' + (hora(h.checkinEm) || "—") + '–' + (hora(h.checkoutEm) || "—") + '</td>' +
          '<td data-label="Uniforme">' + (h.uniforme ? UNIFORME[h.uniforme] : '<span class="sub">—</span>') + '</td>' +
          '<td data-label="Valor" class="num">' + (c && c.situacao !== "NAO_PAGAR" && c.situacao !== "EM_ANDAMENTO" ? moeda(c.total) : "—") + '</td><td data-label="Situação">' + sit + '</td></tr>';
      }).join("");
      abrirJanela(
        '<div style="display:flex;gap:14px;align-items:center;margin-bottom:12px">' +
          (f.miniatura ? '<img src="' + esc(f.miniatura) + '" style="width:72px;height:72px;border-radius:50%;object-fit:cover">' : "") +
          '<div><h2 style="margin:0">' + esc(f.nome) + '</h2><span class="sub">CPF ' + esc(f.cpf) + ' · ' + esc(f.telefone) + ' · PIX ' + esc(f.pix || "não informado") + '</span></div>' +
        '</div>' +
        '<div class="resumo" style="grid-template-columns:repeat(4,1fr)">' +
          '<div class="tile ambar"><small>Nota</small><strong>★ ' + Number(n.nota || 5).toFixed(1).replace(".", ",") + '</strong></div>' +
          '<div class="tile"><small>Trabalhos / faltas</small><strong>' + (n.trabalhos || 0) + ' / ' + (n.faltas || 0) + '</strong></div>' +
          '<div class="tile verde"><small>Recebido no mês</small><strong>' + moeda(f.recebidoMes) + '</strong></div>' +
          '<div class="tile ambar"><small>A pagar</small><strong>' + moeda(f.aPagar) + '</strong></div>' +
        '</div>' +
        '<p>Recebido no ano: <b>' + moeda(f.recebidoAno) + '</b> · cadastrado em ' + esc(String(f.cadastradoEm).slice(0, 10)) + '</p>' +
        (linhas ? '<div class="tabela-rolavel"><table><thead><tr><th>Data</th><th>Evento</th><th>Horário</th><th>Uniforme</th><th class="num">Valor</th><th>Situação</th></tr></thead><tbody>' + linhas + '</tbody></table></div>' : '<div class="vazio">Sem histórico.</div>') +
        '<div class="acoes"><button class="btn" type="button" onclick="fecharJanela()">Fechar</button></div>', true);
    }).catch(function(e){ fecharJanela(); tratar(e); });
  }

  /* ---------- Início ---------- */
  if(estado.token){ carregar(); } else { entrarAuto(); }
</script>
</body>
</html>
