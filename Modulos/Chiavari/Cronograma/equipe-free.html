}

window.addEventListener("load", carregarLinkAppMontador);

async function freeObterToken(forcar){
  // Sessão aberta com a senha de outro perfil: pede a do supervisor
  if(forcar || (edicaoCronogramaEstaLiberada() && window.perfilAcesso !== "montagem")){
    encerrarLiberacaoEdicaoCronograma();
  }

  const ok = await pedirSenha("Equipe Free");

  if(!ok){ return null; }

  if(window.perfilAcesso !== "montagem"){
    mostrarAlerta("Acesso permitido apenas para Supervisor de Montagem.", "Acesso negado");
    return null;
  }

  return window.tokenAuditoria;
}

function freeRun(funcao, args){
  return new Promise(function(resolve, reject){
    google.script.run
      .withSuccessHandler(resolve)
      .withFailureHandler(function(erro){ reject(new Error((erro && erro.message) || String(erro))); })
      [funcao].apply(null, args);
  });
}

/* Chama o servidor com o token; se a sessão de 10 min venceu, pede a senha de novo */
async function freeChamar(funcao){
  const extras = Array.prototype.slice.call(arguments, 1);

  let token = await freeObterToken(false);
  if(!token){ throw new Error("CANCELADO"); }

  try{
    return await freeRun(funcao, [token].concat(extras));
  }catch(erro){
    if(!/SESSAO_EXPIRADA/.test(erro.message)){ throw erro; }
    token = await freeObterToken(true);
    if(!token){ throw new Error("CANCELADO"); }
    return await freeRun(funcao, [token].concat(extras));
  }
}

function freeMensagem(erro){
  return String((erro && erro.message) || erro || "")
    .replace(/^(Error|Exception):\s*/, "")
    .replace(/^SESSAO_EXPIRADA:\s*/, "");
}

function freeTratarErro(erro, idCaixa){
  if(erro && erro.message === "CANCELADO"){ return; }
  const caixa = idCaixa && document.getElementById(idCaixa);
  if(caixa){
    caixa.textContent = freeMensagem(erro);
    caixa.classList.add("ver");
  }else{
    mostrarAlerta(escapeHtml(freeMensagem(erro)), "Equipe Free");
  }
}

  return ["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"][d.getDay()] + " " + p[2] + "/" + p[1];
}

function freeHoraInput(texto){

   FORMULÁRIO DA VAGA (usado na janela da vaga e no Novo pedido)
   Campos por classe dentro de um container .free-cfg
========================================================= */

const FREE_PRAZOS = [
  [30, "30 minutos"], [60, "1 hora"], [120, "2 horas"], [240, "4 horas"],
  [360, "6 horas"], [720, "12 horas"], [1440, "24 horas"]
];

function freeMoeda(valor){
  const n = Number(valor);
  return isNaN(n) || valor === "" || valor == null
    ? ""
    : n.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
}

function freeValorParaNumero(texto){
  const limpo = String(texto || "").replace(/[^\d,.]/g, "");
  if(!limpo){ return NaN; }
  // "1.234,56" / "150,5" / "150"
  return Number(limpo.indexOf(",") >= 0 ? limpo.replace(/\./g, "").replace(",", ".") : limpo);
}

function freeEstrelas(nota){
  const n = Number(nota);
  if(isNaN(n)){ return ""; }
  return '<span class="free-nota" title="Nota do free">★ ' + n.toFixed(1).replace(".", ",") + '</span>';
}

/*
 * v: { quantidade, valor, horario, pontoEncontro, lider, observacao,
 *      modo, preferidos, liberarEm }   opcoes: { editando, compacto }
 */
function freeConfigHtml(v, opcoes){
  v = v || {};
  opcoes = opcoes || {};
  const modo = v.modo || "TODOS";

  const prazo = FREE_PRAZOS.map(function(p){
    return '<option value="' + p[0] + '"' + (!opcoes.editando && p[0] === 120 ? " selected" : "") + '>' + p[1] + '</option>';
  }).join("");

  return (
    '<div class="free-form">' +
      '<div class="field"><label>Quantos free</label><input class="free-cfg-qtd" type="number" min="1" max="50" value="' + escapeHtml(v.quantidade || 3) + '"></div>' +
      '<div class="field"><label>Valor da diária</label><input class="free-cfg-valor" type="text" inputmode="decimal" placeholder="R$ 0,00" value="' + escapeHtml(v.valor !== "" && v.valor != null ? String(v.valor).replace(".", ",") : "") + '"></div>' +
      '<div class="field"><label>Horário de encontro</label><input class="free-cfg-horario" type="time" value="' + escapeHtml(freeHoraInput(v.horario) || "") + '"></div>' +
      '<div class="field"><label>Líder da equipe</label><input class="free-cfg-lider" type="text" value="' + escapeHtml(v.lider || "") + '" placeholder="' + (opcoes.compacto ? "Padrão: responsável da etapa" : "Quem vai liderar") + '"></div>' +
      '<div class="field free-largo"><label>Ponto de encontro</label><input class="free-cfg-ponto" type="text" autocomplete="off" value="' + escapeHtml(v.pontoEncontro || "") + '" placeholder="Digite e escolha o endereço na lista do Google"><div class="free-ponto-ok">✓ Endereço do Google — o free vê o mapa e a rota no app</div></div>' +

      '<div class="field free-largo"><label>Quem recebe a vaga</label>' +
        '<div class="free-modos">' +
          '<label><input type="radio" class="free-cfg-modo" value="TODOS"' + (modo === "TODOS" ? " checked" : "") + '><span><strong>Todos os free</strong>Aparece para todos os aprovados</span></label>' +
          '<label><input type="radio" class="free-cfg-modo" value="PRIORIDADE"' + (modo === "PRIORIDADE" ? " checked" : "") + '><span><strong>Escolhidos primeiro</strong>Depois do prazo, abre para todos</span></label>' +
          '<label><input type="radio" class="free-cfg-modo" value="EXCLUSIVA"' + (modo === "EXCLUSIVA" ? " checked" : "") + '><span><strong>Só os escolhidos</strong>Ninguém mais vê a vaga</span></label>' +
        '</div>' +
      '</div>' +

      '<div class="field free-largo free-cfg-escolha">' +
        '<div class="free-cfg-prazo-linha">' +
          '<label>Só os escolhidos veem por</label>' +
          '<select class="free-cfg-prazo">' +
            (opcoes.editando && v.liberarEm ? '<option value="0" selected>Manter (abre para todos ' + escapeHtml(String(v.liberarEm).slice(0, 16)) + ')</option>' : "") +
            prazo +
          '</select>' +
        '</div>' +
        '<label>Escolha quem recebe primeiro <span class="free-cfg-contagem"></span></label>' +
        '<input class="free-busca free-cfg-busca" type="search" placeholder="Buscar free pelo nome" autocomplete="off" data-lpignore="true" data-1p-ignore="true">' +
        '<div class="free-cfg-pessoas"><div class="free-vazio">Carregando free aprovados…</div></div>' +
      '</div>' +

      '<div class="field free-largo"><label>Recado para os free (opcional)</label><textarea class="free-cfg-obs" rows="2" placeholder="Ex.: ir de roupa preta, levar documento">' + escapeHtml(v.observacao || "") + '</textarea></div>' +
    '</div>'
  );
}

async function freeCarregarAprovados(){

  return freeEstado.aprovados;

function freeIniciarConfig(box, v){
  if(!box || box.dataset.iniciado){ return; }
  box.dataset.iniciado = "1";
  v = v || {};

  box._geo = v.pontoLat !== "" && v.pontoLat != null
    ? { endereco: v.pontoEncontro, lat: v.pontoLat, lng: v.pontoLng }
    : null;
  box._preferidos = new Set(v.preferidos || []);

  const ponto = box.querySelector(".free-cfg-ponto");
  const avisoPonto = box.querySelector(".free-ponto-ok");

  function atualizarPonto(){
    avisoPonto.classList.toggle("ver", !!(box._geo && box._geo.endereco === ponto.value.trim()));
  }

  ponto.addEventListener("input", atualizarPonto);
  ponto.addEventListener("keydown", function(e){ if(e.key === "Enter"){ e.preventDefault(); } });
  atualizarPonto();

  if(window.google && google.maps && google.maps.places){
    const auto = new google.maps.places.Autocomplete(ponto, {
      componentRestrictions: { country: "br" },
      fields: ["formatted_address", "geometry", "name"]
    });
    auto.addListener("place_changed", function(){
      const lugar = auto.getPlace();
      if(!lugar || !lugar.geometry){ return; }
      let endereco = lugar.formatted_address || ponto.value;
      if(lugar.name && endereco.indexOf(lugar.name) !== 0){ endereco = lugar.name + " — " + endereco; }
      ponto.value = endereco;
      box._geo = { endereco: endereco.trim(), lat: lugar.geometry.location.lat(), lng: lugar.geometry.location.lng() };
      atualizarPonto();
    });
  }

  // Valor sempre formatado ao sair do campo
  const valor = box.querySelector(".free-cfg-valor");
  valor.addEventListener("blur", function(){
    const n = freeValorParaNumero(valor.value);
    if(!isNaN(n) && n > 0){ valor.value = n.toFixed(2).replace(".", ","); }
  });

  // Rádios do modo: cada formulário tem o seu grupo
  const grupo = "freeModo_" + Math.random().toString(36).slice(2);
  box.querySelectorAll(".free-cfg-modo").forEach(function(r){
    r.name = grupo;
    r.addEventListener("change", function(){ freeAtualizarModo(box); });
  });

  box.querySelector(".free-cfg-busca").addEventListener("input", function(){
    const t = this.value.toLowerCase().trim();
    box.querySelectorAll(".free-escolha").forEach(function(el){
      el.style.display = !t || el.dataset.nome.indexOf(t) >= 0 ? "" : "none";
    });
  });

  freeAtualizarModo(box);
}

function freeModoAtual(box){
  const r = box.querySelector(".free-cfg-modo:checked");
  return r ? r.value : "TODOS";
}

function freeAtualizarModo(box){
  const modo = freeModoAtual(box);
  const escolha = box.querySelector(".free-cfg-escolha");
  escolha.style.display = modo === "TODOS" ? "none" : "";
  box.querySelector(".free-cfg-prazo-linha").style.display = modo === "PRIORIDADE" ? "" : "none";

  if(modo !== "TODOS" && !box._pessoasDesenhadas){
    box._pessoasDesenhadas = true;
    freeCarregarAprovados()
      .then(function(lista){ freeDesenharPessoas(box, lista); })
      .catch(function(erro){
        box._pessoasDesenhadas = false;
        box.querySelector(".free-cfg-pessoas").innerHTML = '<div class="free-vazio">' + escapeHtml(freeMensagem(erro)) + '</div>';
      });
  }
}

function freeDesenharPessoas(box, lista){
  const area = box.querySelector(".free-cfg-pessoas");
  if(!lista.length){
    area.innerHTML = '<div class="free-vazio">Nenhum free aprovado ainda.</div>';
    return;
  }
  area.innerHTML = lista.map(function(p){
    return '<label class="free-escolha" data-nome="' + escapeHtml(String(p.nome).toLowerCase()) + '">' +
      '<input type="checkbox" value="' + escapeHtml(p.id) + '"' + (box._preferidos.has(p.id) ? " checked" : "") + '>' +
      '<span class="free-escolha-nome">' + escapeHtml(p.nome) + '</span>' +
      freeEstrelas(p.nota) +
      '<small>' + p.trabalhos + ' trab.' + (p.faltas ? ' · ' + p.faltas + ' falta' + (p.faltas > 1 ? "s" : "") : "") + '</small>' +
    '</label>';
  }).join("");

  area.querySelectorAll("input").forEach(function(c){
    c.addEventListener("change", function(){
      if(c.checked){ box._preferidos.add(c.value); } else { box._preferidos.delete(c.value); }
      freeContarEscolhidos(box);
    });
  });
  freeContarEscolhidos(box);
}

function freeContarEscolhidos(box){
  const n = box._preferidos.size;
  box.querySelector(".free-cfg-contagem").textContent = n ? "(" + n + " escolhido" + (n > 1 ? "s" : "") + ")" : "";
}

/* Lê o formulário. Retorna { dados, erro } */
function freeLerConfig(box){
  const val = function(sel){ return (box.querySelector(sel) || {}).value || ""; };
  const modo = freeModoAtual(box);
  const valor = freeValorParaNumero(val(".free-cfg-valor"));

  const dados = {
    quantidade: val(".free-cfg-qtd"),
    valor: valor,
    horario: val(".free-cfg-horario"),
    pontoEncontro: val(".free-cfg-ponto").trim(),
    lider: val(".free-cfg-lider").trim(),
    observacao: val(".free-cfg-obs").trim(),
    modo: modo,
    preferidos: modo === "TODOS" ? [] : Array.from(box._preferidos || []),
    prazoMin: modo === "PRIORIDADE" ? Number(val(".free-cfg-prazo")) || 0 : 0
  };

  if(box._geo && box._geo.endereco === dados.pontoEncontro){
    dados.pontoLat = box._geo.lat;
    dados.pontoLng = box._geo.lng;
  }

  let erro = "";
  if(!(Number(dados.quantidade) >= 1)){ erro = "Informe quantos free você precisa."; }
  else if(!(valor > 0)){ erro = "Informe o valor da diária."; }
  else if(!dados.pontoEncontro){ erro = "Informe o ponto de encontro."; }
  else if(modo !== "TODOS" && !dados.preferidos.length){ erro = "Escolha quem recebe a vaga primeiro."; }

  return { dados: dados, erro: erro };
}

   PEDIR FREE DENTRO DO NOVO PEDIDO / EDITAR PEDIDO

function freeEtapaDoCronograma(idEtapa){
  let achada = null;
  (typeof cronogramaData !== "undefined" ? cronogramaData : []).forEach(function(p){
    (p.etapas || []).forEach(function(e){
      if(String(e.id) === String(idEtapa)){ achada = { etapa: e, pedido: p }; }
    });
  });
  return achada;
}

// Chamado sempre que o tipo da etapa muda (e ao abrir um pedido para editar)
function freeControlarPedidoEtapa(item, permite){
  if(!item){ return; }
  const grade = item.querySelector(".mini-grid");
  let box = item.querySelector(".free-pedido-box");

  if(!permite){
    if(box){ box.remove(); }
    return;
  }

  if(!box){
    box = document.createElement("div");
    box.className = "free-pedido-box";
    grade.appendChild(box);
  }

  const idEtapa = item.dataset.id || "";
  const achada = idEtapa ? freeEtapaDoCronograma(idEtapa) : null;
  const vagaExistente = achada && achada.etapa.freeVaga;

  if(box.dataset.estado === (vagaExistente ? "existente" : "nova")){ return; }
  box.dataset.estado = vagaExistente ? "existente" : "nova";

  if(vagaExistente){
    const v = achada.etapa.freeVaga;
    freeRegistrarContexto(achada.etapa, achada.pedido);
    box.innerHTML =
      '<div class="free-pedido-topo">' +
        '<span>' + FREE_ICONE + '<strong>Free:</strong> ' + v.confirmados + ' de ' + v.quantidade + ' confirmados' +
          (v.valor ? ' · ' + escapeHtml(freeMoeda(v.valor)) : "") + '</span>' +
        '<button type="button" class="btn btn-light" onclick="freeAbrirVagaEtapa(\'' + escapeHtml(idEtapa) + '\')">Gerenciar vaga</button>' +
      '</div>';
    return;
  }

  box.innerHTML =
    '<label class="free-pedido-topo free-pedido-check">' +
      '<input type="checkbox" class="free-pedido-ativo">' +
      '<span>' + FREE_ICONE + '<strong>Pedir free para esta etapa</strong> — a vaga abre no app quando o pedido for salvo</span>' +
    '</label>' +
    '<div class="free-cfg free-pedido-cfg" style="display:none;">' +
      freeConfigHtml({ pontoEncontro: freeLerPonto() }, { compacto: true }) +
    '</div>';

  const cfg = box.querySelector(".free-pedido-cfg");
  box.querySelector(".free-pedido-ativo").addEventListener("change", async function(){
    const marcado = this;

    // Pedir free exige a senha do Supervisor de Montagem
    if(marcado.checked){
      marcado.checked = false;
      const token = await freeObterToken(false);
      if(!token){ return; }
      marcado.checked = true;
    }

    cfg.style.display = marcado.checked ? "" : "none";
    if(marcado.checked){ freeIniciarConfig(cfg, { pontoEncontro: freeLerPonto() }); }
  });
}

// Acrescenta a vaga pedida em cada etapa do payload (antes de enviar)
function freeAnexarAoPayload(payload){
  const itens = Array.from(document.querySelectorAll(".etapa-item"));
  let erro = "";

  (payload.etapas || []).forEach(function(e, i){
    const item = itens[i];
    const ativo = item && item.querySelector(".free-pedido-ativo");
    if(!ativo || !ativo.checked){ return; }

    const lido = freeLerConfig(item.querySelector(".free-pedido-cfg"));
    if(lido.erro && !erro){ erro = (e.etapa || "Etapa") + ": " + lido.erro; }
    e.freeVaga = lido.dados;
  });

  return erro;
}

function freeMensagemPedidoSalvo(res){
  if(!res || !res.free){ return ""; }
  const f = res.free;
  let msg = "";
  if(f.criadas){ msg += "<br>" + f.criadas + (f.criadas === 1 ? " vaga de free aberta no app." : " vagas de free abertas no app."); }
  if(f.erros && f.erros.length){
    msg += "<br><br><strong>Vagas de free não criadas:</strong><br>" + f.erros.map(escapeHtml).join("<br>");
  }
  return msg;
}

async function freeAbrirVagaEtapa(idEtapa){
  const contexto = window.freeContextos[idEtapa];
  if(!contexto){ return; }

  const token = await freeObterToken(false);
  if(!token){ return; }

  freeEstado.contexto = contexto;
  freeEstado.vaga = null;
  freeEstado.alterou = false;

  document.getElementById("freeVagaCorpo").innerHTML = '<div class="free-vazio">Carregando…</div>';
  document.getElementById("modalFreeVaga").classList.add("show");

  try{
    freeEstado.vaga = await freeChamar("FREE_admBuscarVagaPorEtapa", idEtapa);
    freeRenderVaga();
  }catch(erro){
    freeFecharVaga();
    freeTratarErro(erro);
  }
}

async function freeAbrirVagaId(idVaga){
  freeEstado.alterou = false;
  document.getElementById("freeVagaCorpo").innerHTML = '<div class="free-vazio">Carregando…</div>';
  document.getElementById("modalFreeVaga").classList.add("show");

  try{
    const vaga = await freeChamar("FREE_admDetalheVaga", idVaga);
    freeEstado.vaga = vaga;
    freeEstado.contexto = window.freeContextos[vaga.idEtapa] || {
      idEtapa: vaga.idEtapa, etapa: vaga.etapa, dataEtapa: vaga.dataISO,
      horario: vaga.horario, responsavel: vaga.lider,
      pedido: vaga.pedido, cliente: vaga.cliente, local: vaga.local
    };
    freeRenderVaga();
  }catch(erro){
    freeFecharVaga();
    freeTratarErro(erro);
  }
}

function freeFecharVaga(){
  freeFecharQr();
  document.getElementById("modalFreeVaga").classList.remove("show");

  if(freeEstado.alterou){
    freeEstado.alterou = false;
    if(typeof carregarCronograma === "function"){ carregarCronograma(); }

      freeEstado.vagasSemana = null;
      freeRenderPainel();

function freeRenderVaga(){
  const c = freeEstado.contexto || {};
  const v = freeEstado.vaga;
  const existe = !!v;

  const valoresVaga = existe ? v : {
    quantidade: 3,
    horario: freeHoraInput(c.horario),
    pontoEncontro: freeLerPonto(),
    lider: c.responsavel
  };

  const inscricoes = existe ? (v.inscricoes || []) : [];
  const confirmados = inscricoes.filter(function(i){ return i.status === "CONFIRMADO"; });
  const cancelados = inscricoes.filter(function(i){ return i.status !== "CONFIRMADO"; }).reverse();
  const pendentesMudanca = confirmados.filter(function(i){ return i.presenca && i.presenca.mudanca; });

  let statusHtml = "";
  if(existe){
    const classe = v.status === "ABERTA" ? (confirmados.length >= v.quantidade ? "ok" : "aviso") : (v.status === "CANCELADA" ? "erro" : "");
    const texto = v.status === "ABERTA" ? (confirmados.length >= v.quantidade ? "Equipe completa" : "Aberta") : (v.status === "ENCERRADA" ? "Encerrada" : "Cancelada");
    statusHtml = '<span class="free-status ' + classe + '">' + texto + '</span>';
  }

  // Avisos de mudança feita no cronograma depois de abrir a vaga
  const avisos = [];
  if(existe && v.dataOriginal && v.dataOriginal !== v.dataISO){
    avisos.push("A etapa mudou de dia no cronograma (" + freeDataCurta(v.dataOriginal) + " → " + freeDataCurta(v.dataISO) + ").");
  }
  if(existe && v.horarioMudou){
    avisos.push("A etapa mudou de horário (" + v.horarioEtapaBase + " → " + v.horarioEtapaAtual + "). O encontro foi ajustado de " + v.horarioOriginal + " para " + v.horario + ".");
  }
  if(avisos.length){
    avisos.push(pendentesMudanca.length
      ? (pendentesMudanca.length === 1 ? "1 free ainda não confirmou" : pendentesMudanca.length + " free ainda não confirmaram") + " que viu a mudança — avise pelo WhatsApp na lista abaixo."
      : "Todos os confirmados já viram a mudança no app.");
  }

  let html =
    '<div class="free-erro" id="freeVagaErro"></div>' +
    '<div class="free-sub">' +
      '<span><strong>' + escapeHtml(c.etapa || "Etapa") + '</strong> · ' + escapeHtml(freeDataCurta(existe ? v.dataISO : c.dataEtapa)) + (c.horario ? ' às ' + escapeHtml(c.horario) : "") + '</span>' +
      '<span>Pedido #' + escapeHtml(c.pedido || "-") + ' · ' + escapeHtml(c.cliente || "-") + '</span>' +
      statusHtml +
    '</div>' +
    (avisos.length ? '<div class="free-erro ver free-aviso">' + avisos.map(escapeHtml).join("<br>") + '</div>' : "") +

    '<div class="free-cfg" id="freeVagaCfg">' + freeConfigHtml(valoresVaga, { editando: existe }) + '</div>' +

    '<div class="free-acoes">' +
      '<button class="btn btn-primary" type="button" id="freeBtnSalvar" onclick="freeSalvarVaga()">' + (existe ? "Salvar alterações" : "Abrir vaga no app") + '</button>' +
      (existe
        ? (v.status === "ABERTA"
            ? '<button class="btn btn-light" type="button" onclick="freeStatusVaga(\'ENCERRADA\')" title="Para de aparecer no app, mas mantém quem confirmou">Encerrar vaga</button>'
            : '<button class="btn btn-light" type="button" onclick="freeStatusVaga(\'ABERTA\')">Reabrir vaga</button>') +
          (v.status !== "CANCELADA" ? '<button class="btn btn-light" type="button" style="color:#dc2626;" onclick="freeStatusVaga(\'CANCELADA\')">Cancelar vaga</button>' : "") +
          (v.modo && v.modo !== "TODOS" ? '<button class="btn btn-light free-dir" type="button" onclick="freeAvisarEscolhidos()">Avisar escolhidos</button>' : "") +
          '<button class="btn btn-light' + (v.modo && v.modo !== "TODOS" ? "" : " free-dir") + '" type="button" onclick="freeDivulgar()">Divulgar no WhatsApp</button>'
        : "") +
    '</div>';

  if(existe && v.status !== "CANCELADA"){
    html +=
      '<div class="free-qr-barra">' +
        '<div><strong>Presença por QR code</strong>No dia, o líder mostra o QR e cada free lê com a câmera para o check-in e, no fim, para o check-out. O código muda a cada minuto.</div>' +
        '<button class="btn btn-primary" type="button" onclick="freeMostrarQr()">QR code de presença</button>' +
        '<button class="btn btn-light" type="button" onclick="freeEnviarQrLider()">Enviar QR ao líder</button>' +
      '</div>' +
      '<div id="freeQrArea"></div>';
  }

  if(existe){
    const comEntrada = confirmados.filter(function(i){ return i.checkinEm; }).length;
    const comSaida = confirmados.filter(function(i){ return i.checkoutEm; }).length;

    html += '<div class="free-secao">Confirmados <span>' + confirmados.length + ' de ' + v.quantidade + '</span>' +
      (comEntrada ? '<span style="margin-left:auto;color:#166534;">' + comEntrada + ' check-in · ' + comSaida + ' check-out</span>' : "") + '</div>';

    html += confirmados.length
      ? '<div class="free-lista">' + confirmados.map(freeLinhaConfirmado).join("") + '</div>'
      : '<div class="free-vazio">Ninguém confirmou ainda. A vaga já aparece no app dos free.</div>';

    if(cancelados.length){
      html += '<div class="free-secao">Cancelamentos <span>' + cancelados.length + '</span></div>';
      html += '<div class="free-lista">' + cancelados.map(function(i){
        const removido = i.status === "REMOVIDO";
        return '<div class="free-pessoa" style="opacity:.8;">' + freeFotoHtml(i) +
          '<div class="free-pessoa-info"><strong>' + escapeHtml(i.nome) + '</strong>' +
            (removido ? "Retirado por " + escapeHtml(i.canceladoPor || "supervisor") : "Cancelou") + ' em ' + escapeHtml(i.canceladoEm || "") +
            (i.motivo && !removido ? ' · “' + escapeHtml(i.motivo) + '”' : "") +
            ' · ' + freeLinkWhats(i.telefone, i.nome) + '</div>' +
          (i.cimaDaHora ? '<span class="free-status erro">Em cima da hora</span>' : "") +
        '</div>';
      }).join("") + '</div>';
    }
  }

}

/* Uma linha por free confirmado: contato + situação da presença */
function freeLinhaConfirmado(i){
  const p = i.presenca || {};
  const v = freeEstado.vaga;
  const detalhes = [];
  let chip = "";

  const fases = {
    AGUARDANDO: ['', "Confirmado"],
    CHECKIN: ['aviso', "Aguardando check-in"],
    TRABALHANDO: ['ok', "Em serviço"],
    CONCLUIDO: ['ok', "Concluído"],
    SEM_CHECKOUT: ['aviso', "Sem check-out"],
    FALTOU: ['erro', "Faltou"],
    CANCELADA: ['erro', "Vaga cancelada"]
  };
  const f = fases[p.fase] || fases.AGUARDANDO;
  chip = '<span class="free-status ' + f[0] + '">' + f[1] + '</span>';

  if(p.checkinEm){
    let entrada = "Entrada " + freeHora(p.checkinEm) + (p.checkinVia ? " (" + escapeHtml(p.checkinVia) + ")" : "");
    if(p.checkinDistancia !== "" && p.checkinDistancia != null){ entrada += " · " + freeDistancia(p.checkinDistancia) + " do ponto"; }
    else if(p.checkinSemGps && p.checkinVia !== "Manual"){ entrada += " · sem GPS"; }
    detalhes.push(entrada);
  }
  if(p.checkoutEm){
    detalhes.push("Saída " + freeHora(p.checkoutEm) + (p.horasTrabalhadas ? " · <b>" + escapeHtml(p.horasTrabalhadas) + "</b> trabalhadas" : ""));
  }
  if(p.presencaPor){
    detalhes.push("Lançado por " + escapeHtml(p.presencaPor));
  }

  let avisos = "";
  if(p.longeDoPonto){
    avisos += '<span class="free-status erro" title="Check-in ou check-out a mais de 1 km do ponto de encontro">Longe do ponto</span>';
  }
  if(p.mudanca){
    const msg = "Oi " + String(i.nome || "").split(" ")[0] + "! A " + (v.etapa || "montagem").toLowerCase() +
      " mudou: agora é " + freeDataCurta(p.mudanca.dataAgora) + " às " + p.mudanca.horarioAgora +
      " (antes " + freeDataCurta(p.mudanca.dataAntes) + " às " + p.mudanca.horarioAntes + "). Confirme no app que você viu, por favor.";
    const n = String(i.telefone || "").replace(/\D/g, "");
    avisos += '<a class="free-status aviso" style="text-decoration:none;" target="_blank" rel="noopener" href="https://wa.me/55' + n + '?text=' + encodeURIComponent(msg) + '" title="Avisar no WhatsApp">Não viu a mudança · avisar</a>';
  }

  // Lançamento manual quando o celular do free falhar
  let botoes = "";
  if(!p.checkinEm && (p.fase === "CHECKIN" || p.fase === "FALTOU")){
    botoes += '<button class="btn btn-light" type="button" onclick="freeAbrirLancamento(\'' + escapeHtml(i.id) + '\', \'checkin\')">Lançar entrada</button>';
  }
  if(p.checkinEm && !p.checkoutEm){
    botoes += '<button class="btn btn-light" type="button" onclick="freeAbrirLancamento(\'' + escapeHtml(i.id) + '\', \'checkout\')">Lançar saída</button>';
  }
  if(!p.checkinEm){
    botoes += '<button class="btn btn-light" type="button" onclick="freeRemover(\'' + escapeHtml(i.id) + '\', \'' + escapeHtml(String(i.nome).replace(/'/g, "")) + '\')">Retirar</button>';
  }

  return '<div class="free-pessoa free-pessoa-presenca">' + freeFotoHtml(i) +
    '<div class="free-pessoa-info"><strong>' + escapeHtml(i.nome) + ' ' + freeEstrelas(i.nota) + ' ' + chip + '</strong>' +
      freeLinkWhats(i.telefone, i.nome) + ' · confirmou ' + escapeHtml(i.confirmadoEm || "") +
      (detalhes.length ? '<div class="free-presenca-linha">' + detalhes.join(" · ") + '</div>' : "") +
      (avisos ? '<div class="free-presenca-avisos">' + avisos + '</div>' : "") +
      '<div id="freeLanc_' + escapeHtml(i.id) + '"></div>' +
    '</div>' +
    '<div class="free-pessoa-botoes">' + botoes + '</div>' +
  '</div>';
}

function freeHora(texto){
  const m = String(texto || "").match(/(\d{1,2}):(\d{2})/);
  return m ? ("0" + m[1]).slice(-2) + ":" + m[2] : "-";
}

function freeDistancia(metros){
  const n = Number(metros);
  return n >= 1000 ? (n / 1000).toFixed(1).replace(".", ",") + " km" : Math.round(n) + " m";
}

function freeAbrirLancamento(idInscricao, tipo){
  const area = document.getElementById("freeLanc_" + idInscricao);
  if(!area){ return; }
  const agora = new Date();
  const sugestao = ("0" + agora.getHours()).slice(-2) + ":" + ("0" + agora.getMinutes()).slice(-2);
  area.innerHTML =
    '<div class="free-lancamento">' +
      '<span>' + (tipo === "checkin" ? "Horário de entrada" : "Horário de saída") + '</span>' +
      '<input type="time" id="freeLancHora_' + idInscricao + '" value="' + sugestao + '">' +
      '<button class="btn btn-primary" type="button" onclick="freeLancar(\'' + idInscricao + '\', \'' + tipo + '\')">Lançar</button>' +
      '<button class="btn btn-light" type="button" onclick="this.closest(\'.free-lancamento\').remove()">Cancelar</button>' +
    '</div>';
}

async function freeLancar(idInscricao, tipo){
  const hora = (document.getElementById("freeLancHora_" + idInscricao) || {}).value || "";
  try{
    freeEstado.vaga = await freeChamar("FREE_admLancarPresenca", idInscricao, tipo, hora);
    freeEstado.alterou = true;
    freeRenderVaga();
  }catch(erro){
    freeTratarErro(erro, "freeVagaErro");
  }
}

/* ---------- QR code de presença ---------- */

async function freeMostrarQr(){
  const v = freeEstado.vaga;
  const area = document.getElementById("freeQrArea");
  if(!v || !area){ return; }

  freeEstado.qrAberto = true;
  clearTimeout(freeEstado.qrTimer);

  try{
    const d = await freeChamar("FREE_admQrVaga", v.idVaga);
    freeEstado.qrLinkLider = d.linkLider;

    const destino = document.getElementById("freeQrArea");
    if(!destino || !freeEstado.qrAberto){ return; }

    destino.innerHTML =
      '<div class="free-qr-caixa">' +
        '<div id="freeQrImagem"></div>' +
        '<div>' +
          '<div class="free-qr-codigo">' + escapeHtml(d.codigo) + '</div>' +
          '<p>Os free leem o QR com a câmera do celular ou digitam o código. Ele troca sozinho a cada minuto.</p>' +
          '<p><strong>' + d.equipe.filter(function(p){ return p.checkinEm; }).length + ' de ' + d.equipe.length + '</strong> já fizeram check-in.</p>' +
          '<button class="btn btn-light" type="button" onclick="freeFecharQr()">Fechar QR</button>' +
        '</div>' +
      '</div>';

    if(window.QRCode){
      new QRCode(document.getElementById("freeQrImagem"), {
        text: d.urlQr, width: 220, height: 220,
        colorDark: "#1f2020", colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.M
      });
    }

    // Busca o próximo código logo depois da troca
    freeEstado.qrTimer = setTimeout(function(){
      if(freeEstado.qrAberto && document.getElementById("modalFreeVaga").classList.contains("show")){
        freeMostrarQr();
      }
    }, Math.max(3000, d.trocaEm + 800));

  }catch(erro){
    freeEstado.qrAberto = false;
    freeTratarErro(erro, "freeVagaErro");
  }
}

function freeFecharQr(){
  freeEstado.qrAberto = false;
  clearTimeout(freeEstado.qrTimer);
  const area = document.getElementById("freeQrArea");
  if(area){ area.innerHTML = ""; }
}

}

async function freeSalvarVaga(){
  freeLimparErroVaga();
  const botao = document.getElementById("freeBtnSalvar");
  const c = freeEstado.contexto || {};
  const lido = freeLerConfig(document.getElementById("freeVagaCfg"));

  if(lido.erro){
    freeTratarErro(new Error(lido.erro), "freeVagaErro");
    return;
  }

  const dados = Object.assign(lido.dados, {
    idVaga: freeEstado.vaga ? freeEstado.vaga.idVaga : "",
    idEtapa: c.idEtapa
  });

  botao.disabled = true;
  botao.textContent = "Salvando…";

  try{
    const novaVaga = !freeEstado.vaga;
    freeEstado.vaga = await freeChamar("FREE_admSalvarVaga", dados);
    freeEstado.alterou = true;
    freeSalvarPonto(dados.pontoEncontro);
    freeRenderVaga();

          ? "Vaga aberta para os escolhidos! Quer avisá-los no WhatsApp agora?"

      );

    botao.disabled = false;
    botao.textContent = freeEstado.vaga ? "Salvar alterações" : "Abrir vaga no app";
    freeTratarErro(erro, "freeVagaErro");
  }
}

  const textos = {

   PAINEL EQUIPE FREE (vagas da semana + cadastros)

async function freeAbrirPainel(aba){
  const token = await freeObterToken(false);
  if(!token){ return; }

  freeEstado.aba = aba || freeEstado.aba || "vagas";
  freeEstado.vagasSemana = null;
  freeEstado.cadastros = null;

  document.getElementById("modalFreePainel").classList.add("show");
  freeRenderPainel();
}

function freeFecharPainel(){
  document.getElementById("modalFreePainel").classList.remove("show");
}

function freeTrocarAba(aba){
  freeEstado.aba = aba;
  freeRenderPainel();
}

function freeSemanaISO(){
  const inicio = new Date(semanaInicioAtual);
  const fim = new Date(semanaInicioAtual);
  fim.setDate(fim.getDate() + 6);
  return { inicio: formatDateISO(inicio), fim: formatDateISO(fim) };
}

async function freeRenderPainel(){
  const corpo = document.getElementById("freePainelCorpo");
  const pendentes = (freeEstado.cadastros || []).filter(function(c){ return c.status === "PENDENTE"; }).length;

  const topo =
    '<div class="free-link">' +
      '<span>Link do app dos free:</span><code id="freeUrlTexto">carregando…</code>' +
      '<button class="btn btn-light" type="button" onclick="freeCopiarLink()">Copiar</button>' +
    '</div>' +
    '<div class="free-abas">' +
      '<button class="btn ' + (freeEstado.aba === "vagas" ? "btn-primary" : "btn-light") + '" type="button" onclick="freeTrocarAba(\'vagas\')">Vagas da semana</button>' +
      '<button class="btn ' + (freeEstado.aba === "cadastros" ? "btn-primary" : "btn-light") + '" type="button" onclick="freeTrocarAba(\'cadastros\')">Cadastros' + (pendentes ? " (" + pendentes + " novos)" : "") + '</button>' +
    '</div>' +
    '<div class="free-erro" id="freePainelErro"></div>';

  corpo.innerHTML = topo + '<div id="freePainelConteudo"><div class="free-vazio">Carregando…</div></div>';

  freeUrlApp().then(function(url){
    const el = document.getElementById("freeUrlTexto");
    if(el){ el.textContent = url; }
  }).catch(function(){});

  try{
    if(freeEstado.aba === "vagas"){
      if(!freeEstado.vagasSemana){
        const semana = freeSemanaISO();
        freeEstado.vagasSemana = await freeChamar("FREE_admListarVagas", semana.inicio, semana.fim);
      }
      document.getElementById("freePainelConteudo").innerHTML = freeHtmlVagasSemana();
    }else{
      if(!freeEstado.cadastros){
        freeEstado.cadastros = await freeChamar("FREE_admListarCadastros");
        return freeRenderPainel();
      }
      document.getElementById("freePainelConteudo").innerHTML = freeHtmlCadastros();
    }
  }catch(erro){
    const conteudo = document.getElementById("freePainelConteudo");
    if(conteudo){ conteudo.innerHTML = ""; }
    freeTratarErro(erro, "freePainelErro");
  }
}

function freeHtmlVagasSemana(){
  const vagas = (freeEstado.vagasSemana || []).filter(function(v){ return v.status !== "CANCELADA"; });
  const comVaga = {};
  vagas.forEach(function(v){ comVaga[v.idEtapa] = true; });

  let html = '<div class="free-secao">Vagas abertas nesta semana <span>' + vagas.length + '</span></div>';

  html += vagas.length
    ? '<div class="free-lista">' + vagas.map(function(v){
        const completa = v.confirmados >= v.quantidade;
        return '<div class="free-linha-vaga" onclick="freeAbrirVagaId(\'' + escapeHtml(v.idVaga) + '\')">' +
          '<div class="free-dia">' + escapeHtml(freeDataCurta(v.dataISO)) + '<small>' + escapeHtml(v.horario) + '</small></div>' +
          '<div class="free-meio"><strong>' + escapeHtml(v.etapa) + ' · ' + escapeHtml(v.cliente || "-") + '</strong>' +
            escapeHtml(v.pontoEncontro) + ' · Líder ' + escapeHtml(v.lider) +
            (v.nomes.length ? '<br>' + escapeHtml(v.nomes.join(", ")) : "") + '</div>' +
          '<div class="free-num" style="color:' + (v.status === "ENCERRADA" ? "#6b6b6b" : completa ? "#166534" : "#b45309") + ';">' + v.confirmados + '/' + v.quantidade +
            '<small>' + (v.status === "ENCERRADA" ? "encerrada" : completa ? "completa" : "faltam " + (v.quantidade - v.confirmados)) + '</small>' +
            (v.cimaDaHora ? '<small style="color:#dc2626;">' + v.cimaDaHora + ' cancel. em cima</small>' : "") +
            (v.checkins ? '<small style="color:#166534;">✓ ' + v.checkins + ' check-in</small>' : "") +
            (v.faltas ? '<small style="color:#dc2626;">' + v.faltas + ' falta' + (v.faltas > 1 ? "s" : "") + '</small>' : "") +
            (v.mudancasPendentes ? '<small style="color:#b45309;">' + v.mudancasPendentes + ' não viu mudança</small>' : "") +
          '</div>' +
        '</div>';
      }).join("") + '</div>'
    : '<div class="free-vazio">Nenhuma vaga aberta nesta semana.</div>';

  // Montagens e desmontagens da semana que ainda não pediram free
  const semVaga = [];
  (window.cronogramaData || (typeof cronogramaData !== "undefined" ? cronogramaData : [])).forEach(function(pedido){
    (pedido.etapas || []).forEach(function(etapa){
      const nome = String(etapa.etapa || "").toLowerCase();
      if(nome.indexOf("montagem") < 0){ return; }
      if(typeof getDayIndexTerSeg === "function" && getDayIndexTerSeg(etapa.dataEtapa) < 0){ return; }
      if(String(etapa.dataEtapa || "") < formatDateISO(new Date())){ return; }
      const id = freeRegistrarContexto(etapa, pedido);
      if(id && !comVaga[id] && !etapa.freeVaga){
        semVaga.push(window.freeContextos[id]);
      }
    });
  });

  semVaga.sort(function(a, b){ return (a.dataEtapa + a.horario).localeCompare(b.dataEtapa + b.horario); });

  if(semVaga.length){
    html += '<div class="free-secao">Sem pedido de free <span>' + semVaga.length + '</span></div>';
    html += '<div class="free-lista">' + semVaga.map(function(c){
      return '<div class="free-linha-vaga" onclick="freeAbrirVagaEtapa(\'' + escapeHtml(c.idEtapa) + '\')">' +
        '<div class="free-dia">' + escapeHtml(freeDataCurta(c.dataEtapa)) + '<small>' + escapeHtml(c.horario || "-") + '</small></div>' +
        '<div class="free-meio"><strong>' + escapeHtml(c.etapa) + ' · ' + escapeHtml(c.cliente || "-") + '</strong>Resp. ' + escapeHtml(c.responsavel || "-") + '</div>' +
        '<div class="free-num"><span class="free-status">+ Pedir free</span></div>' +
      '</div>';
    }).join("") + '</div>';
  }

  return html;
}

  const todos = freeEstado.cadastros || [];
  const pendentes = todos.filter(function(c){ return c.status === "PENDENTE"; });
  const aprovados = todos.filter(function(c){ return c.status === "APROVADO"; });
  const bloqueados = todos.filter(function(c){ return c.status === "BLOQUEADO"; });

      botoes =

    }else if(c.status === "APROVADO"){
      botoes = '<button class="btn btn-light" type="button" onclick="freeStatusCadastro(\'' + escapeHtml(c.id) + '\', \'BLOQUEADO\')">Bloquear</button>';
    }else{
      botoes = '<button class="btn btn-light" type="button" onclick="freeStatusCadastro(\'' + escapeHtml(c.id) + '\', \'APROVADO\')">Desbloquear</button>';
    }

    const historico = c.status === "PENDENTE"
      ? "cadastrou em " + escapeHtml(c.cadastradoEm)
      : c.trabalhos + " trabalhos · " + c.confirmacoes + " confirmações · " + c.cancelamentos + " cancelamentos" +
        (c.faltas ? ' · <span style="color:#dc2626;">' + c.faltas + (c.faltas === 1 ? " falta" : " faltas") + '</span>' : "") +
        (c.cimaDaHora ? ' · <span style="color:#dc2626;">' + c.cimaDaHora + ' em cima da hora</span>' : "");

    const historicoNota = (c.historico || []).slice(0, 4).map(function(h){
      return '<span style="color:' + (h.delta < 0 ? "#dc2626" : "#166534") + ';">' + (h.delta > 0 ? "+" : "") + String(h.delta).replace(".", ",") + ' ' + escapeHtml(h.motivo) + ' (' + escapeHtml(h.titulo) + ')</span>';
    }).join("");

    return '<div class="free-pessoa" data-busca="' + escapeHtml((c.nome + " " + c.cpf + " " + c.telefone).toLowerCase()) + '">' + freeFotoHtml(c) +
      '<div class="free-pessoa-info"><strong>' + escapeHtml(c.nome) + (c.status !== "PENDENTE" ? " " + freeEstrelas(c.nota) : "") + '</strong>' +
        'CPF ' + escapeHtml(c.cpf) + ' · ' + freeLinkWhats(c.telefone, c.nome) + '<br>' + historico +
        (historicoNota ? '<div class="free-historico">' + historicoNota + '</div>' : "") + '</div>' +
      '<div style="display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end;">' + botoes + '</div>' +
    '</div>';
  }

  let html = "";

  html += '<div class="free-secao">Aguardando aprovação <span>' + pendentes.length + '</span></div>';
  html += pendentes.length
    ? '<div class="free-lista">' + pendentes.map(linha).join("") + '</div>'
    : '<div class="free-vazio">Nenhum cadastro novo.</div>';

  html += '<div class="free-secao">Aprovados <span>' + aprovados.length + '</span></div>';
  if(aprovados.length > 6){
    html += '<input class="free-busca" type="search" placeholder="Buscar por nome, CPF ou telefone" oninput="freeFiltrarCadastros(this.value)" autocomplete="off" data-lpignore="true" data-1p-ignore="true">';
  }
  html += aprovados.length
    ? '<div class="free-lista" id="freeListaAprovados">' + aprovados.map(linha).join("") + '</div>'
    : '<div class="free-vazio">Ninguém aprovado ainda.</div>';

  if(bloqueados.length){
    html += '<div class="free-secao">Bloqueados <span>' + bloqueados.length + '</span></div>';
    html += '<div class="free-lista">' + bloqueados.map(linha).join("") + '</div>';
  }

  return html;
}

function freeFiltrarCadastros(termo){
  const t = String(termo || "").toLowerCase().trim();
  document.querySelectorAll("#freeListaAprovados .free-pessoa").forEach(function(el){
    el.style.display = !t || el.dataset.busca.indexOf(t) >= 0 ? "" : "none";
  });
}

async function freeStatusCadastro(idFree, status){
  try{
    freeEstado.cadastros = await freeChamar("FREE_admAlterarStatusCadastro", idFree, status);
    freeRenderPainel();
  }catch(erro){
    freeTratarErro(erro, "freePainelErro");
  }
}

async function freeCopiarLink(){
  try{
    const url = await freeUrlApp();
    await navigator.clipboard.writeText(url);
    mostrarAlerta("Link copiado. Mande para os free fazerem o cadastro.", "Equipe Free");
  }catch(e){
    mostrarAlerta(escapeHtml(freeEstado.urlApp || "Não foi possível copiar."), "Link do app");
  }
}
</script>
<script>
/* Na tela própria o painel fica aberto direto (sem janela) */
async function freeAbrirPainel(aba){
  const token = await freeObterToken(false);
  if(!token){ document.getElementById("freePainelCorpo").innerHTML = '<div class="free-vazio">Sem acesso à Equipe Free.</div>'; return; }
  freeEstado.aba = aba || freeEstado.aba || "vagas";
  freeEstado.vagasSemana = null;
  freeEstado.cadastros = null;
  freeRenderPainel();
}
function freeFecharPainel(){}
/* O acesso aqui é pelo login: não exige o perfil de montagem na tela (o servidor confere) */
async function freeObterToken(forcar){
  if(forcar){ encerrarLiberacaoEdicaoCronograma(); }
  const ok = await pedirSenha("Equipe Free");
  return ok ? window.tokenAuditoria : null;
}
async function freeMudarSemana(dias){
  semanaInicioAtual.setDate(semanaInicioAtual.getDate() + dias);
  semanaInicioAtual = getInicioSemanaOperacional(semanaInicioAtual);
  freeEstado.vagasSemana = null;
  await carregarCronograma();
  freeRenderPainel();
}
window.addEventListener("load", async function(){
  await carregarCronograma();
  freeAbrirPainel(new URLSearchParams(location.search).get("aba") || "vagas");
});
</script>
