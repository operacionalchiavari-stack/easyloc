  <style>
    :root{
      --primary:var(--el-button-primary-bg,#7d603d);
      --primary-dark:var(--el-button-primary-hover,#654d31);
      --primary-soft:#e9ecef;
--accent:#6b6b6b;
      --bg:#f7f9fb;
      --card:#ffffff;
      --border:#e3e7ec;
      --text:#1f2020;
      --muted:#6b6b6b;
      --success:#16a34a;
      --danger:#dc2626;
      --warning:#f59e0b;

      --etapa-separacao:#edf0f3;
      --etapa-carregamento:var(--el-button-primary-soft,#f4efe8);
      --etapa-montagem:var(--el-button-primary-soft,#f4efe8);
      --etapa-evento:#dcfce7;
      --etapa-desmontagem:#ffedd5;

      --shadow:0 10px 30px rgba(31,32,32,0.08);
      --radius:18px;
      --radius-sm:12px;
    }

    *{
      box-sizing:border-box;
    }

html, body{
  margin:0;
  padding:0;
  font-family:var(--sans);
  background:var(--bg);
  color:var(--text);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

*{
  box-sizing:border-box;
}

body{
  padding:32px 32px 24px;
}

    .app{
      max-width: 1800px;
      margin:0 auto;
    }

    .topbar{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:16px;
      margin-bottom:28px;
      flex-wrap:wrap;
    }

    .title-wrap h1{
      margin:0;
      font-size:28px;
      font-weight:600;
      color:var(--el-color-text,#1f2020);
      letter-spacing:-0.02em;
    }

    .title-wrap p{
      margin:6px 0 0;
      color:var(--muted);
      font-size:14px;
    }

    .top-actions{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
    }

    .btn{
      border:none;
      border-radius:12px;
      padding:12px 16px;
      font-size:14px;
      font-weight:600;
      cursor:pointer;
      transition:.18s ease;
      box-shadow:var(--shadow);
    }

    .btn:hover{
      transform:translateY(-1px);
    }

    .btn-primary{
      background:var(--primary);
      color:#fff;
    }

.btn-accent{
  background:#6b6b6b;
  color:#fff;
}

    .btn-light{
      background:#fff;
      color:var(--primary-dark);
      border:1px solid var(--border);
      box-shadow:none;
    }

    .btn-danger{
      background:var(--danger);
      color:#fff;
    }

    .toolbar{
      background:#fff;
      border:1px solid var(--border);
      border-radius:18px;
      padding:14px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:16px;
      flex-wrap:wrap;
      margin-bottom:18px;
      box-shadow:var(--shadow);
    }

    .week-nav{
      display:flex;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
    }

    .week-badge{
      background:var(--el-color-surface-soft,#f6f7f9);
      color:var(--el-color-text,#1f2020);
      border-radius:12px;
      padding:10px 14px;
      font-weight:600;
      font-size:14px;
      border:1px solid var(--el-color-border,#e3e7ec);
      min-width:270px;
      text-align:center;
    }

    .toolbar-right{
      display:flex;
      gap:10px;
      align-items:center;
      flex-wrap:wrap;
    }

    .filter{
      background:#fff;
      border:1px solid var(--border);
      border-radius:12px;
      padding:10px 12px;
      font-size:14px;
      min-width:180px;
      outline:none;
    }

.board-wrap{
  overflow:visible; /* 🔥 ESSENCIAL */
  border-radius:20px;
  box-shadow:var(--shadow);
  border:1px solid var(--border);
  background:#fff;
}

    table.board{
      width:100%;
      border-collapse:separate;
      border-spacing:0;
      min-width:1500px;
    }

    .board thead th{
      position:sticky;
      top:0;
      z-index:3;
      background:var(--el-color-surface-soft,#f6f7f9);color:var(--el-color-text,#1f2020);
      padding:14px 12px;
      font-size:13px;
      text-transform:uppercase;
      letter-spacing:.04em;
      border-right:1px solid rgba(255,255,255,.12);
      white-space:nowrap;
    }

.board thead th:first-child{
  left:0;
  z-index:4;
  position:sticky;
  width:180px;
  min-width:180px;
  max-width:180px;
  text-align:left;
}

    .board tbody td{
      border-right:1px solid #e3e7ec;
      border-bottom:1px solid #e3e7ec;
      vertical-align:top;
      background:#fff;
    }

    .board tbody tr:hover td{
      background:#ffffff;
    }

.col-evento{
  position:sticky;
  left:0;
  z-index:2;
  background:#fff;
  width:180px;
  min-width:180px;
  max-width:180px;
  padding:10px;
}

    .evento-box{
      display:flex;
      flex-direction:column;
      gap:8px;
    }

.pedido-tag{
  display:inline-block;
  align-self:flex-start;
  background:#FEE2E2;
  color:#B91C1C;
  border:1px solid #FECACA;
  padding:6px 10px;
  border-radius:999px;
  font-weight:700;
  font-size:12px;
}

    .evento-cliente{
      font-size:16px;
      font-weight:600;
      color:var(--text);
      line-height:1.2;
    }

    .evento-meta{
      display:flex;
      flex-direction:column;
      gap:5px;
      font-size:13px;
      color:var(--muted);
    }

    .day-cell{
      width:170px;
      min-width:170px;
      height:150px;
      padding:10px;
      background:#fff;
    }

    .cards{
      display:flex;
      flex-direction:column;
      gap:8px;
      min-height:128px;
    }

    .task-card{
      border-radius:12px;
      padding:10px;
      border:1px solid rgba(0,0,0,.05);
      box-shadow:0 4px 14px rgba(31,32,32,0.05);
      font-size:12px;
      line-height:1.35;
    }

    .task-separacao{ background:var(--etapa-separacao); }
    .task-carregamento{ background:var(--etapa-carregamento); }
    .task-montagem{ background:var(--etapa-montagem); }
.task-evento{
  background:var(--etapa-evento);
  border:1px solid #86efac;

  display:flex;
  align-items:center;
  justify-content:center;
}

.task-evento .task-top{
  justify-content:center;
}

.task-evento .task-title{
  text-align:center;
  width:100%;
}
    .task-desmontagem{ background:var(--etapa-desmontagem); }

    .task-top{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:8px;
      margin-bottom:6px;
    }

    .task-title{
      font-size:12px;
      font-weight:600;
      color:#1f2020;
      text-transform:uppercase;
      letter-spacing:.03em;
    }

    .task-time{
      font-size:11px;
      font-weight:600;
      color:#2b2b2b;
      white-space:nowrap;
    }

    .task-line{
      color:#2b2b2b;
      font-size:12px;
      margin-top:2px;
    }

    .task-line strong{
      color:#1f2020;
    }

    .empty-state{
      padding:40px 20px;
      text-align:center;
      color:var(--muted);
      font-size:14px;
    }

    .overlay{
      position:fixed;
      inset:0;
      background:rgba(31,32,32,0.45);
      display:none;
      align-items:center;
      justify-content:center;
      padding:20px;
      z-index:50;
    }

    .overlay.show{
      display:flex;
    }

    .modal{
      width:min(1100px, 100%);
      max-height:90vh;
      overflow:auto;
      background:#fff;
      border-radius:22px;
      box-shadow:0 30px 80px rgba(31,32,32,0.25);
      border:1px solid #e3e7ec;
    }

    .modal-header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:14px;
      padding:18px 20px;
      border-bottom:1px solid #edf0f3;
      position:sticky;
      top:0;
      background:#fff;
      z-index:2;
    }

    .modal-header h2{
      margin:0;
      font-size:22px;
      color:var(--el-color-text,#1f2020);
    }

    .modal-body{
      padding:20px;
    }

    .modal-close{
      width:38px;
      height:38px;
      border:none;
      border-radius:10px;
      background:#fafbfc;
      cursor:pointer;
      font-size:18px;
      font-weight:600;
      color:#2b2b2b;
    }

.section-title{
  font-size:16px;
  font-weight:600;
  color:var(--el-color-text,#1f2020);
  letter-spacing:-0.01em;
  margin:0 0 12px;
}

.form-grid{
  display:grid;
  grid-template-columns: 110px 1.5fr 140px 2fr;
  gap:14px;
  margin-bottom:20px;
}

    .field{
      display:flex;
      flex-direction:column;
      gap:6px;
    }

    .field.span-2{
      grid-column:span 2;
    }

    .field.span-4{
      grid-column:span 4;
    }

.field label{
  font-size:11px;
  font-weight:600;
  color:#4f4f4f;
  text-transform:uppercase;
  letter-spacing:.05em;
}

.field input,
.field select,
.field textarea{
  width:100%;
  border:1px solid var(--border);
  border-radius:12px;
  padding:12px 12px;
  font-size:14px;
  font-weight:500;
  outline:none;
  background:#fff;
  color:#1f2020;
}

    .field textarea{
      min-height:90px;
      resize:vertical;
    }

    .field input:focus,
    .field select:focus,
    .field textarea:focus{
      border-color:var(--el-color-border,#e3e7ec);
      box-shadow:0 0 0 4px rgba(31,32,32,0.08);
    }

    .etapas-box{
      border:1px solid var(--border);
      border-radius:18px;
      padding:16px;
      background:#ffffff;
    }

    .etapas-head{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      margin-bottom:14px;
      flex-wrap:wrap;
    }

    .etapas-list{
      display:flex;
      flex-direction:column;
      gap:14px;
    }

.etapa-item{
  border:1px solid #e3e7ec;
  border-radius:16px;
  background:#fff;
  padding:14px;
  transition:.2s ease;
}

/* =====================================================
   ESPELHAR RESPONSÁVEL E EQUIPE NO DIA
===================================================== */

.espelhar-equipe-box{
  display:none;
  grid-column:1 / -1;

  margin-top:2px;
  padding:12px 14px;

  border:1px solid #e3e7ec;
  border-radius:12px;

  background:rgba(255,255,255,.72);
}

.espelhar-equipe-box.show{
  display:block;
}

.espelhar-equipe-label{
  display:flex;
  align-items:flex-start;
  gap:10px;

  cursor:pointer;
  user-select:none;
}

.espelhar-equipe-checkbox{
  width:18px !important;
  min-width:18px;
  height:18px;

  margin:1px 0 0;
  padding:0 !important;

  accent-color:var(--el-button-primary-bg,#7d603d);
  cursor:pointer;
}

.espelhar-equipe-conteudo{
  display:flex;
  flex-direction:column;
  gap:3px;
}

.espelhar-equipe-titulo{
  font-size:13px;
  line-height:1.35;

  font-weight:600;
  color:#1f2020;
}

.espelhar-equipe-descricao{
  font-size:11px;
  line-height:1.4;

  font-weight:500;
  color:#6b6b6b;
}

/* CORES IGUAIS AO CRONOGRAMA */
.etapa-carregamento{ background:var(--etapa-carregamento); }
.etapa-montagem{ background:var(--etapa-montagem); }
.etapa-desmontagem{ background:var(--etapa-desmontagem); }
.etapa-triagem{
  background:var(--etapa-separacao);
}

    .etapa-item-top{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      margin-bottom:12px;
      flex-wrap:wrap;
    }

    .etapa-badge{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:8px 12px;
      border-radius:999px;
      background:var(--el-color-surface-soft,#f6f7f9);
      color:var(--el-color-text,#1f2020);
      font-weight:600;
      font-size:12px;
      border:1px solid #e3e7ec;
    }

    .mini-grid{
      display:grid;
      grid-template-columns:repeat(5, minmax(0, 1fr));
      gap:12px;
    }

    .modal-footer{
      display:flex;
      justify-content:flex-end;
      gap:10px;
      padding:18px 20px 22px;
      border-top:1px solid #edf0f3;
      background:#fff;
      position:sticky;
      bottom:0;
    }

    .loading{
      position:fixed;
      right:20px;
      bottom:20px;
      background:var(--el-color-surface-soft,#f6f7f9);color:var(--el-color-text,#1f2020);
      padding:12px 16px;
      border-radius:12px;
      box-shadow:var(--shadow);
      display:none;
      z-index:60;
      font-size:14px;
      font-weight:600;
    }

    .loading.show{
      display:block;
    }

    .helper{
      font-size:12px;
      color:var(--muted);
      margin-top:-4px;
      margin-bottom:12px;
    }

@media (max-width:1px){
      .form-grid{
        grid-template-columns:repeat(2, minmax(0, 1fr));
      }

      .field.span-2,
      .field.span-4{
        grid-column:span 2;
      }

      .mini-grid{
        grid-template-columns:repeat(2, minmax(0, 1fr));
      }
    }

@media (max-width:1px){
      body{
        padding:14px;
      }

      .form-grid{
        grid-template-columns:1fr;
      }

      .field.span-2,
      .field.span-4{
        grid-column:span 1;
      }

      .mini-grid{
        grid-template-columns:1fr;
      }

      .board thead th:first-child,
      .col-evento{
        min-width:260px;
        max-width:260px;
      }
    }
.multi-select{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  padding:8px;
  border:1px solid #e3e7ec;
  border-radius:10px;
  background:#fff;

  max-height:120px;       /* 👈 LIMITA ALTURA */
  overflow-y:auto;        /* 👈 ATIVA SCROLL */
}

.multi-option{
  padding:6px 10px;
  border-radius:8px;
  background:#edf0f3;
  cursor:pointer;
  font-size:12px;
}

.multi-option.selected{
  background:var(--el-color-surface-soft,#f6f7f9);color:var(--el-color-text,#1f2020);
}
.modal-alerta{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.4);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:9999;
}

.modal-alerta.show{
  display:flex;
}

.modal-alerta-box{
  background:#fff;
  border-radius:16px;
  padding:24px;
  width:320px;
  text-align:center;
  box-shadow:0 20px 40px rgba(0,0,0,0.2);
  animation:fadeIn 0.2s ease;
}

.modal-alerta-titulo{
  font-weight:600;
  font-size:18px;
  margin-bottom:10px;
  color:#4f4f4f;
}

.modal-alerta-msg{
  font-size:14px;
  color:#4f4f4f;
  margin-bottom:20px;

}

.modal-alerta-acoes{
  display:flex;
  gap:10px;
  justify-content:center;
}

@keyframes fadeIn{
  from{ transform:scale(0.9); opacity:0; }
  to{ transform:scale(1); opacity:1; }
}
.pendencia-dot{
  position:absolute;
  right:10px;
  bottom:10px;
  width:10px;
  height:10px;
  border-radius:50%;
  background:#f59e0b;
  box-shadow:0 0 0 3px rgba(245,158,11,0.15);
}
.modal-large {
  width: 950px;
  max-width: 95vw;
  max-height: 85vh;
  overflow-y: auto;
}
.modal-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(31,32,32,0.55); /* fundo escuro premium */
  display: none;
  align-items: center;

/* 🔥 MODAL AGENDA - VISUAL PREMIUM */

#modalAgenda .modal{
  border-radius:20px;
  box-shadow:0 30px 80px rgba(31,32,32,0.25);
  border:1px solid #e3e7ec;
}

/* HEADER */
#modalAgenda .modal-header{
  border-bottom:1px solid #edf0f3;
  padding:20px;
}

#modalAgenda .modal-header h2{
  font-size:22px;
  font-weight:600;
  color:#2b2b2b;
  letter-spacing:-0.01em;
}

/* BODY */
#modalAgenda .modal-body{
  padding:20px;
  display:flex;
  flex-direction:column;
  gap:14px;
}

/* LABELS */
#modalAgenda .field label{
  font-size:11px;
  font-weight:600;
  color:#6b6b6b;
  text-transform:uppercase;
  letter-spacing:.06em;
}

/* INPUTS E SELECT */
#modalAgenda .field input,
#modalAgenda .field select{
  border-radius:14px;
  border:1px solid #e3e7ec;
  padding:14px;
  font-size:14px;
  background:#fafbfc;
  transition:all .2s ease;
}

/* HOVER */
#modalAgenda .field input:hover,
#modalAgenda .field select:hover{
  border-color:var(--el-color-border,#e3e7ec);
}

/* FOCUS (EFEITO BONITO) */
#modalAgenda .field input:focus,
#modalAgenda .field select:focus{
  background:#fff;
  border-color:var(--el-color-border,#e3e7ec);
  box-shadow:0 0 0 3px rgba(31,32,32,0.1);
}

/* BOTÕES */
#modalAgenda .modal-footer{
  border-top:1px solid #edf0f3;
  padding:16px 20px;
}

#modalAgenda .btn-light{
  background:#edf0f3;
  border:1px solid #e3e7ec;
  font-weight:600;
}

#modalAgenda .btn-accent{
  background:linear-gradient(135deg, #ff6a00, #ff8c42);
  border:none;
  font-weight:600;
  box-shadow:0 10px 20px rgba(255,106,0,0.25);
}

#modalAgenda .btn-accent:hover{
  transform:translateY(-1px);
}

/* INPUT MAIS IMPORTANTE (OBSERVAÇÃO) */
#modalAgenda #agendaDescricao{
  font-weight:600;
  color:#1f2020;
}

/* ESPAÇAMENTO MAIS CLEAN */
#modalAgenda .field{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.check-title{

/* =====================================================
   ALERTA DO MOTORISTA NO PEDIDO
===================================================== */

.alerta-motorista-card{
  position:relative;
  width:100%;
  border-radius:13px;
  padding:10px 10px 9px;
  cursor:pointer;
  text-align:left;
  overflow:visible;
  transition:.18s ease;
}

.alerta-motorista-card:hover{
  transform:translateY(-1px);
  z-index:30;
}

.alerta-motorista-card.pendente{
  background:#fff7c7;
  border:2px solid #f59e0b;
  box-shadow:0 0 0 3px rgba(245,158,11,.13);
  animation:piscarAlertaMotorista 1.15s ease-in-out infinite;
}

.alerta-motorista-card.resolvido{
  background:#dcfce7;
  border:2px solid #22c55e;
  box-shadow:0 0 0 3px rgba(34,197,94,.10);
}

.alerta-motorista-topo{
  display:flex;
  align-items:flex-start;
  gap:8px;
}

.alerta-motorista-icone{
  width:25px;
  min-width:25px;
  height:25px;
  border-radius:8px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:14px;
  font-weight:600;
}

.alerta-motorista-card.pendente .alerta-motorista-icone{
  background:#f59e0b;
  color:#fff;
}

.alerta-motorista-card.resolvido .alerta-motorista-icone{
  background:#16a34a;
  color:#fff;
}

.alerta-motorista-conteudo{
  min-width:0;
  flex:1;
}

.alerta-motorista-titulo{
  font-size:11px;
  line-height:1.25;
  font-weight:600;
  color:#92400e;
}

.alerta-motorista-card.resolvido .alerta-motorista-titulo{
  color:#166534;
}

.alerta-motorista-autor{
  margin-top:3px;
  font-size:10px;
  line-height:1.35;
  color:#78350f;
  font-weight:600;
}

.alerta-motorista-card.resolvido .alerta-motorista-autor{
  color:#166534;
}

.alerta-motorista-endereco{
  margin-top:7px;
  padding-top:7px;
  border-top:1px dashed rgba(146,64,14,.25);
  font-size:10px;
  line-height:1.42;
  color:#713f12;
  overflow-wrap:anywhere;
}

.alerta-motorista-card.resolvido .alerta-motorista-endereco{
  color:#166534;
  border-top-color:rgba(22,101,52,.22);
}

.alerta-motorista-tooltip{
  position:absolute;
  left:calc(100% + 10px);
  top:0;
  z-index:9999999;
  width:330px;
  max-width:min(330px, calc(100vw - 40px));
  padding:14px;
  border-radius:14px;
  background:#1f2020;
  color:#fff;
  box-shadow:0 20px 45px rgba(31,32,32,0.28);
  opacity:0;
  visibility:hidden;
  pointer-events:none;
  transform:translateX(-4px);
  transition:.16s ease;
}

.alerta-motorista-card:hover .alerta-motorista-tooltip,
.alerta-motorista-card:focus-within .alerta-motorista-tooltip{
  opacity:1;
  visibility:visible;
  transform:translateX(0);
}

.alerta-tooltip-titulo{
  font-size:13px;
  font-weight:600;
  margin-bottom:9px;
}

.alerta-tooltip-linha{
  margin-top:6px;
  font-size:11px;
  line-height:1.45;
  color:#e3e7ec;
}

.alerta-tooltip-linha strong{
  color:#fff;
}

@keyframes piscarAlertaMotorista{
  0%,100%{
    background:#fff7c7;
    border-color:#f59e0b;
    box-shadow:
      0 0 0 3px rgba(245,158,11,.12),
      0 0 0 rgba(245,158,11,0);
  }
  50%{
    background:#fde68a;
    border-color:#d97706;
    box-shadow:
      0 0 0 5px rgba(245,158,11,.24),
      0 0 22px rgba(245,158,11,.48);
  }
}

@media(prefers-reduced-motion:reduce){
  .alerta-motorista-card.pendente{
    animation:none;
  }
}

/* =====================================================
   CONCLUSÃO DO CARREGAMENTO
===================================================== */

.task-carregamento{
  position:relative;
}

/*
 * Apenas a borda pisca.
 * O fundo roxo original permanece igual.
 */
.task-carregamento.carregamento-com-pendencia{
  border:2px solid #dc2626 !important;

  animation:
    piscarBordaCarregamento
    1.1s
    ease-in-out
    infinite;
}

@keyframes piscarBordaCarregamento{

  0%,
  100%{
    border-color:#dc2626;

    box-shadow:
      0 0 0 0 rgba(220,38,38,0),
      0 4px 14px rgba(31,32,32,0.05);
  }

  50%{
    border-color:#ef4444;

    box-shadow:
      0 0 0 4px rgba(220,38,38,.13),
      0 4px 14px rgba(31,32,32,0.05);
  }
}


/* =====================================================
   INDICAÇÃO DENTRO DO CARD
===================================================== */

.carregamento-status-pendencia{
  margin-top:7px;

  display:flex;
  align-items:center;
  gap:5px;

  color:#b91c1c;

  font-size:11px;
  font-weight:600;
}


/* =====================================================
   TOOLTIP ESTILO COMENTÁRIO DO EXCEL
===================================================== */

.tooltip-carregamento{
  position:absolute;

  left:calc(100% + 12px);
  top:0;

  width:330px;

  display:none;

  padding:15px;

  background:#ffffff;
  color:#2b2b2b;

  border:1px solid #fecaca;
  border-radius:13px;

  box-shadow:
    0 20px 46px rgba(31,32,32,0.2);

  z-index:9999999;

  font-size:12px;
  line-height:1.55;

  text-align:left;

  pointer-events:none;
}

.task-carregamento.carregamento-com-pendencia:hover
.tooltip-carregamento{
  display:block;
}

.tooltip-carregamento::before{
  content:"";

  position:absolute;

  left:-7px;
  top:18px;

  width:12px;
  height:12px;

  background:#ffffff;

  border-left:1px solid #fecaca;
  border-bottom:1px solid #fecaca;

  transform:rotate(45deg);
}

.tooltip-carregamento-titulo{
  margin-bottom:11px;

  color:#b91c1c;

  font-size:13px;
  font-weight:600;
}

.tooltip-carregamento-linha{
  margin-top:7px;
}

.tooltip-carregamento-linha strong{
  display:block;

  margin-bottom:2px;

  color:#1f2020;

  font-weight:600;
}

.tooltip-carregamento-texto{
  white-space:pre-line;
  overflow-wrap:anywhere;
}


/* =====================================================
   MODAL FINALIZAR CARREGAMENTO
===================================================== */

#modalConclusaoCarregamento{
  z-index:10000000;
}

.modal-conclusao-carregamento{
  width:min(580px, 100%);
}

.carregamento-resumo{
  margin-bottom:18px;

  padding:14px;

  background:#fafbfc;

  border:1px solid #e3e7ec;
  border-radius:14px;

  font-size:13px;
  line-height:1.5;

  color:#4f4f4f;
}

.carregamento-resumo strong{
  color:#1f2020;
}

.carregamento-opcoes{
  display:grid;

  grid-template-columns:
    repeat(2, minmax(0, 1fr));

  gap:12px;
}

.carregamento-opcao{
  min-height:105px;

  display:flex;
  flex-direction:column;
  align-items:flex-start;
  justify-content:center;

  gap:7px;

  padding:15px;

  background:#ffffff;

  border:1px solid #e3e7ec;
  border-radius:15px;

  cursor:pointer;

  text-align:left;

  transition:.18s ease;
}

.carregamento-opcao:hover{
  border-color:#9e9e9e;
  transform:translateY(-1px);
}

.carregamento-opcao.ativa{
  background:var(--el-color-surface-soft,#f6f7f9);

  border-color:var(--el-color-border,#e3e7ec);

  box-shadow:
    0 0 0 3px rgba(31,32,32,0.08);

.carregamento-opcao-icon{
  font-size:20px;
}

.carregamento-opcao-titulo{
  color:#1f2020;

  font-size:14px;
  font-weight:600;
}

.carregamento-opcao-descricao{
  color:#6b6b6b;

  font-size:12px;
  line-height:1.4;
}

#camposPendenciaCarregamento{

  margin-top:18px;

  padding-top:18px;

  border-top:1px solid #edf0f3;
}

#camposPendenciaCarregamento.show{

}

#camposPendenciaCarregamento .field + .field{

}

#camposPendenciaCarregamento textarea{

.erro-carregamento{

.btn-salvar-carregamento{

.btn-salvar-carregamento:disabled{

@media(max-width:1px){

  }

  /*

   */

    display:none !important;
  }

/* =====================================================
   RESUMO DA MONTAGEM — LATERAL E COMPACTO
===================================================== */

/* Sem borda: o aviso "x de 5 registros enviados" já indica no card */
.task-montagem.montagem-com-registros{
  position:relative;

  overflow:visible !important;

  z-index:auto;
}

/* =====================================================
   INDICADOR NO CARD
===================================================== */

.montagem-status-registro{
  margin-top:8px;

  display:flex;
  align-items:center;
  gap:6px;

  color:var(--el-color-text,#1f2020);

  font-size:11px;
  font-weight:600;
}

.montagem-status-registro::before{
  content:"";

  width:7px;
  height:7px;

  border-radius:50%;

  background:var(--el-color-surface-soft,#f6f7f9);

  box-shadow:
    0 0 0 3px rgba(31,32,32,0.13);

  flex-shrink:0;
}

/* =====================================================
   PONTE INVISÍVEL ENTRE CARD E PAINEL
===================================================== */

.task-montagem.montagem-com-registros::after{
  content:"";

  position:absolute;

  left:100%;
  top:0;

  width:18px;
  height:100%;

  background:transparent;
}

/* =====================================================
   PAINEL LATERAL
===================================================== */

.tooltip-montagem{
  position:absolute;

  left:calc(100% + 14px);
  top:0;

  transform:none;

  width:570px;
  max-width:calc(100vw - 240px);

  max-height:500px;

  display:none;

  padding:18px 20px;

  background:#ffffff;
  color:#2b2b2b;

  border:1px solid var(--el-color-border,#e3e7ec);
  border-radius:16px;

  box-shadow:
    0 22px 55px rgba(31,32,32,0.22);

  z-index:9999999;

  font-size:12px;
  line-height:1.4;

  text-align:left;

  overflow-y:auto;
  overflow-x:hidden;

  pointer-events:auto;
}

/* MANTÉM ABERTO AO PASSAR DO CARD PARA O PAINEL */

.task-montagem.montagem-com-registros:hover
.tooltip-montagem,
.task-montagem.montagem-com-registros
.tooltip-montagem:hover{
  display:block;
}

/* SETA LATERAL */

.tooltip-montagem::before{
  content:"";

  position:absolute;

  left:-7px;
  top:20px;

  width:13px;
  height:13px;

  background:#ffffff;

  border-left:1px solid var(--el-color-border,#e3e7ec);
  border-bottom:1px solid var(--el-color-border,#e3e7ec);

  transform:rotate(45deg);
}

/* =====================================================
   CABEÇALHO
===================================================== */

.tooltip-montagem-cabecalho{
  padding-bottom:12px;
  margin-bottom:0;

  border-bottom:1px solid #e3e7ec;
}

.tooltip-montagem-titulo{
  color:var(--el-color-text,#1f2020);

  font-size:17px;
  line-height:1.15;

  font-weight:600;
  letter-spacing:-.015em;
}

.tooltip-montagem-contador{
  margin-top:4px;

  color:#4f4f4f;

  font-size:11px;
  font-weight:600;
}

/* =====================================================
   SEÇÕES
===================================================== */

.tooltip-montagem-secao{
  display:grid;

  grid-template-columns:
    minmax(0,1fr)
    205px;

  gap:16px;

  padding:13px 0;

  border-bottom:1px solid #e3e7ec;
}

.tooltip-montagem-secao:last-child{
  border-bottom:none;
  padding-bottom:0;
}

.tooltip-montagem-conteudo{
  min-width:0;
}

.tooltip-montagem-auditoria{
  min-width:0;

  padding-left:16px;

  border-left:1px solid #e3e7ec;

  display:flex;
  flex-direction:column;
  justify-content:center;

  gap:6px;
}

/* =====================================================
   TÍTULOS DAS SEÇÕES
===================================================== */

.tooltip-montagem-secao-titulo{
  margin-bottom:9px;

  padding-left:9px;

  border-left:3px solid var(--el-color-border,#e3e7ec);

  color:#4f4f4f;

  font-size:11px;
  line-height:1.3;

  font-weight:600;

  text-transform:uppercase;
  letter-spacing:.03em;
}

/* =====================================================
   CAMPOS
===================================================== */

.tooltip-montagem-campo{
  margin-top:5px;

  color:#4f4f4f;

  font-size:11px;
  line-height:1.4;
}

.tooltip-montagem-campo:first-of-type{
  margin-top:0;
}

.tooltip-montagem-campo strong{
  color:#2b2b2b;
  font-weight:600;
}

.tooltip-montagem-observacao{
  margin-top:8px;

  padding:8px 9px;

  background:#fafbfc;

  border:1px solid #e3e7ec;
  border-radius:8px;

  color:#4f4f4f;

  font-size:11px;
  line-height:1.4;

  overflow-wrap:anywhere;
  white-space:pre-line;
}

/* =====================================================
   AUDITORIA
===================================================== */

.tooltip-montagem-auditoria-linha{
  display:flex;
  align-items:flex-start;
  gap:5px;

  color:#2b2b2b;

  font-size:10px;
  line-height:1.35;
}

.tooltip-montagem-auditoria-label{
  color:#6b6b6b;
  font-weight:600;
}

.tooltip-montagem-auditoria-valor{
  color:#2b2a26;
  font-weight:600;
}

.tooltip-montagem-nao-informado{
  color:#9e9e9e;
  font-weight:600;
}

/* =====================================================
   LINKS DE FOTO
===================================================== */

.tooltip-montagem-fotos{
  display:flex;
  flex-direction:column;

  gap:5px;

  margin-top:8px;
}

.tooltip-montagem-link{
  width:100%;

  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;

  padding:7px 9px;

  background:#ffffff;

  border:1px solid var(--el-color-border,#e3e7ec);
  border-radius:8px;

  color:var(--el-color-text,#1f2020);

  font-size:10px;
  font-weight:600;

  text-decoration:none;

  cursor:pointer;

  transition:.15s ease;
}

.tooltip-montagem-link:hover{
  background:var(--el-color-surface-soft,#f6f7f9);
  border-color:var(--el-color-border,#e3e7ec);
}

.tooltip-montagem-link::after{
  content:"↗";

  font-size:13px;
  line-height:1;

  flex-shrink:0;
}

/* =====================================================
   SACOLAS
===================================================== */

.tooltip-montagem-sacolas-lista{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.tooltip-montagem-sacola{
  display:grid;

  grid-template-columns:
    minmax(0,1fr)
    96px;

  gap:8px;
  align-items:center;

  padding:8px 9px;

  background:#fafbfc;

  border:1px solid #e3e7ec;
  border-radius:9px;
}

.tooltip-montagem-sacola-codigo{
  color:#1f2020;

  font-size:11px;
  font-weight:600;
}

.tooltip-montagem-sacola
.tooltip-montagem-fotos{
  margin-top:0;
}

/* =====================================================
   LINK DO MAPA
===================================================== */

.tooltip-montagem-mapa{
  display:inline-flex;
  align-items:center;
  justify-content:center;

  margin-top:1px;

  padding:6px 8px;

  background:#fafbfc;

  border:1px solid var(--el-color-border,#e3e7ec);
  border-radius:8px;

  color:#2b2b2b;

  font-size:10px;
  font-weight:600;

  text-decoration:none;

  transition:.15s ease;
}

.tooltip-montagem-mapa:hover{
  background:var(--el-color-surface-soft,#f6f7f9);
  border-color:var(--el-color-border,#e3e7ec);
  color:var(--el-color-text,#1f2020);
}

/* =====================================================
   ESTADO VAZIO
===================================================== */

.tooltip-montagem-vazio{
  color:#9e9e9e;

  font-size:10px;
  font-style:italic;
}

/* =====================================================
   SCROLL VERTICAL
===================================================== */

.tooltip-montagem::-webkit-scrollbar{
  width:7px;
}

.tooltip-montagem::-webkit-scrollbar-track{
  background:transparent;
}

.tooltip-montagem::-webkit-scrollbar-thumb{
  background:var(--el-color-surface-soft,#f6f7f9);
  border-radius:999px;
}

.tooltip-montagem::-webkit-scrollbar-thumb:hover{
  background:#9e9e9e;
}

/* =====================================================
   MOBILE
===================================================== */

.montagem-status-mobile{
  margin-top:18px;

  display:inline-flex;
  align-items:center;

  padding:10px 14px;

  background:var(--el-color-surface-soft,#f6f7f9);

  border:2px solid var(--el-color-border,#e3e7ec);
  border-radius:999px;

  color:var(--el-color-text,#1f2020);

  font-size:16px;
  font-weight:600;
}

@media(max-width:1px){
  .tooltip-montagem{
    display:none !important;
  }
}

/* =====================================================
   INDICADORES OPERACIONAIS DO CRONOGRAMA
===================================================== */

.indicadores-cronograma{
  flex:1 1 auto;
  min-width:0;

  display:flex;
  align-items:center;
  justify-content:center;

  gap:10px;

  overflow-x:auto;
  overflow-y:hidden;

  padding:3px 5px;

  scrollbar-width:none;
}

.indicadores-cronograma::-webkit-scrollbar{
  display:none;
}


/* =====================================================
   CARD INDIVIDUAL
===================================================== */

.indicador-operacional{
  min-width:170px;
  height:76px;

  display:flex;
  align-items:center;

  gap:12px;

  padding:10px 13px;

  background:#ffffff;

  border:1px solid #e3e7ec;
  border-radius:15px;

  box-shadow:
    0 4px 12px rgba(31,32,32,0.04);

  cursor:pointer;

  text-align:left;

  flex:0 0 auto;

  transition:
    transform .16s ease,
    border-color .16s ease,
    box-shadow .16s ease;
}

.indicador-operacional:hover{
  transform:translateY(-1px);

  border-color:var(--el-color-border,#e3e7ec);

  box-shadow:
    0 8px 20px rgba(31,32,32,0.08);
}


/* =====================================================
   CÍRCULO
===================================================== */

.indicador-circulo{
  --indicador-cor:#6b6b6b;
  --indicador-progresso:0%;

  width:56px;
  min-width:56px;
  height:56px;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  position:relative;

  background:
    conic-gradient(
      var(--indicador-cor)
      var(--indicador-progresso),

      #e3e7ec
      var(--indicador-progresso)
    );
}

.indicador-circulo::after{
  content:"";

  position:absolute;
  inset:7px;

  border-radius:50%;

  background:#ffffff;
}

.indicador-circulo-centro{
  position:relative;
  z-index:1;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  line-height:1;
}

.indicador-circulo-centro strong{
  color:#1f2020;

  font-size:18px;
  font-weight:600;
}

.indicador-circulo-centro span{
  margin-top:4px;

  color:#9e9e9e;

  font-size:8px;
  font-weight:600;
}


/* =====================================================
   TEXTOS
===================================================== */

.indicador-conteudo{
  min-width:0;

  display:flex;
  flex-direction:column;

  gap:3px;
}

.indicador-titulo{
  color:#1f2020;

  font-size:12px;
  line-height:1.25;

  font-weight:600;

  white-space:normal;
}

.indicador-subtitulo{
  color:#6b6b6b;

  font-size:10px;
  line-height:1.25;

  font-weight:600;
}


/* =====================================================
   CORES POR SITUAÇÃO
===================================================== */

.indicador-circulo.status-normal{
  --indicador-cor:#6b6b6b;
}

.indicador-circulo.status-atencao{
  --indicador-cor:#f59e0b;
}

.indicador-circulo.status-critico{
  --indicador-cor:#dc2626;
}

.indicador-circulo.status-positivo{
  --indicador-cor:#16a34a;
}

   *

   * pode arrastar para os lados.
   */
  overflow-y:auto !important;
  overflow-x:auto !important;

  -webkit-overflow-scrolling:
    touch;

  scrollbar-width:
    none;

  border-radius:
    0 !important;

  border:
    1px solid #e3e7ec !important;

  background:#ffffff !important;

  box-shadow:none !important;

  scrollbar-gutter:
    stable;

}

/* ESCONDE VISUALMENTE AS BARRAS DO CHROME/SAFARI */

.board-wrap::-webkit-scrollbar{

  width:7px;
  height:0;

}


/* mantém somente a barrinha vertical */

.board-wrap::-webkit-scrollbar-thumb{

  background:#9e9e9e;

  border-radius:999px;

}
/* =====================================================
   TABELA SEM LARGURA MÍNIMA
===================================================== */

table.board{

  /*
   * Pedido = 190px
   * 7 dias = 210px cada
   *
   * 190 + (7 × 210) = 1660px
   */

  width:1660px !important;

  min-width:1660px !important;
  max-width:none !important;

  table-layout:fixed !important;

  border-collapse:
    separate !important;

  border-spacing:
    0 !important;

}


/* =====================================================
   CABEÇALHO DA TABELA
   FICA PRESO NO TOPO DA ÁREA ROLÁVEL
===================================================== */

.board thead{

  position:relative !important;

}


.board thead th{

  position:sticky !important;

  top:0 !important;

  z-index:50 !important;

  background:var(--el-color-surface-soft,#f6f7f9) !important;color:var(--el-color-text,#1f2020) !important;

  box-shadow:
    0 2px 5px
    rgba(31,32,32,0.16);

}


/* =====================================================
   COLUNA PEDIDO
===================================================== */

/* =====================================================
   LARGURAS REAIS DO CRONOGRAMA
   NÃO ESPREMER AS COLUNAS
===================================================== */

/* PEDIDO */

.board thead th:first-child,
.board tbody .col-evento{

  width:190px !important;
  min-width:190px !important;
  max-width:190px !important;

}

/* CADA DIA DA SEMANA */

.board thead th:not(:first-child),
.board tbody .day-cell{

  width:210px !important;
  min-width:210px !important;
  max-width:210px !important;

}


/* =====================================================
   PEDIDO CONTINUA PRESO À ESQUERDA
===================================================== */

.board thead th:first-child{

  position:sticky !important;

  top:0 !important;
  left:0 !important;

  z-index:80 !important;

  background:var(--el-color-surface-soft,#f6f7f9) !important;

}


.board tbody .col-evento{

  position:sticky !important;

  left:0 !important;

  z-index:40 !important;

  background:#ffffff !important;

  box-shadow:
    4px 0 8px
    rgba(31,32,32,0.08);

}


/* =====================================================
   CONTEÚDO NÃO PODE ALARGAR AS COLUNAS
===================================================== */

.board td,
.board th{

  min-width:0 !important;

}


.board .task-card,
.board .task-line,
.board .evento-box,
.board .evento-cliente,
.board .evento-meta{

  max-width:100% !important;

  overflow-wrap:anywhere !important;

  word-break:break-word !important;

}


/* =====================================================
   NENHUMA BARRA HORIZONTAL
===================================================== */

html,
body,
.app{

  overflow-x:hidden !important;

}


/*
 * A tabela é a única área
 * autorizada a movimentar lateralmente.
 */
.board-wrap{

  overflow-x:auto !important;

}


/* =====================================================
   MOBILE ANTIGO NUNCA APARECE
===================================================== */

.mobile-board,
#mobileBoard,
#modalVisualizacao{

  display:none !important;

}
/* =====================================================
   CELULAR / TABLET TOUCH
   PEDIDO FIXO + DIAS DESLIZANDO
===================================================== */

@media (hover:none) and (pointer:coarse){

  /*
   * A área da tabela pode deslizar horizontalmente,
   * mas a barra não fica visível.
   */
  .board-wrap{

    overflow-x:auto !important;
    overflow-y:auto !important;

    -webkit-overflow-scrolling:touch;

    scrollbar-width:none;

  }


  .board-wrap::-webkit-scrollbar{

    width:0;
    height:0;

    display:none;

  }


  /*
   * No celular NÃO espremer todas as colunas
   * dentro da tela.
   */
  table.board{

    width:auto !important;

    min-width:1500px !important;

    max-width:none !important;

    table-layout:fixed !important;

  }


  /*
   * PEDIDO
   */
  .board thead th:first-child,
  .board tbody .col-evento{

    width:270px !important;

    min-width:270px !important;

    max-width:270px !important;

  }


  /*
   * CADA DIA
   */
  .board thead th:not(:first-child),
  .board tbody .day-cell{

    width:175px !important;

    min-width:175px !important;

    max-width:175px !important;

  }


  /*
   * CABEÇALHO PEDIDO:
   * preso em cima + esquerda
   */
  .board thead th:first-child{

    position:sticky !important;

    top:0 !important;
    left:0 !important;

    z-index:100 !important;

    background:var(--el-color-surface-soft,#f6f7f9) !important;

  }


  /*
   * PEDIDOS:
   * permanecem visíveis
   * enquanto os dias deslizam.
   */
  .board tbody .col-evento{

    position:sticky !important;

    left:0 !important;

    z-index:60 !important;

    background:#ffffff !important;

    box-shadow:
      5px 0 10px
      rgba(31,32,32,0.1);

  }


  /*
   * Evita palavras quebradas
   * letra por letra.
   */
  .board .task-title,
  .board .task-line,
  .board .evento-cliente,
  .board .evento-meta,
  .board .pedido-tag{

    word-break:normal !important;
    overflow-wrap:break-word !important;

  }

}
/* =====================================================
   NÃO QUEBRAR PALAVRAS DOS CARDS
===================================================== */

/* TÍTULOS */

.board .task-title{

  word-break:normal !important;
  overflow-wrap:normal !important;

  white-space:nowrap !important;

}


/* HORÁRIO */

.board .task-time{

  white-space:nowrap !important;

}


/* PEDIDO */

.board .pedido-tag{

  word-break:normal !important;
  overflow-wrap:normal !important;

  white-space:nowrap !important;

}


/* CLIENTE */

.board .evento-cliente{

  word-break:normal !important;
  overflow-wrap:normal !important;

  white-space:normal !important;

}


/* LINHAS DOS CARDS */

.board .task-line,
.board .evento-meta{

  word-break:normal !important;

  overflow-wrap:normal !important;

  white-space:normal !important;

}


/* CARD USA TODA A LARGURA DA COLUNA */

.board .task-card{

  width:100% !important;

  min-width:0 !important;
  max-width:100% !important;

}
/* =====================================================
   NOTEBOOK / DESKTOP
   TODA A SEMANA DEVE CABER NA TELA

   NÃO AFETA CELULAR / TABLET TOUCH
===================================================== */

@media (hover:hover) and (pointer:fine){

  /*
   * No notebook a tabela ocupa exatamente
   * a largura disponível.
   *
   * Nada fica escondido à direita.
   */
  .board-wrap{

    width:100% !important;

    overflow-x:hidden !important;
    overflow-y:auto !important;

  }


  table.board{

    width:100% !important;

    min-width:0 !important;
    max-width:100% !important;

    table-layout:fixed !important;

  }


  /*
   * PEDIDO
   * Mantemos estreita.
   */
  .board thead th:first-child,
  .board tbody .col-evento{

    width:180px !important;
    min-width:180px !important;
    max-width:180px !important;

  }


  /*
   * OS 7 DIAS DIVIDEM TODO O ESPAÇO RESTANTE.
   *
   * Assim TER até SEG aparecem sempre.
   */
  .board thead th:not(:first-child),
  .board tbody .day-cell{

    width:
      calc(
        (100% - 180px) / 7
      ) !important;

    min-width:0 !important;
    max-width:none !important;

  }


  /*
   * Cards acompanham a coluna,
   * mas sem quebrar palavras letra por letra.
   */
  .board .task-card{

    width:100% !important;
    max-width:100% !important;

  }


  .board .task-title{

    white-space:normal !important;

    word-break:normal !important;
    overflow-wrap:normal !important;

  }


  .board .task-line{

    word-break:normal !important;
    overflow-wrap:normal !important;

  }

}
/* =====================================================
   CONFIRMAÇÃO DE DATA — MONTAGEM / DESMONTAGEM
===================================================== */

/* Etapa ainda não confirmada pelo decorador: só um aviso pequeno dentro do card */
.aviso-decorador{
  display:inline-flex;
  align-items:center;
  gap:5px;
  margin-top:6px;
  padding:3px 8px;
  border-radius:999px;
  background:#fff7c7;
  color:#92400e;
  font-size:10.5px;
  font-weight:600;
  line-height:1.3;
}

.aviso-decorador::before{
  content:"";
  width:6px;
  height:6px;
  border-radius:50%;
  background:#f59e0b;
  flex:none;
}


/* Caixa no cadastro da etapa */
.confirmacao-decorador-box{
  display:none;
  grid-column:1 / -1;

  padding:12px 14px;

  border:1px solid #fde68a;
  border-radius:12px;

  background:#fffbeb;
}

.confirmacao-decorador-box.show{
  display:block;
}

.confirmacao-decorador-label{
  display:flex;
  align-items:flex-start;
  gap:10px;

  cursor:pointer;
  user-select:none;
}

.confirmacao-decorador-checkbox{
  width:18px !important;
  min-width:18px;
  height:18px;

  margin:1px 0 0;
  padding:0 !important;

  accent-color:#16a34a;
  cursor:pointer;
}

.confirmacao-decorador-conteudo{
  display:flex;
  flex-direction:column;
  gap:3px;
}

.confirmacao-decorador-titulo{
  font-size:13px;
  font-weight:600;
  color:#1f2020;
}

.confirmacao-decorador-descricao{
  font-size:11px;
  line-height:1.4;
  font-weight:500;
  color:#6b6b6b;
}
/* =====================================================
   AJUSTE FINAL DE ROLAGEM DO CRONOGRAMA

   - A página inteira rola normalmente
   - Topo principal sobe e desaparece
   - Controles da semana sobem e desaparecem
   - Cabeçalho PEDIDO | TER | QUA... fica preso no topo
===================================================== */


/* =====================================================
   1. PÁGINA INTEIRA ROLA
===================================================== */

html{
  width:100% !important;

  height:auto !important;
  min-height:100% !important;

  overflow-y:auto !important;
  overflow-x:auto !important;
}


body{
  width:100% !important;

  height:auto !important;
  min-height:100vh !important;

  /*
   * IMPORTANTE:
   * body não pode virar outro container de scroll.
   * Quem controla a rolagem é a página.
   */
  overflow:visible !important;
}


/* =====================================================
   2. CONTAINER PRINCIPAL NÃO FICA MAIS PRESO
===================================================== */

.app{
  width:100% !important;

  height:auto !important;
  min-height:100vh !important;

  max-height:none !important;

  overflow:visible !important;

  display:block !important;
}


/* =====================================================
   3. TOPO PRINCIPAL SOBE NORMALMENTE

   Cronograma
   Indicadores
   + Agenda
   + Pedido
===================================================== */

.topbar{
  position:relative !important;

  top:auto !important;
  left:auto !important;
  right:auto !important;

  z-index:auto !important;
}


/* =====================================================
   4. CONTROLES DA SEMANA SOBEM NORMALMENTE

   ← Semana →
   Alertas
   Filtro
===================================================== */

.linha-controles-cronograma{
  position:relative !important;

  top:auto !important;
  left:auto !important;
  right:auto !important;

  z-index:auto !important;
}


/* =====================================================
   5. TABELA NÃO POSSUI MAIS SCROLL VERTICAL PRÓPRIO

   Isso é essencial para o sticky funcionar
   em relação ao topo da tela.
===================================================== */

.board-wrap{
  position:relative !important;

  width:100% !important;

  height:auto !important;
  min-height:0 !important;
  max-height:none !important;

  overflow:visible !important;

  /*
   * Remove qualquer configuração antiga
   * que transformava esta área em scroll.
   */
  flex:none !important;

  scrollbar-gutter:auto !important;
}


/* =====================================================
   6. TABELA
===================================================== */

table.board{
  /*
   * Necessário para sticky funcionar corretamente
   * dentro da tabela.
   */
  border-collapse:separate !important;
  border-spacing:0 !important;
}


/* =====================================================
   7. CABEÇALHO INTEIRO DO CRONOGRAMA

   PEDIDO | TER | QUA | QUI | SEX...

   Ele sobe com a página.
   Quando encostar no topo, fica preso.
===================================================== */

.board thead{
  position:sticky !important;

  top:0 !important;

  z-index:1000 !important;
}


/* =====================================================
   8. CÉLULAS DO CABEÇALHO
===================================================== */

.board thead th{
  position:sticky !important;

  top:0 !important;

  z-index:1000 !important;

  background:var(--el-color-surface-soft,#f6f7f9) !important;color:var(--el-color-text,#1f2020) !important;

  /*
   * Evita qualquer transparência enquanto
   * os pedidos passam por baixo.
   */
  background-clip:padding-box !important;

  box-shadow:
    0 3px 8px
    rgba(31,32,32,0.2) !important;
}


/* =====================================================
   9. CANTO SUPERIOR ESQUERDO

   PEDIDO fica preso:
   - no topo
   - na esquerda
===================================================== */

.board thead th:first-child{
  position:sticky !important;

  top:0 !important;
  left:0 !important;

  z-index:1200 !important;

  background:var(--el-color-surface-soft,#f6f7f9) !important;color:var(--el-color-text,#1f2020) !important;
}


/* =====================================================
   10. PRIMEIRA COLUNA DOS PEDIDOS

   Continua presa na esquerda
===================================================== */

.board tbody .col-evento{
  position:sticky !important;

  left:0 !important;

  z-index:100 !important;

  background:#ffffff !important;
}
/* =====================================================
   CORREÇÃO DAS CAMADAS DO CRONOGRAMA E DOS MODAIS

   Ordem:
   1. Cronograma
   2. Cabeçalho e coluna PEDIDO
   3. Timer
   4. Modais
   5. Alertas e carregamento
===================================================== */


/* Cabeçalho fixo, mas abaixo dos modais */

.board thead,
.board thead th{
  z-index:30 !important;
}


/* Canto superior esquerdo: PEDIDO */

.board thead th:first-child{
  z-index:40 !important;
}


/* Primeira coluna dos pedidos */

.board tbody .col-evento{
  z-index:20 !important;
}


/* Timer aparece sobre o cronograma,
   mas fica atrás dos modais */

.timer-edicao-cronograma{
  z-index:9000 !important;
}


/* Todos os modais principais ficam acima
   do cabeçalho, da coluna PEDIDO e dos tooltips */

.overlay,
.modal-overlay,
.modal-visualizacao,
#modalAlertas{
  z-index:20000000 !important;
}


/* Alertas de confirmação podem abrir
   por cima de outro modal */

.modal-alerta{
  z-index:20000010 !important;
}


/* Mensagem de carregamento fica acima de tudo */

.loading{
  z-index:20000020 !important;
}
/* =====================================================
   IMPRESSÃO DO CRONOGRAMA

   - A4 horizontal
   - Somente a tabela
   - Mantém as cores dos cards
   - Remove todas as bordas coloridas
===================================================== */

@page{
  size:A4 landscape;
  margin:7mm;
}

  .board .pedido-tag{

    padding:3px 5px !important;

    border:none !important;

    font-size:7pt !important;
    line-height:1.15 !important;

    white-space:normal !important;
  }


  .board .evento-cliente{
    margin-top:4px !important;

    font-size:8pt !important;
    line-height:1.15 !important;

    white-space:normal !important;

    word-break:normal !important;
    overflow-wrap:anywhere !important;
  }


  .board .evento-meta{
    margin-top:4px !important;
    gap:2px !important;

    font-size:6.7pt !important;
    line-height:1.2 !important;

    white-space:normal !important;

    word-break:normal !important;
    overflow-wrap:anywhere !important;
  }


  /* =====================================================
     13. CORES DOS CARDS
  ===================================================== */

  .board .task-separacao{
    background:var(--etapa-separacao) !important;
  }


  .board .task-carregamento{
    background:var(--etapa-carregamento) !important;
  }


  .board .task-montagem{
    background:var(--etapa-montagem) !important;
  }


  .board .task-evento{
    background:var(--etapa-evento) !important;
  }


  .board .task-desmontagem{
    background:var(--etapa-desmontagem) !important;
  }

}
  
/* =========================================================
   IDENTIDADE PORTAL INTERNO
   Mesma linguagem da Central de Metas / Itens Danificados:
   Cormorant Garamond nos títulos, Manrope no texto,
   grafite var(--el-button-primary-bg,#7d603d), fundo creme, cartões brancos com sombra suave.
   Fica no fim do CSS de propósito: sobrepõe os ajustes anteriores.
========================================================= */

:root{
  --primary:var(--el-button-primary-bg,#7d603d);
  --primary-dark:var(--el-button-primary-hover,#654d31);
  --primary-soft:#e9ecef;
  --accent:#6b6b6b;
  --bg:#f7f9fb;
  --card:#ffffff;
  --border:#e3e7ec;
  --line:#e3e7ec;
  --borda-card:#e3e7ec;
  --linha-tabela:#edf0f3;
  --fundo-suave:#f7f9fb;
  --text:#1f2020;
  --muted:#6b6b6b;
  --serif:"Cormorant Garamond", Georgia, serif;
  --sans:"Manrope", system-ui, sans-serif;
  --shadow:0 1px 2px rgba(31,32,32,0.04), 0 10px 30px rgba(31,32,32,0.07);
  --sombra-card:0 1px 2px rgba(31,32,32,0.04), 0 10px 30px rgba(31,32,32,0.07);
  --etapa-separacao:#eef0f3;
  --cronograma-preto:var(--el-button-primary-bg,#7d603d);
  --cronograma-preto-hover:var(--el-button-primary-hover,#654d31);
  --cronograma-preto-suave:#636363;
}

html,
body{
  background:#ffffff !important;
  color:var(--text);
  font-family:var(--sans) !important;
  -webkit-font-smoothing:antialiased;
}

button,
input,
select,
textarea{ font-family:inherit; }

/* ---------- Cabeçalho ---------- */

.topbar{
  background:transparent !important;
  box-shadow:none !important;
  border-bottom:1px solid var(--line) !important;
  padding-bottom:18px !important;
  margin-bottom:18px !important;
  grid-template-columns:auto minmax(0,1fr) auto !important;
  column-gap:20px !important;
}

.title-wrap{
  width:auto !important;
  min-width:0 !important;
  max-width:none !important;
}

.title-wrap h1{
  font-family:var(--serif) !important;
  font-size:32px !important;
  font-weight:500 !important;
  letter-spacing:.1em !important;
  white-space:nowrap;
  line-height:1 !important;
  text-transform:uppercase;
  color:var(--text) !important;
}

.ultima-atualizacao{
  color:var(--muted) !important;
  font-size:12px !important;
  font-weight:500 !important;
  letter-spacing:.02em;
}

/* ---------- Indicadores ---------- */

.indicador-operacional{
  background:var(--card) !important;
  border:1px solid var(--borda-card) !important;
  border-radius:18px !important;
  box-shadow:var(--sombra-card) !important;
}

.indicador-operacional:hover{
  border-color:var(--el-color-border,#e3e7ec) !important;
}

.indicador-circulo{ --indicador-cor:#6b6b6b; }
.indicador-circulo.status-normal{ --indicador-cor:#6b6b6b; }

.indicador-circulo{
  background:conic-gradient(var(--indicador-cor) var(--indicador-progresso), #e9ecef var(--indicador-progresso)) !important;
}

.indicador-titulo{
  color:var(--text) !important;
  font-weight:600 !important;
}

.indicador-subtitulo{
  color:var(--muted) !important;
  text-transform:uppercase;
  letter-spacing:.08em;
  font-size:9px !important;
  font-weight:600 !important;
}

.indicador-circulo-centro strong{
  color:var(--text) !important;
  font-variant-numeric:tabular-nums;
}

.indicador-circulo-centro span{ color:var(--muted) !important; }

/* ---------- Botões em pílula ---------- */

.btn{
  border-radius:999px !important;
  font-family:var(--sans) !important;
  font-size:13px !important;
  font-weight:600 !important;
  letter-spacing:.06em !important;
  text-transform:uppercase;
  box-shadow:none !important;
  transition:background-color .2s, border-color .2s, color .2s, opacity .2s !important;
}

.btn:hover{ transform:none !important; }

.btn-primary,
.btn-accent,
.btn-hoje,
.btn-novo,
.top-actions .btn,
.top-actions .btn-light,
.top-actions .btn-primary,
.top-actions .btn-accent{
  background:var(--primary) !important;
  border:1px solid var(--primary) !important;
  color:#ffffff !important;
  box-shadow:none !important;
}

.btn-primary:hover,
.btn-accent:hover,
.btn-hoje:hover,
.btn-novo:hover,
.top-actions .btn:hover,
.top-actions .btn-light:hover,
.top-actions .btn-primary:hover,
.top-actions .btn-accent:hover{
  background:var(--primary-dark) !important;
  border-color:var(--primary-dark) !important;
}

.btn-light,
.week-nav .btn{
  background:#ffffff !important;
  border:1px solid var(--line) !important;
  color:var(--text) !important;
  box-shadow:none !important;
}

.btn-light:hover,
.week-nav .btn:hover{
  background:#ffffff !important;
  border-color:var(--primary) !important;
  color:var(--primary-dark) !important;
}

.btn-danger{
  background:#ffffff !important;
  border:1px solid #fecaca !important;
  color:#b91c1c !important;
}

.btn-danger:hover{
  background:#fee2e2 !important;
  border-color:#fca5a5 !important;
}

/* ---------- Semana, alertas e filtro ---------- */

.week-badge{
  background:var(--fundo-suave) !important;
  border:1px solid var(--line) !important;
  border-radius:999px !important;
  color:var(--text) !important;
  font-size:13px !important;
  font-weight:600 !important;
  letter-spacing:.04em;
}

#painelAlertas{
  background:#ffffff !important;
  border:1px solid var(--line) !important;
  border-radius:999px !important;
  color:var(--text) !important;
  font-size:13px !important;
  font-weight:600 !important;
  box-shadow:none !important;
}

.filter,
.toolbar-right select,
.linha-controles-cronograma .toolbar-right #filtroEtapa{
  appearance:none !important;
  -webkit-appearance:none !important;
  height:42px !important;
  min-height:40px;
  padding:0 38px 0 16px !important;
  border:1px solid var(--line) !important;
  border-radius:999px !important;
  background:var(--fundo-suave) url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2712%27 height=%2712%27 viewBox=%270 0 12 12%27%3E%3Cpath d=%27M2.5 4.5 6 8l3.5-3.5%27 fill=%27none%27 stroke=%27%2377716a%27 stroke-width=%271.6%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27/%3E%3C/svg%3E") no-repeat right 14px center !important;
  color:var(--text) !important;
  font-size:13px !important;
  font-weight:600 !important;
  cursor:pointer;
}

.filter:focus,
.linha-controles-cronograma .toolbar-right #filtroEtapa:focus,
.toolbar-right .filter:focus,
.toolbar-right select:focus{
  background-color:#ffffff !important;
  border-color:var(--el-color-border,#e3e7ec) !important;
  box-shadow:none !important;
}

/* ---------- Quadro da semana ---------- */

.board-wrap{
  background:var(--card) !important;
  border:1px solid var(--borda-card) !important;
  border-radius:18px !important;
  box-shadow:var(--sombra-card) !important;
}

.board thead th{
  background:var(--el-color-surface-soft,#f6f7f9) !important;color:var(--el-color-text,#1f2020) !important;
  padding:16px 12px !important;
  font-family:var(--sans) !important;
  font-size:12px !important;
  font-weight:600 !important;
  letter-spacing:.12em !important;
  text-transform:uppercase;
  border-right:1px solid rgba(255,255,255,.10) !important;
}

.board thead th:first-child{ border-top-left-radius:18px; }
.board thead th:last-child{ border-top-right-radius:18px; border-right:0 !important; }

.board tbody td{
  border-right:1px solid var(--linha-tabela) !important;
  border-bottom:1px solid var(--linha-tabela) !important;
}

.board tbody tr:last-child td:first-child{ border-bottom-left-radius:18px; }
.board tbody tr:last-child td:last-child{ border-bottom-right-radius:18px; }

.board tbody tr:hover td{ background:#fafbfc; }

.col-evento{ background:#ffffff; }

.pedido-tag{
  background:var(--el-color-surface-soft,#f6f7f9) !important;
  border:1px solid var(--line) !important;
  color:var(--el-color-text,#1f2020) !important;
  font-size:11px !important;
  font-weight:700 !important;
  letter-spacing:.08em;
  text-transform:uppercase;
}

.evento-cliente{
  font-family:var(--serif);
  font-size:21px !important;
  font-weight:600 !important;
  line-height:1.1 !important;
  color:var(--text) !important;
}

.evento-meta{ color:var(--muted) !important; }

.empty-state{
  font-family:var(--serif);
  font-style:italic;
  font-size:20px !important;
  color:var(--muted) !important;
}

/* ---------- Cartões das etapas ---------- */

.task-card{
  border-radius:14px;
  box-shadow:0 1px 2px rgba(31,32,32,0.04), 0 4px 14px rgba(31,32,32,0.05);
}

.task-title{
  color:var(--text);
  letter-spacing:.08em;
}

.task-time{ color:var(--el-color-text,#1f2020); font-variant-numeric:tabular-nums; }
.task-line{ color:var(--el-color-text,#1f2020); }
.task-line strong{ color:var(--text); }

/* ---------- Modais ---------- */

.overlay,
.modal-overlay{ background:rgba(31,32,32,0.45); }

.modal{
  border:1px solid var(--borda-card) !important;
  border-radius:22px !important;
  box-shadow:0 30px 80px rgba(31,32,32,0.22) !important;
}

.modal-header{
  background:var(--el-color-surface-soft,#f6f7f9) !important;color:var(--el-color-text,#1f2020);
  border-bottom:0 !important;
  padding:18px 24px !important;
}

.modal-header h2{
  font-family:var(--serif) !important;
  font-size:24px !important;
  font-weight:500 !important;
  letter-spacing:.12em !important;
  text-transform:uppercase;
  color:#ffffff !important;
}

.modal-close{
  background:rgba(255,255,255,.14) !important;
  color:#ffffff !important;
  border-radius:50% !important;
}

.modal-close:hover{ background:rgba(255,255,255,.24) !important; }

.modal-footer{ border-top:1px solid var(--linha-tabela) !important; }

[class*="modal"] h2,
[class*="modal"] h3{ font-family:var(--serif); }

.section-title{
  font-family:var(--serif) !important;
  font-size:22px !important;
  font-weight:600 !important;
  letter-spacing:.01em !important;
  color:var(--text) !important;
}

.field label{
  color:var(--muted) !important;
  font-size:11px !important;
  font-weight:600 !important;
  letter-spacing:.08em !important;
}

.field input,
.field select,
.field textarea{
  border:1px solid var(--line) !important;
  background:#ffffff !important;
  color:var(--text) !important;
}

.field input:focus,
.field select:focus,
.field textarea:focus{
  background:#ffffff !important;
  border-color:var(--el-color-border,#e3e7ec) !important;
  box-shadow:0 0 0 3px rgba(31,32,32,0.1) !important;
}

.etapas-box{
  background:var(--fundo-suave) !important;
  border:1px solid var(--borda-card) !important;
}

.etapa-badge{
  background:var(--el-color-surface-soft,#f6f7f9) !important;
  border-color:var(--line) !important;
  color:var(--el-color-text,#1f2020) !important;
  letter-spacing:.06em;
  text-transform:uppercase;
}

.helper{ color:var(--muted) !important; }

/* ---------- Avisos ---------- */

.loading{
  background:var(--el-color-surface-soft,#f6f7f9) !important;
  border-radius:999px !important;
  box-shadow:var(--sombra-card) !important;
  font-size:12px !important;
  font-weight:600 !important;
  letter-spacing:.08em;
  text-transform:uppercase;
}

.timer-edicao-cronograma{ font-family:var(--sans); }

.indicadores-cronograma{ background:transparent !important; box-shadow:none !important; }

/* ---------- Título centralizado (sem indicadores no topo) ---------- */

.topbar{
  display:grid !important;
  grid-template-columns:minmax(0,1fr) auto minmax(0,1fr) !important;
  align-items:center !important;
  padding-top:14px !important;
}

.title-wrap{
  grid-column:2 !important;
  align-items:center !important;
  text-align:center;
}

.title-wrap h1{
  font-size:clamp(26px, 2.8vw, 38px) !important;
  letter-spacing:.16em !important;
  margin-right:-.16em !important;
}

/* Última atualização: pequena e discreta no canto superior direito */
.title-wrap .link-app-montador{
  position:absolute !important;
  top:0 !important;
  right:230px !important;
  left:auto !important;
  font-size:11px !important;
  font-weight:600 !important;
  color:var(--muted) !important;
  text-decoration:none !important;
  opacity:.8;
  white-space:nowrap;
}

.title-wrap .link-app-montador:hover{
  opacity:1;
  text-decoration:underline !important;
}

@media print{
  .link-app-montador{ display:none !important; }
}

.title-wrap .ultima-atualizacao{
  position:absolute !important;
  top:0 !important;
  right:0 !important;
  display:flex !important;
  align-items:center !important;
  gap:6px !important;
  margin:0 !important;
  font-size:11px !important;
  color:var(--muted) !important;
  opacity:.8;
  white-space:nowrap;
}

.title-wrap .ultima-atualizacao::before{
  content:"";
  width:6px;
  height:6px;
  border-radius:50%;
  background:#16a34a;
}

/* Ações na mesma linha do filtro "Somente cronograma" */
.linha-controles-cronograma{
  display:flex !important;
  align-items:center !important;
  justify-content:space-between !important;
  gap:16px !important;
}

.linha-controles-cronograma .toolbar-right{
  width:auto !important;
  min-width:0 !important;
  justify-content:flex-end !important;
}

.toolbar-right{
  display:flex !important;
  align-items:center !important;
  flex-wrap:nowrap !important;
  gap:8px !important;
}

.toolbar-right .top-actions,
.toolbar-right .top-actions-botoes{
  display:flex !important;
  align-items:center !important;
  gap:8px !important;
  margin:0 !important;
}

.toolbar-right .top-actions .btn{
  height:42px !important;
  min-height:42px !important;
  padding:0 16px !important;
}

/* ---------- Barra de controles (semana + ações) ---------- */

.linha-controles-cronograma{
  padding:6px !important;
  margin:4px 0 22px !important;
  background:var(--card) !important;
  border:1px solid var(--borda-card) !important;
  border-radius:999px !important;
  box-shadow:var(--sombra-card) !important;
}

.semana-nav{
  display:flex;
  align-items:center;
  gap:2px;
}

.semana-seta{
  width:40px;
  height:40px;
  flex:0 0 40px;
  display:grid;
  place-items:center;
  padding:0;
  border:0;
  border-radius:50%;
  background:transparent;
  color:var(--el-color-text,#1f2020);
  cursor:pointer;
  transition:background-color .2s, color .2s;
}

.semana-seta svg{ width:18px; height:18px; }

.semana-seta:hover{
  background:var(--fundo-suave);
  color:var(--text);
}

.semana-nav .week-badge{
  min-width:0 !important;
  height:auto !important;
  padding:0 10px !important;
  background:transparent !important;
  border:0 !important;
  box-shadow:none !important;
  color:var(--text) !important;
  font-size:14px !important;
  font-weight:600 !important;
  letter-spacing:.02em !important;
  font-variant-numeric:tabular-nums;
  white-space:nowrap;
}

.acoes-cronograma{
  display:flex;
  align-items:center;
  gap:6px;
}

.acao{
  height:40px;
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:0 18px;
  border:1px solid var(--line);
  border-radius:999px;
  background:#ffffff;
  color:var(--text);
  font-family:var(--sans);
  font-size:12px;
  font-weight:600;
  letter-spacing:.08em;
  text-transform:uppercase;
  white-space:nowrap;
  cursor:pointer;
  transition:background-color .2s, border-color .2s, color .2s;
}

.acao svg{
  width:16px;
  height:16px;
  flex:0 0 16px;
  color:var(--muted);
  transition:color .2s;
}

.acao:hover{
  background:var(--fundo-suave);
  border-color:var(--el-color-border,#e3e7ec);
}

.acao:hover svg{ color:var(--text); }

.acao-icone{
  width:40px;
  padding:0;
  justify-content:center;
}

.acao-principal{
  background:var(--el-color-surface-soft,#f6f7f9);
  border-color:var(--el-color-border,#e3e7ec);color:var(--el-color-text,#1f2020);
}

.acao-principal svg{ color:#ffffff; }

.acao-principal:hover{
  background:var(--el-color-surface-soft,#f6f7f9);
  border-color:var(--el-color-border,#e3e7ec);
}

.acao-principal:hover svg{ color:#ffffff; }

/* ---------- Semana, título e ações na mesma linha (sem card) ---------- */

.topbar{
  position:relative !important;
  grid-template-columns:minmax(0,1fr) auto minmax(0,1fr) !important;
  column-gap:24px !important;
  row-gap:14px !important;
  margin-bottom:22px !important;
}

.topbar .semana-nav{
  grid-column:1 !important;
  grid-row:1 !important;
  justify-self:start;
  margin-left:-8px;
}

.topbar .title-wrap{
  grid-row:1 !important;
}

.topbar .toolbar-right{
  grid-column:3 !important;
  grid-row:1 !important;
  justify-self:end;
}

/* Telas menores: título em cima, semana e botões na linha de baixo */
@media (max-width:1760px){
  .topbar{
    grid-template-columns:minmax(0,1fr) auto !important;
  }

  .topbar .title-wrap{
    grid-column:1 / -1 !important;
    grid-row:1 !important;
  }

  .topbar .semana-nav{
    grid-column:1 !important;
    grid-row:2 !important;
  }

  .topbar .toolbar-right{
    grid-column:2 !important;
    grid-row:2 !important;
  }
}

@media print{
  .linha-controles-cronograma{ display:none !important; }
}

/* Vence as regras antigas de .toolbar-right button (borda/cor com !important) */
.toolbar-right .acao{
  height:40px !important;
  border:1px solid var(--line) !important;
  border-radius:999px !important;
  background:#ffffff !important;
  color:var(--text) !important;
  font-size:12px !important;
  font-weight:600 !important;
  padding:0 18px !important;
  box-shadow:none !important;
  backdrop-filter:none !important;
}
.toolbar-right .acao:hover{ background:var(--fundo-suave) !important; border-color:var(--el-color-border,#e3e7ec) !important; }
.toolbar-right .acao-icone{ width:40px !important; padding:0 !important; }
.toolbar-right .acao-principal{ background:var(--el-color-surface-soft,#f6f7f9) !important; border-color:var(--el-color-border,#e3e7ec) !important;color:var(--el-color-text,#1f2020) !important; }
.toolbar-right .acao-principal:hover{ background:var(--el-color-surface-soft,#f6f7f9) !important; border-color:var(--el-color-border,#e3e7ec) !important; }

  
/* =========================================================
   CRONOGRAMA — VERSÃO APP (CELULAR)
   Só aparece em telas de até 760px. Visual monocromático:
   lista simples, sem cores por etapa; cor só em alertas.
   Desenhada por renderCronogramaApp() com os dados do quadro.
========================================================= */

.app-cron{ display:none; }

@media (max-width:760px){

  html,
  body{
    padding:0 !important;
    margin:0 !important;
    background:#ffffff !important;
    overflow-x:hidden;
  }

  .app{ display:none !important; }

  .app-cron{
    display:block;
    min-height:100vh;
    padding-bottom:calc(40px + env(safe-area-inset-bottom));
    background:#ffffff;
    color:var(--text);
    font-family:var(--sans);
    -webkit-tap-highlight-color:transparent;
  }

  .app-cron button{
    font-family:inherit;
    color:inherit;
    -webkit-tap-highlight-color:transparent;
  }

  .app-cron svg{ display:block; }

  /* ---------- Topo ---------- */

  .app-topo{
    position:sticky;
    top:0;
    z-index:30;
    padding:calc(16px + env(safe-area-inset-top)) 20px 0;

<script>
/* Tela "Equipe Free" (RH, out/2026): o painel que ficava no botão FREE do Cronograma.
   As funções abaixo são as mesmas do Cronograma; o acesso vem do login do Acervo
   (Supervisor de Montagem ou quem edita Recursos Humanos). */
let semanaInicioAtual = getInicioSemanaOperacional(new Date());
let cronogramaData = [];

function getInicioSemanaOperacional(dataBase){
      const d = new Date(dataBase);
      d.setHours(0,0,0,0);

      const day = d.getDay(); // 0 dom, 1 seg, 2 ter...
      let diff;

      if(day === 2){
        diff = 0;
      }else if(day > 2){
        diff = day - 2;
      }else{
        diff = day + 5;
      }

      d.setDate(d.getDate() - diff);
      return d;
    }

function formatDateISO(date){
      const y = date.getFullYear();
      const m = String(date.getMonth()+1).padStart(2,"0");
      const d = String(date.getDate()).padStart(2,"0");
      return `${y}-${m}-${d}`;
    }

function parseDateAny(value){
  if(!value) return null;

  // já é Date
  if(value instanceof Date){
    const d = new Date(value.getFullYear(), value.getMonth(), value.getDate());
    return d;
  }

  if(typeof value === "string"){

    // ISO (YYYY-MM-DD) → TRATAR NA MÃO (SEM new Date)
    if(/^\d{4}-\d{2}-\d{2}$/.test(value)){
      const [y,m,d] = value.split("-");
      return new Date(Number(y), Number(m)-1, Number(d));
    }

    // BR
    if(/^\d{2}\/\d{2}\/\d{4}$/.test(value)){
      const [d,m,y] = value.split("/");
      return new Date(Number(y), Number(m)-1, Number(d));
    }

    // fallback
    const d = new Date(value);
    if(!isNaN(d)){
      return new Date(d.getFullYear(), d.getMonth(), d.getDate());
    }
  }

  return null;
}

function formatDateBR(value){
      const d = parseDateAny(value);
      if(!d) return "-";
      return d.toLocaleDateString("pt-BR");
    }

function formatWeekRange(startDate){
      const end = new Date(startDate);
      end.setDate(end.getDate() + 6);

      return `${formatDateBR(startDate)} até ${formatDateBR(end)}`;
    }

function escapeHtml(str){
      return String(str ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

function mostrarAlerta(msg, titulo = "Aviso"){

  document.getElementById("alertaTitulo").innerText = titulo;

  // 🔥 CORREÇÃO PRINCIPAL
  document.getElementById("alertaMensagem").innerHTML = msg;

  document.getElementById("alertaCancelar").style.display = "none";

  const modal = document.getElementById("modalAlerta");
  modal.classList.add("show");

  document.getElementById("alertaOk").onclick = () => {
    modal.classList.remove("show");
  };

}

function confirmarAcao(msg, callback){

  document.getElementById("alertaTitulo").innerText = "Confirmação";
  document.getElementById("alertaMensagem").innerText = msg;

  const modal = document.getElementById("modalAlerta");
  modal.classList.add("show");

  const btnOk = document.getElementById("alertaOk");
  const btnCancelar = document.getElementById("alertaCancelar");

  btnCancelar.style.display = "inline-block";

  btnOk.onclick = () => {
    modal.classList.remove("show");
    callback(true);
  };

  btnCancelar.onclick = () => {
    modal.classList.remove("show");
    callback(false);
  };

}

function mostrarLoading(texto = "Carregando..."){
      const box = document.getElementById("loadingBox");
      box.textContent = texto;
      box.classList.add("show");
    }

function esconderLoading(){
      document.getElementById("loadingBox").classList.remove("show");
    }

function getDayIndexTerSeg(value){
  if(!value) return -1;
  const dataStr = String(value).split("T")[0].split(" ")[0];
  const d = new Date(dataStr + "T00:00:00");
  const inicio = new Date(formatDateISO(semanaInicioAtual) + "T00:00:00");
  const diff = Math.floor((d - inicio) / 86400000);
  return (diff >= 0 && diff <= 6) ? diff : -1;
}

/* Sessão do login (mesmo formato da do Cronograma) */
function edicaoCronogramaEstaLiberada(){ return Boolean(window.tokenAuditoria) && Date.now() < (window.__freeSessaoAte || 0); }
function encerrarLiberacaoEdicaoCronograma(){ window.tokenAuditoria = ""; window.perfilAcesso = ""; window.__freeSessaoAte = 0; }
function pedirSenha(setor){
  if(edicaoCronogramaEstaLiberada()){
    return Promise.resolve({ valido:true, perfil:window.perfilAcesso, usuario:window.usuarioAcesso, token:window.tokenAuditoria });
  }
  return new Promise(function(resolve){
    google.script.run
      .withSuccessHandler(function(r){
        if(r && r.valido === true && r.token){
          window.perfilAcesso = r.perfil; window.usuarioAcesso = r.usuario; window.tokenAuditoria = r.token;
          window.__freeSessaoAte = Date.now() + (Number(r.duracaoSegundos) || 600) * 1000 - 30000;
          resolve(r); return;
        }
        mostrarAlerta("Seu usuário não tem permissão para a Equipe Free. Peça a liberação no Cadastro de Funcionários.", "Sem permissão");
        resolve(false);
      })
      .withFailureHandler(function(erro){
        mostrarAlerta((erro && erro.message) || "Não foi possível conferir o seu acesso.", "Sem permissão");
        resolve(false);
      })
      .CRON_entrarComLogin(setor || "Equipe Free");
  });
}

/* Semana: o painel usa as etapas da semana para "Sem pedido de free" */
function carregarCronograma(){
  document.getElementById("weekLabel").textContent = "Semana: " + formatWeekRange(semanaInicioAtual);
  return new Promise(function(resolve){
    google.script.run
      .withSuccessHandler(function(res){ cronogramaData = Array.isArray(res) ? res : []; window.cronogramaData = cronogramaData; resolve(); })
      .withFailureHandler(function(){ cronogramaData = []; window.cronogramaData = cronogramaData; resolve(); })
      .getCronogramaSemana(formatDateISO(semanaInicioAtual));
  });
}

<script>

const FREE_ICONE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>';
const FREE_CHAVE_PONTO = "freeUltimoPontoEncontro";

window.freeContextos = window.freeContextos || {};

const freeEstado = {

function freeRegistrarContexto(etapa, pedido){

  window.freeContextos[id] = {
    idEtapa: id,

    dataEtapa: etapa.dataEtapa || etapa.data || "",

    pedido: (pedido && pedido.pedido) || "",
    cliente: (pedido && pedido.cliente) || "",
    local: (pedido && pedido.local) || ""
  };
  return id;
}

function freeClasseBadge(v){
  if(v.status === "ENCERRADA"){ return "encerrada"; }
  return v.confirmados >= v.quantidade ? "completa" : "parcial";
}

function renderFreeBadgeDesktop(etapa, pedido, permiteAbrir){
  const id = freeRegistrarContexto(etapa, pedido);
  if(!id){ return ""; }

  const v = etapa.freeVaga;
  const chamada = "event.stopPropagation(); freeAbrirVagaEtapa('" + id.replace(/'/g, "\\'") + "')";

  if(v){
    const titulo = (v.nomes && v.nomes.length ? "Confirmados: " + v.nomes.join(", ") : "Ninguém confirmou ainda") +
      (v.cancelados ? " · " + v.cancelados + (v.cancelados === 1 ? " cancelou" : " cancelaram") : "") +
      (v.checkins ? " · " + v.checkins + " check-in, " + v.checkouts + " check-out" : "") +
      (v.faltas ? " · " + v.faltas + (v.faltas === 1 ? " faltou" : " faltaram") : "") +
      (v.mudancasPendentes ? " · " + v.mudancasPendentes + " não viram a mudança de horário" : "") +
      (v.valor ? " · Diária " + freeMoeda(v.valor) : "") +
      (v.modo === "PRIORIDADE" ? " · Escolhidos primeiro" : v.modo === "EXCLUSIVA" ? " · Só escolhidos" : "");
    const extra =
      (v.mudancasPendentes ? '<span class="free-badge-extra alerta" title="Não viram a mudança">!</span>' : "") +
      (v.faltas ? '<span class="free-badge-extra alerta">' + v.faltas + ' falta' + (v.faltas > 1 ? "s" : "") + '</span>' : "") +
      (v.checkins ? '<span class="free-badge-extra">✓' + v.checkins + '</span>' : "");
    return (
      '<button type="button" class="free-badge ' + freeClasseBadge(v) + '" title="' + escapeHtml(titulo) + '" onclick="' + chamada + '">' +
        FREE_ICONE + (v.status === "ENCERRADA" ? "Free encerrado" : "Free") + extra +
        '<span class="free-badge-num">' + v.confirmados + '/' + v.quantidade + '</span>' +
      '</button>'

  const futura = String(etapa.dataEtapa || etapa.data || "") >= formatDateISO(new Date());

}

function renderFreeAvisoMobile(etapa){
  const v = etapa && etapa.freeVaga;

/* ---------- Acesso ---------- */

/* Link do app do montador (canto superior e menu do celular) */
let urlAppMontador = "";

function carregarLinkAppMontador(){
  if(typeof google === "undefined" || !google.script || !google.script.run){ return; }

    .withSuccessHandler(function(url){
      urlAppMontador = url || "";
