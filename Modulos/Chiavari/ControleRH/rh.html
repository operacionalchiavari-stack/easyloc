    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial;
    }

body{
  background:#f1f5f9;
  color:var(--el-color-text,#1f2020);
}

.container{
  padding:28px 30px 35px;
}

/* CABEÇALHO DA PÁGINA */
.cabecalhoPagina{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
  margin-bottom:20px;
}

.cabecalhoPagina h1{
  margin:0;
  font-size:26px;
  line-height:1.2;
  color:var(--el-color-text,#1f2020);
  letter-spacing:-0.5px;
}

.cabecalhoPagina p{
  margin-top:6px;
  font-size:14px;
  color:var(--el-color-text,#1f2020);
}

/* BARRA DE FILTROS E BOTÕES */
.topo{
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:15px;

  background:#ffffff;
  border:1px solid var(--el-color-border,#e3e7ec);
  border-radius:16px;

  padding:14px 16px;
  margin-bottom:22px;

  box-shadow:0 4px 18px rgba(31,32,32,0.04);
}

    .btnNovo{
      background:var(--el-button-primary-bg,#7d603d);
      color:white;
      border:none;
      padding:14px 22px;
      border-radius:14px;
      font-size:16px;
      font-weight:bold;
      cursor:pointer;
      transition:0.2s;
      box-shadow:0 4px 15px rgba(var(--el-button-primary-rgb,125,96,61),0.25);
    }

    .btnNovo:hover{
      transform:translateY(-2px);
    }

.filtros{
  display:flex;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
  margin:0;
}

    .filtros input,
    .filtros select{
      padding:12px;
      border-radius:12px;
      border:1px solid var(--el-color-border,#e3e7ec);
      background:white;
      min-width:180px;
    }

    .tabelaBox{
      background:white;
      border-radius:18px;
      overflow:hidden;
      box-shadow:0 4px 20px rgba(0,0,0,0.05);
    }

    table{
      width:100%;
      border-collapse:collapse;
    }

    thead{
      background:var(--el-color-surface-soft,#f6f7f9);color:var(--el-color-text,#1f2020);
    }

    th{
      padding:16px;
      text-align:left;
      position:sticky;
      top:0;
    }

    td{
      padding:14px 16px;
      border-bottom:1px solid #f1f5f9;
    }

tbody tr:hover{
  background:#f8fafc;
}
.tag{
  padding:7px 13px;
  border-radius:999px;
  font-size:12px;
  font-weight:600;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:82px;
  text-align:center;
  line-height:1.15;
  border:1px solid transparent;
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.6);
}

/* 🔥 OCORRÊNCIAS - CORES MAIS PREMIUM */

.Atraso{
  background:#fff7ed;
  color:#c2410c;
  border-color:#fed7aa;
}

.SemUniforme{
  background:#fef2f2;
  color:#b91c1c;
  border-color:#fecaca;
}

.SemEPI{
  background:#ffedd5;
  color:#9a3412;
  border-color:#fdba74;
}

.UsodeCelular{
  background:var(--el-color-surface-soft,#f6f7f9);
  color:var(--el-color-text,#1f2020);
  border-color:var(--el-color-border,#e3e7ec);
}

.Falta{
  background:#fee2e2;
  color:#991b1b;
  border-color:#fecaca;
}

.AusenciadeJornada{
  background:#f3e8ff;
  color:#6b21a8;
  border-color:#d8b4fe;
}

.Advertencia{
  background:#f8fafc;
  color:var(--el-color-text,#1f2020);
  border-color:var(--el-color-border,#e3e7ec);
}

    /* MODAL */

    .modal{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,0.4);
      display:none;
      align-items:center;
      justify-content:center;
      z-index:999;
      padding:20px;
    }

    .modalContent{
      background:white;
      width:100%;
      max-width:750px;
      border-radius:22px;
      padding:25px;
      animation:modal 0.2s ease;
      max-height:90vh;
      overflow:auto;
    }

    @keyframes modal{
      from{
        transform:translateY(20px);
        opacity:0;
      }
      to{
        transform:translateY(0);
        opacity:1;
      }
    }

    .grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:15px;
      margin-bottom:15px;
    }

    .campo{
      display:flex;
      flex-direction:column;
      gap:6px;
    }

    .campo label{
      font-size:13px;
      font-weight:bold;
      color:var(--el-color-text,#1f2020);
    }

    .campo input,
    .campo select,
    .campo textarea{
      padding:13px;
      border-radius:12px;
      border:1px solid var(--el-color-border,#e3e7ec);
      background:#fff;
    }

    textarea{
      resize:none;
      min-height:90px;
    }

    .tipos{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      margin-bottom:15px;
    }

    .tipoBtn{
      border:none;
      padding:12px 14px;
      border-radius:14px;
      background:var(--el-button-primary-soft,#f4efe8);
      cursor:pointer;
      font-weight:bold;
      transition:0.2s;
    }

    .tipoBtn.ativo{
      background:var(--el-button-primary-bg,#7d603d);
      color:white;
      transform:scale(1.02);
    }

    .acoes{
      display:flex;
      justify-content:flex-end;
      gap:10px;
      margin-top:20px;
    }

    .btn{
      border:none;
      padding:13px 18px;
      border-radius:12px;
      cursor:pointer;
      font-weight:bold;
    }

    .btnCancelar{
      background:var(--el-button-primary-soft,#f4efe8);
    }

    .btnLote{
      background:var(--el-button-primary-bg,#7d603d);
      color:white;
    }

    .btnEnviar{
      background:var(--el-button-primary-bg,#7d603d);
      color:white;
    }

    .loteBox{
      margin-top:20px;
      background:#f8fafc;
      border-radius:16px;
      padding:15px;
    }

    .loteItem{
      background:white;
      border-radius:12px;
      padding:12px;
      margin-bottom:10px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      border:1px solid var(--el-color-border,#e3e7ec);
    }

    .remover{
      background:#ef4444;
      color:white;
      border:none;
      padding:7px 10px;
      border-radius:8px;
      cursor:pointer;
    }
.modalSenhaRH{

  background:var(--el-button-primary-soft,#f4efe8);
}

.btnSenhaConfirmar{
  border:none;

  height:38px;
  padding:0 16px;
  border-radius:10px;
  font-size:13px;
  font-weight:600;
  cursor:pointer;
  transition:.18s;
  box-shadow:none;
}

.btnSenhaConfirmar:hover{
  background:var(--el-button-primary-bg,#7d603d);

<script>

let funcionarios = [];
let lote = [];
let tipoSelecionado = "";
let acaoPendenteRH = null;


window.onload = function(){

  atualizarRelogio();

  setInterval(atualizarRelogio, 1000);

  google.script.run
    .withSuccessHandler(function(){

      carregarFuncionarios();

      carregarHistorico();

    })
    .iniciarSistemaRH();

};

function atualizarRelogio(){

  const el = document.getElementById("relogio");

  // 🔥 se não existir relógio, não faz nada
  if(!el) return;

  const agora = new Date();

  el.innerHTML = agora.toLocaleString("pt-BR");

}

function abrirModal(){

  const agora = new Date();

  const ano = agora.getFullYear();
  const mes = String(agora.getMonth() + 1).padStart(2, "0");
  const dia = String(agora.getDate()).padStart(2, "0");

  const hora = String(agora.getHours()).padStart(2, "0");
  const minuto = String(agora.getMinutes()).padStart(2, "0");

  document.getElementById("dataOcorrencia").value =
    `${ano}-${mes}-${dia}`;

  document.getElementById("horaOcorrencia").value =
    `${hora}:${minuto}`;

  document.getElementById("modal").style.display = "flex";
}

function fecharModal(){
  document.getElementById("modal").style.display = "none";
}

function carregarFuncionarios(){

  google.script.run.withSuccessHandler(function(lista){

    funcionarios = lista || [];

    const select = document.getElementById("funcionario");

    select.innerHTML = '<option value="">Selecione</option>';

    funcionarios.forEach(function(f){
select.innerHTML += `
  <option value="${f.nomeCompleto}">
    ${f.nomeCompleto}
  </option>
`;
    });

  }).getFuncionarios();

}

function selecionarFuncionario(){

  const nome =
    document.getElementById("funcionario").value;

  const func =
    funcionarios.find(
      f => f.nomeCompleto === nome
    );

  document.getElementById("setor").value =
    func ? func.setor : "";

}
function selecionarTipo(btn, tipo){

  document.querySelectorAll(".tipoBtn").forEach(function(el){
    el.classList.remove("ativo");
  });

  btn.classList.add("ativo");

  tipoSelecionado = tipo;

}

function adicionarLote(){

const dataOcorrencia =
  document.getElementById("dataOcorrencia").value;

const horaOcorrencia =
  document.getElementById("horaOcorrencia").value;
  const funcionario = document.getElementById("funcionario").value;
  const setor = document.getElementById("setor").value;
  const observacao = document.getElementById("observacao").value;
  const responsavel = document.getElementById("responsavel").value;

  if(!funcionario){
    alert("Selecione um funcionário.");
    return;
  }

  if(!tipoSelecionado){
    alert("Selecione o tipo da ocorrência.");
    return;
  }

  if(!dataOcorrencia){
  alert("Informe a data da ocorrência.");
  return;
}

lote.push({
  dataOcorrencia,
  horaOcorrencia,
  funcionario,
  setor,
  tipo: tipoSelecionado,
  observacao,
  responsavel
});
  renderizarLote();

  document.getElementById("funcionario").value = "";
  document.getElementById("setor").value = "";
  document.getElementById("observacao").value = "";

  document.querySelectorAll(".tipoBtn").forEach(function(el){
    el.classList.remove("ativo");
  });

  tipoSelecionado = "";

  alert("Lançamento adicionado ao lote.");

}

function renderizarLote(){

  const div = document.getElementById("listaLote");

  div.innerHTML = "";

  lote.forEach(function(item, index){

    const dataFormatada = formatarDataExibicao(item.dataOcorrencia);

    const dataHora = item.horaOcorrencia
      ? `${dataFormatada} às ${item.horaOcorrencia}`
      : dataFormatada;

    div.innerHTML += `
      <div class="loteItem">

        <div>
          <strong>${item.funcionario}</strong><br>

          <small>${item.setor}</small><br>

          <small>
            <strong>Ocorrência:</strong> ${dataHora}
          </small><br>

          <span>${item.tipo}</span>
        </div>

        <button
          class="remover"
          onclick="removerLote(${index})"
        >
          Remover
        </button>

      </div>
    `;

  });

}

function removerLote(index){
  lote.splice(index, 1);
  renderizarLote();
}

function enviarLote(){

  if(lote.length === 0){
    alert("Nenhum lançamento no lote.");
    return;
  }

  google.script.run.withSuccessHandler(function(){

    alert("Lote enviado com sucesso.");

    lote = [];
    renderizarLote();
    fecharModal();
    carregarHistorico();

  }).salvarLoteRH(lote);

}

function carregarHistorico(){

  google.script.run

    .withSuccessHandler(function(lista){

      console.log(lista);

      if(!Array.isArray(lista)){
        lista = [];
      }

      // usado pelo Painel do RH
      window.historicoRH = lista;
      const contagemRH = document.getElementById("rhContagem");
      if(contagemRH) contagemRH.textContent = lista.length + (lista.length === 1 ? " ocorrência" : " ocorrências");

      const tbody =
        document.getElementById("tbody");

      tbody.innerHTML = "";

      lista.forEach(function(item){

        const tipo =
          item.tipo || "";

        const classe = tipo
          .replaceAll(" ", "")
          .replace("ê", "e");

const dataExibicao = formatarDataExibicao(
  item.dataOcorrencia || item.data
);

const horaExibicao =
  item.horaOcorrencia || item.hora || "—";

        tbody.innerHTML += `
          <tr>

<td>${dataExibicao}</td>
<td>${horaExibicao}</td>

            <td>${item.funcionario}</td>

            <td>${item.setor}</td>

            <td>
              <span class="tag ${classe}">
                ${tipo}
              </span>
            </td>

            <td>${item.observacao}</td>

            <td>${item.responsavel}</td>

          </tr>
        `;

      });

    })

    .withFailureHandler(function(erro){

      console.error(erro);

    })

    .getHistoricoRH();

}
function filtrarTabela(){

  const pesquisa =
    document.getElementById("pesquisa")
    .value
    .toLowerCase();

  const tipo =
    document.getElementById("filtroTipo")
    .value
    .toLowerCase();

  const mesSelecionado =
    document.getElementById("filtroMes")
    .value;

  const linhas =
    document.querySelectorAll("#tbody tr");

  linhas.forEach(function(linha){

    const texto =
      linha.innerText.toLowerCase();

    const dataTexto =
      linha.children[0].innerText;

    let passaMes = true;

    if(mesSelecionado){

      const partes =
        dataTexto.split("/");

      const dataFormatada =
        partes[2] + "-" + partes[1];

      passaMes =
        dataFormatada === mesSelecionado;

    }

    const mostrar =

      texto.includes(pesquisa) &&
      texto.includes(tipo) &&
      passaMes;

    linha.style.display =
      mostrar ? "" : "none";

  });

}
function abrirModalFuncionario(){const destino='/Modulos/RH/CadastroFuncionarios/cadastro-funcionarios.html';if(window.parent!==window)window.parent.location.href='/dashboard.html?page='+encodeURIComponent(destino);else location.href=destino;}

function abrirModalSenhaRH(tipo){

  }

}

function confirmarSenhaRH(){

  const senha =
    document.getElementById("inputSenhaRH").value;

  if(!senha){
    alert("Digite a senha");
    return;
  }

  google.script.run
    .withSuccessHandler(ok => {

if(!ok){
  alert("Senha inválida");
  return;
}

// 🔥 fecha primeiro o modal da senha
fecharModalSenhaRH();

// 🔥 pequena espera pra evitar conflito visual
setTimeout(() => {

  if(acaoPendenteRH === "ocorrencia"){
    abrirModal();
  }

  if(acaoPendenteRH === "funcionario"){
    abrirModalFuncionario();
  }

}, 120);

    })
    .withFailureHandler(err => {

      alert(err.message || "Erro ao validar senha");

    })
    .validarSenhaRH(senha);

}

function formatarDataExibicao(valor){

  if(!valor){
    return "";
  }

  if(/^\d{2}\/\d{2}\/\d{4}$/.test(valor)){
    return valor;
  }

  if(/^\d{4}-\d{2}-\d{2}$/.test(valor)){

    const partes = valor.split("-");

    return `${partes[2]}/${partes[1]}/${partes[0]}`;
  }

  return valor;
}

<script>
/* =========================================================
   PAINEL DO RH — calculado com as ocorrências já carregadas na tela
========================================================= */
var PainelRH = (function(){

  const COR = { s1:'#656565', s2:"#eb6834", s3:"#1baf7a", ok:"#16a34a", aviso:"#d97706", ruim:"#dc2626" };
  const MESES = ["jan", "fev", "mar", "abr", "mai", "jun", "jul", "ago", "set", "out", "nov", "dez"];
  const MESES_LONGOS = ["janeiro", "fevereiro", "março", "abril", "maio", "junho", "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"];
  const SEMANA = ["Dom", "Seg", "Ter", "Qua", "Qui", "Sex", "Sáb"];
  const GRAVES = ["falta", "ausencia de jornada", "advertencia"];

  let meses = 1;          // período escolhido (0 = tudo)
  const ref = {};

  const $ = function(id){ return document.getElementById(id); };
  const esc = function(v){
    return String(v === null || v === undefined ? "" : v)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  };
  const norm = function(t){ return String(t || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/\s+/g, " ").trim(); };
  const inteiro = function(v){ return Math.round(Number(v || 0)).toLocaleString("pt-BR"); };
  const quieto = function(){ return !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches); };
  const chaveMes = function(d){ return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0"); };
  const nomeMes = function(k, longo){ const p = k.split("-"); return longo ? MESES_LONGOS[Number(p[1]) - 1] + " de " + p[0] : MESES[Number(p[1]) - 1] + "/" + p[0].slice(2); };
  const plural = function(n, um, varios){ return inteiro(n) + " " + (n === 1 ? um : varios); };

  /* "dd/mm/aaaa" ou "aaaa-mm-dd" → Date */
  function lerData(v){
    const t = String(v || "").trim();
    let m = t.match(/^(\d{2})\/(\d{2})\/(\d{4})/);
    if (m) return new Date(Number(m[3]), Number(m[2]) - 1, Number(m[1]), 12);
    m = t.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (m) return new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]), 12);
    return null;
  }

  function contar(elemento, alvo, formato){
    if (!elemento) return;
    if (quieto()){ elemento.textContent = formato(alvo); return; }
    const t0 = performance.now();
    (function passo(agora){
      const t = Math.min(1, (agora - t0) / 1100);
      elemento.textContent = formato(alvo * (1 - Math.pow(1 - t, 3)));
      if (t < 1) requestAnimationFrame(passo);
    })(t0);
  }

  function curva(pts){
    const n = pts.length;
    if (!n) return "";
    if (n === 1) return "M" + pts[0].x + "," + pts[0].y;
    const dx = [], m = [], t = [];
    for (let i = 0; i < n - 1; i++){ dx[i] = pts[i + 1].x - pts[i].x; m[i] = (pts[i + 1].y - pts[i].y) / (dx[i] || 1); }
    t[0] = m[0]; t[n - 1] = m[n - 2];
    for (let i = 1; i < n - 1; i++) t[i] = m[i - 1] * m[i] <= 0 ? 0 : (m[i - 1] + m[i]) / 2;
    for (let i = 0; i < n - 1; i++){
      if (m[i] === 0){ t[i] = 0; t[i + 1] = 0; continue; }
      const a = t[i] / m[i], b = t[i + 1] / m[i], s = a * a + b * b;
      if (s > 9){ const k = 3 / Math.sqrt(s); t[i] = k * a * m[i]; t[i + 1] = k * b * m[i]; }
    }
    let d = "M" + pts[0].x.toFixed(1) + "," + pts[0].y.toFixed(1);
    for (let i = 0; i < n - 1; i++){
      const h = dx[i] / 3;
      d += "C" + (pts[i].x + h).toFixed(1) + "," + (pts[i].y + t[i] * h).toFixed(1) + " " +
        (pts[i + 1].x - h).toFixed(1) + "," + (pts[i + 1].y - t[i + 1] * h).toFixed(1) + " " +
        pts[i + 1].x.toFixed(1) + "," + pts[i + 1].y.toFixed(1);
    }
    return d;
  }

  function desenharTraco(c, atraso){
    if (!c || quieto()) return;
    const L = c.getTotalLength();
    c.style.strokeDasharray = L; c.style.strokeDashoffset = L;
    c.getBoundingClientRect();
    c.style.transition = "stroke-dashoffset 1.4s cubic-bezier(.45,.05,.2,1) " + (atraso || 0) + "s";
    c.style.strokeDashoffset = 0;
  }
  function depois(fn){ requestAnimationFrame(function(){ requestAnimationFrame(fn); }); }
  function escala(max){
    if (max <= 4) return 4;
    const passo = Math.pow(10, Math.floor(Math.log10(max / 4)));
    return Math.ceil(max / 4 / passo) * passo * 4;
  }

  function dica(e, html){
    const d = $("prDica"), caixa = $("painelRH").getBoundingClientRect();
    d.innerHTML = html; d.classList.add("visivel");
    let x = e.clientX - caixa.left + 16, y = e.clientY - caixa.top + 16;
    if (x + d.offsetWidth > caixa.width - 8) x = e.clientX - caixa.left - d.offsetWidth - 16;
    if (y + d.offsetHeight > caixa.height - 8) y = e.clientY - caixa.top - d.offsetHeight - 16;
    d.style.left = x + "px"; d.style.top = y + "px";
  }
  function semDica(){ $("prDica").classList.remove("visivel"); }
  function linhaDica(cor, rot, v){ return '<div><span>' + (cor ? '<i style="background:' + cor + '"></i>' : "") + rot + '</span><strong>' + v + '</strong></div>'; }

  /* ---------- Abrir / fechar / período ---------- */
  function abrir(){
    $("painelRH").classList.add("aberto");
    document.body.classList.add("painel-aberto");
    desenhar();
  }
  function fechar(){
    $("painelRH").classList.remove("aberto");
    document.body.classList.remove("painel-aberto");
    semDica();
  }
  function periodo(n){ meses = n; desenhar(); }

  /* Ocorrências com data válida */
  function ocorrencias(){
    return (window.historicoRH || []).map(function(o){
      const d = lerData(o.dataOcorrencia || o.data);
      return d ? { data:d, funcionario:String(o.funcionario || "").trim() || "Sem nome", setor:String(o.setor || "").trim() || "Sem setor",
        tipo:String(o.tipo || "").trim() || "Sem tipo", hora:String(o.horaOcorrencia || o.hora || ""), responsavel:String(o.responsavel || "").trim(),
        observacao:String(o.observacao || "") } : null;
    }).filter(Boolean);
  }

  function desenhar(){
    document.querySelectorAll("#prPeriodos button").forEach(function(b){ b.classList.toggle("ativo", Number(b.dataset.p) === meses); });

    const todas = ocorrencias();
    const hoje = new Date();
    const fim = new Date(hoje.getFullYear(), hoje.getMonth() + 1, 0, 23, 59, 59);
    let inicio, iniAnt = null;
    if (meses){
      inicio = new Date(hoje.getFullYear(), hoje.getMonth() - meses + 1, 1);
      iniAnt = new Date(hoje.getFullYear(), hoje.getMonth() - 2 * meses + 1, 1);
    } else {
      inicio = todas.length ? new Date(Math.min.apply(null, todas.map(function(o){ return o.data.getTime(); }))) : new Date(hoje.getFullYear(), hoje.getMonth(), 1);
    }
    const lista = todas.filter(function(o){ return o.data >= inicio && o.data <= fim; });
    const anterior = iniAnt ? todas.filter(function(o){ return o.data >= iniAnt && o.data < inicio; }) : null;

    $("prSubtitulo").textContent = (meses === 1 ? nomeMes(chaveMes(hoje), true) : inicio.toLocaleDateString("pt-BR") + " a " + hoje.toLocaleDateString("pt-BR")) +
      " · " + plural(lista.length, "ocorrência", "ocorrências");

    $("prCorpo").innerHTML =
      '<div class="pa-g4" id="prKpis"></div>' +
      '<div class="pa-g21">' +
        '<section class="pa-card" style="animation-delay:.1s"><div class="pa-card-topo"><div><h3>Ocorrências por mês</h3><p class="pa-sub">Últimos 12 meses</p></div>' +
          '<div class="pa-legenda"><span><i style="background:' + COR.s1 + '"></i>Todas</span><span><i style="background:' + COR.s2 + '"></i>Faltas, ausências e advertências</span></div></div>' +
          '<div class="pa-area" id="prLinhas"></div></section>' +
        '<section class="pa-card" style="animation-delay:.16s"><h3>Por tipo</h3><p class="pa-sub">Quantidade de cada ocorrência no período</p><div class="pa-rank-lista" id="prTipos"></div></section>' +
      '</div>' +
      '<div class="pa-secao">Pessoas e setores</div>' +
      '<div class="pa-g3b">' +
        '<section class="pa-card"><h3>Funcionários com mais ocorrências</h3><p class="pa-sub">No período</p><div class="pa-rank-lista" id="prPessoas"></div></section>' +
        '<section class="pa-card"><h3>Ocorrências por setor</h3><p class="pa-sub">Quantidade e parte do total</p><div class="pa-rank-lista" id="prSetores"></div></section>' +
        '<section class="pa-card"><h3>Quem mais registra</h3><p class="pa-sub">Responsáveis pelos lançamentos</p><div class="pa-rank-lista" id="prResp"></div></section>' +
      '</div>' +
      '<div class="pa-secao">Quando acontecem</div>' +
      '<div class="pa-g3">' +
        '<section class="pa-card"><div class="pa-card-topo"><div><h3>Por horário</h3><p class="pa-sub">Hora em que a ocorrência aconteceu</p></div><span class="pa-destaque" id="prHoraPico"></span></div><div class="pa-area" id="prHoras"></div></section>' +
        '<section class="pa-card"><div class="pa-card-topo"><div><h3>Por dia da semana</h3><p class="pa-sub">Soma do período</p></div><span class="pa-destaque" id="prDiaPico"></span></div><div class="pa-area" id="prSemana"></div></section>' +
        '<section class="pa-card"><h3>Últimas ocorrências</h3><p class="pa-sub">As 6 mais recentes do período</p><div class="pa-critico" id="prUltimas"></div></section>' +
      '</div>';

    kpis(lista, anterior, todas);
    linhas(todas);
    ranking("prTipos", contarPor(lista, "tipo"), "c-azul", lista.length);
    ranking("prPessoas", contarPor(lista, "funcionario").slice(0, 7), "c-laranja", lista.length, function(r){ return resumoTipos(lista, "funcionario", r.nome); });
    ranking("prSetores", contarPor(lista, "setor").slice(0, 7), "c-verde", lista.length);
    ranking("prResp", contarPor(lista.filter(function(o){ return o.responsavel; }), "responsavel").slice(0, 7), "c-azul", lista.length);
    colunas("prHoras", horas(lista), "prHoraPico", function(r){ return r.rotulo; });
    colunas("prSemana", diasSemana(lista), "prDiaPico", function(r){ return r.rotulo; });
    ultimas(lista);
  }

  function contarPor(lista, campo){
    const mapa = {};
    lista.forEach(function(o){ const k = norm(o[campo]); (mapa[k] = mapa[k] || { nome:o[campo], valor:0 }).valor++; });
    return Object.keys(mapa).map(function(k){ return mapa[k]; }).sort(function(a, b){ return b.valor - a.valor || a.nome.localeCompare(b.nome); });
  }

  function resumoTipos(lista, campo, nome){
    const tipos = contarPor(lista.filter(function(o){ return norm(o[campo]) === norm(nome); }), "tipo");
    return tipos.slice(0, 3).map(function(t){ return t.valor + " " + t.nome.toLowerCase(); }).join(" · ");
  }

  /* ---------- Indicadores ---------- */
  function delta(atual, antes){
    if (antes === null) return '<span class="pa-delta neutro">período todo</span>';
    if (!antes) return '<span class="pa-delta ' + (atual ? "sobe" : "neutro") + '">' + (atual ? "novo" : "—") + '</span>';
    const p = (atual - antes) / antes * 100;
    if (Math.abs(p) < 0.5) return '<span class="pa-delta neutro">= 0%</span>';
    // Ocorrência subir é ruim (vermelho); cair é bom (verde)
    return '<span class="pa-delta ' + (p > 0 ? "sobe" : "desce") + '">' + (p > 0 ? "▲ " : "▼ ") + Math.round(Math.abs(p)) + '%</span>';
  }

  function kpis(lista, anterior, todas){
    const conta = function(l, tipo){ return l ? l.filter(function(o){ return norm(o.tipo) === tipo; }).length : null; };
    const graves = function(l){ return l ? l.filter(function(o){ return GRAVES.indexOf(norm(o.tipo)) >= 0; }).length : null; };
    const pessoas = {};
    lista.forEach(function(o){ pessoas[norm(o.funcionario)] = 1; });
    const qtdPessoas = Object.keys(pessoas).length;
    const equipe = (typeof funcionarios !== "undefined" && Array.isArray(funcionarios)) ? funcionarios.length : 0;

    const serie12 = ultimos12(todas);
    const cards = [
      { id:"r1", rot:"Ocorrências", cor:COR.s1, v:lista.length, rod:delta(lista.length, anterior ? anterior.length : null) + "<span>vs período anterior</span>", serie:serie12.map(function(m){ return m.todas; }) },
      { id:"r2", rot:"Faltas", cor:COR.ruim, v:conta(lista, "falta"), rod:delta(conta(lista, "falta"), conta(anterior, "falta")) + "<span>vs período anterior</span>", serie:serie12.map(function(m){ return m.faltas; }) },
      { id:"r3", rot:"Atrasos", cor:COR.aviso, v:conta(lista, "atraso"), rod:delta(conta(lista, "atraso"), conta(anterior, "atraso")) + "<span>vs período anterior</span>", serie:serie12.map(function(m){ return m.atrasos; }) },
      { id:"r4", rot:"Funcionários com ocorrência", cor:COR.s3, v:qtdPessoas,
        rod:"<span>" + (equipe ? Math.round(qtdPessoas / equipe * 100) + "% da equipe ativa (" + inteiro(equipe) + ")" : "no período") + " · " + plural(graves(lista), "grave", "graves") + "</span>",
        serie:serie12.map(function(m){ return m.pessoas; }) }
    ];
    $("prKpis").innerHTML = cards.map(function(c, i){
      return '<div class="pa-card pa-kpi" style="animation-delay:' + (i * 0.06) + 's"><div class="pa-rot"><span class="pa-ico" style="background:' + c.cor + '1f;color:' + c.cor + '">' + ICO[i] + '</span>' + c.rot + '</div>' +
        '<strong class="pa-valor" id="' + c.id + '">0</strong><div class="pa-rodape">' + c.rod + '</div>' +
        '<svg class="pa-spark" id="' + c.id + 's" viewBox="0 0 200 54" preserveAspectRatio="none" aria-hidden="true"></svg></div>';
    }).join("");

    cards.forEach(function(c){
      contar($(c.id), c.v, inteiro);
      const vals = c.serie, max = Math.max.apply(null, vals.concat([1])), n = vals.length;
      const pts = vals.map(function(v, i){ return { x:n === 1 ? 100 : 200 * i / (n - 1), y:50 - 40 * v / max }; });
      const linha = curva(pts), g = c.id + "g", svg = $(c.id + "s");
      svg.innerHTML = '<defs><linearGradient id="' + g + '" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="' + c.cor + '" stop-opacity=".25"/><stop offset="100%" stop-color="' + c.cor + '" stop-opacity="0"/></linearGradient></defs>' +
        '<path d="' + linha + 'L200,54L0,54Z" fill="url(#' + g + ')" style="opacity:0;transition:opacity 1s .6s"/>' +
        '<path d="' + linha + '" fill="none" stroke="' + c.cor + '" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linecap="round"/>';
      desenharTraco(svg.querySelectorAll("path")[1], 0.2);
      depois(function(){ svg.querySelector("path").style.opacity = 1; });
    });
  }

  const ICO = [
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4h6l1 3h3v13H5V7h3l1-3z"/><path d="M9 13h6M9 17h4"/></svg>',
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/><path d="M17 3l4 4M21 3l-4 4"/></svg>',
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2"/><path d="M9 2h6"/></svg>',
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2 20c.8-3.5 3.5-5 7-5s6.2 1.5 7 5"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14c2.5 0 4.3 1.3 5 4"/></svg>'
  ];

  function ultimos12(todas){
    const hoje = new Date(), serie = [];
    for (let i = 11; i >= 0; i--){
      const d = new Date(hoje.getFullYear(), hoje.getMonth() - i, 1);
      serie.push({ mes:chaveMes(d), todas:0, graves:0, faltas:0, atrasos:0, pessoas:0, _p:{} });
    }
    const idx = {};
    serie.forEach(function(s, i){ idx[s.mes] = i; });
    todas.forEach(function(o){
      const i = idx[chaveMes(o.data)];
      if (i === undefined) return;
      const s = serie[i], t = norm(o.tipo);
      s.todas++;
      if (GRAVES.indexOf(t) >= 0) s.graves++;
      if (t === "falta") s.faltas++;
      if (t === "atraso") s.atrasos++;
      if (!s._p[norm(o.funcionario)]){ s._p[norm(o.funcionario)] = 1; s.pessoas++; }
    });
    return serie;
  }

  /* ---------- Ocorrências por mês ---------- */
  function linhas(todas){
    const area = $("prLinhas"), s = ultimos12(todas);
    if (!s.some(function(m){ return m.todas; })){ area.innerHTML = '<div class="pa-vazio">Sem ocorrências nos últimos 12 meses.</div>'; return; }
    const W = Math.max(320, area.clientWidth || 800), H = 330, m = { e:44, d:14, t:16, b:32 };
    const larg = W - m.e - m.d, alt = H - m.t - m.b, n = s.length;
    const topo = escala(Math.max.apply(null, s.map(function(v){ return v.todas; })));
    const x = function(i){ return m.e + larg * i / (n - 1); };
    const y = function(v){ return m.t + alt - alt * v / topo; };
    const lT = curva(s.map(function(v, i){ return { x:x(i), y:y(v.todas) }; }));
    const lG = curva(s.map(function(v, i){ return { x:x(i), y:y(v.graves) }; }));
    const base = "L" + x(n - 1).toFixed(1) + "," + y(0) + "L" + x(0).toFixed(1) + "," + y(0) + "Z";

    let svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" height="' + H + '" role="img" aria-label="Ocorrências por mês"><defs>' +
      '<linearGradient id="prGT" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="' + COR.s1 + '" stop-opacity=".22"/><stop offset="100%" stop-color="' + COR.s1 + '" stop-opacity="0"/></linearGradient></defs>';
    for (let i = 0; i <= 4; i++){
      const yy = y(topo * i / 4).toFixed(1);
      svg += '<line class="grade" x1="' + m.e + '" x2="' + (W - m.d) + '" y1="' + yy + '" y2="' + yy + '"/><text class="eixo" x="' + (m.e - 10) + '" y="' + (Number(yy) + 4) + '" text-anchor="end">' + inteiro(topo * i / 4) + '</text>';
    }
    const salto = Math.max(1, Math.ceil(n / Math.max(1, Math.floor(larg / 64))));
    s.forEach(function(v, i){ if (!(i % salto) || i === n - 1) svg += '<text class="eixo" x="' + x(i).toFixed(1) + '" y="' + (H - 8) + '" text-anchor="middle">' + nomeMes(v.mes) + '</text>'; });
    svg += '<path class="pa-pre" d="' + lT + base + '" fill="url(#prGT)" style="opacity:0;transition:opacity 1.2s .5s"/>' +
      '<path class="linha" d="' + lG + '" stroke="' + COR.s2 + '"/><path class="linha" d="' + lT + '" stroke="' + COR.s1 + '"/>' +
      '<line class="cruz" id="prCruz" y1="' + m.t + '" y2="' + (m.t + alt) + '"/>' +
      '<circle class="ponto" id="prPG" r="6" fill="' + COR.s2 + '"/><circle class="ponto" id="prPT" r="6" fill="' + COR.s1 + '"/>' +
      '<rect id="prAlvo" x="' + m.e + '" y="' + m.t + '" width="' + larg + '" height="' + alt + '" fill="transparent"/></svg>';
    area.innerHTML = svg;
    area.querySelectorAll("path.linha").forEach(function(p, i){ desenharTraco(p, i * 0.18); });
    depois(function(){ area.querySelector(".pa-pre").style.opacity = 1; });

    const alvo = $("prAlvo");
    alvo.addEventListener("mousemove", function(e){
      const r = alvo.getBoundingClientRect();
      const i = Math.max(0, Math.min(n - 1, Math.round((e.clientX - r.left) / r.width * (n - 1)))), v = s[i];
      area.classList.add("focado");
      $("prCruz").setAttribute("x1", x(i)); $("prCruz").setAttribute("x2", x(i));
      $("prPT").setAttribute("cx", x(i)); $("prPT").setAttribute("cy", y(v.todas));
      $("prPG").setAttribute("cx", x(i)); $("prPG").setAttribute("cy", y(v.graves));
      dica(e, "<b>" + nomeMes(v.mes, true) + "</b>" + linhaDica(COR.s1, "Todas", inteiro(v.todas)) + linhaDica(COR.s2, "Graves", inteiro(v.graves)) +
        linhaDica("", "Faltas", inteiro(v.faltas)) + linhaDica("", "Atrasos", inteiro(v.atrasos)) + linhaDica("", "Funcionários", inteiro(v.pessoas)));
    });
    alvo.addEventListener("mouseleave", function(){ area.classList.remove("focado"); semDica(); });
  }

  /* ---------- Rankings ---------- */
  function ranking(alvo, lista, cor, total, subtexto){
    const caixa = $(alvo);
    if (!lista.length){ caixa.innerHTML = '<div class="pa-vazio">Sem ocorrências no período.</div>'; return; }
    const max = Math.max.apply(null, lista.map(function(r){ return r.valor; }));
    caixa.innerHTML = lista.map(function(r, i){
      const sub = (subtexto ? subtexto(r) + " · " : "") + Math.round(r.valor / Math.max(1, total) * 100) + "% do total";
      return '<div class="pa-rank"><span class="pos">' + (i + 1) + '</span><span class="nome" title="' + esc(r.nome) + '">' + esc(r.nome) + '</span>' +
        '<span class="vl">' + inteiro(r.valor) + '</span>' +
        '<span class="trilho"><span class="cheio ' + cor + '" data-l="' + (r.valor / max * 100).toFixed(1) + '" style="transition-delay:' + (0.3 + i * 0.08) + 's"></span></span>' +
        '<span class="sub">' + sub + '</span></div>';
    }).join("");
    depois(function(){ caixa.querySelectorAll(".cheio").forEach(function(b){ b.style.width = b.dataset.l + "%"; }); });
  }

  /* ---------- Colunas (horário e dia da semana) ---------- */
  function horas(lista){
    const cont = {};
    lista.forEach(function(o){ const m = o.hora.match(/^(\d{1,2})/); if (m) cont[Number(m[1])] = (cont[Number(m[1])] || 0) + 1; });
    const hs = Object.keys(cont).map(Number);
    if (!hs.length) return [];
    const ini = Math.min(6, Math.min.apply(null, hs)), fim = Math.max(18, Math.max.apply(null, hs));
    const r = [];
    for (let h = ini; h <= fim; h++) r.push({ rotulo:h + "h", valor:cont[h] || 0, longo:String(h).padStart(2, "0") + ":00 – " + String(h).padStart(2, "0") + ":59" });
    return r;
  }
  function diasSemana(lista){
    const cont = [0, 0, 0, 0, 0, 0, 0];
    lista.forEach(function(o){ cont[o.data.getDay()]++; });
    return [1, 2, 3, 4, 5, 6, 0].map(function(d){ return { rotulo:SEMANA[d], valor:cont[d], longo:["Domingo", "Segunda", "Terça", "Quarta", "Quinta", "Sexta", "Sábado"][d] }; });
  }

  function colunas(alvo, s, idPico){
    const area = $(alvo);
    const maior = s.reduce(function(a, b){ return b.valor > a.valor ? b : a; }, { valor:0 });
    $(idPico).textContent = maior.valor ? "▲ Pico: " + maior.longo.split(" –")[0] + " · " + plural(maior.valor, "ocorrência", "ocorrências") : "";
    if (!maior.valor){ area.innerHTML = '<div class="pa-vazio">Sem dados no período.</div>'; return; }

    const W = Math.max(280, area.clientWidth || 420), H = 250, m = { e:34, d:4, t:22, b:28 };
    const larg = W - m.e - m.d, alt = H - m.t - m.b, topo = escala(maior.valor);
    const banda = larg / s.length, bw = Math.max(4, Math.min(34, banda * 0.66));
    const y = function(v){ return m.t + alt - alt * v / topo; };
    let svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" height="' + H + '" role="img" aria-label="Distribuição das ocorrências"><defs>' +
      '<linearGradient id="' + alvo + 'G" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#656565"/><stop offset="100%" stop-color="#656565"/></linearGradient></defs>';
    for (let i = 0; i <= 4; i++){
      const yy = y(topo * i / 4).toFixed(1);
      svg += '<line class="grade" x1="' + m.e + '" x2="' + (W - m.d) + '" y1="' + yy + '" y2="' + yy + '"/><text class="eixo" x="' + (m.e - 8) + '" y="' + (Number(yy) + 4) + '" text-anchor="end">' + inteiro(topo * i / 4) + '</text>';
    }
    const salto = Math.max(1, Math.ceil(s.length / Math.max(1, Math.floor(larg / 30))));
    ref[alvo] = s;
    s.forEach(function(v, i){
      const cx = m.e + banda * i + banda / 2, h = alt * v.valor / topo, top = m.t + alt - h, r = Math.min(4, bw / 2, h);
      if (h > 0){
        const d = "M" + (cx - bw / 2) + "," + (m.t + alt) + "V" + (top + r) + "Q" + (cx - bw / 2) + "," + top + " " + (cx - bw / 2 + r) + "," + top +
          "H" + (cx + bw / 2 - r) + "Q" + (cx + bw / 2) + "," + top + " " + (cx + bw / 2) + "," + (top + r) + "V" + (m.t + alt) + "Z";
        svg += '<path class="pa-col" d="' + d + '" fill="' + (v === maior ? "url(#" + alvo + "G)" : "rgba(42,120,214,.32)") + '" style="transition-delay:' + (i * 0.03).toFixed(2) + 's"/>';
      }
      svg += '<rect x="' + (m.e + banda * i) + '" y="' + m.t + '" width="' + banda + '" height="' + alt + '" fill="transparent" class="pr-alvo" data-i="' + i + '"/>';
      if (!(i % salto) || i === s.length - 1) svg += '<text class="eixo" x="' + cx + '" y="' + (H - 8) + '" text-anchor="middle">' + v.rotulo + '</text>';
    });
    area.innerHTML = svg + '</svg>';
    area.querySelectorAll(".pr-alvo").forEach(function(a){
      a.addEventListener("mousemove", function(e){
        const v = ref[alvo][Number(a.dataset.i)];
        dica(e, "<b>" + v.longo + "</b>" + linhaDica(COR.s1, "Ocorrências", inteiro(v.valor)));
      });
      a.addEventListener("mouseleave", semDica);
    });
    area.classList.remove("pronto");
    depois(function(){ area.classList.add("pronto"); });
  }

  function ultimas(lista){
    const caixa = $("prUltimas");
    const ult = lista.slice().sort(function(a, b){ return b.data - a.data || String(b.hora).localeCompare(String(a.hora)); }).slice(0, 6);
    if (!ult.length){ caixa.innerHTML = '<div class="pa-vazio">Sem ocorrências no período.</div>'; return; }
    caixa.innerHTML = ult.map(function(o){
      const classe = o.tipo.replace(/\s+/g, "").normalize("NFD").replace(/[̀-ͯ]/g, "");
      return '<div class="linha"><span class="nome" title="' + esc(o.observacao) + '">' + esc(o.funcionario) + '</span>' +
        '<span class="tag ' + esc(classe) + '">' + esc(o.tipo) + '</span>' +
        '<span class="sub-linha">' + o.data.toLocaleDateString("pt-BR", { day:"2-digit", month:"2-digit" }) + (o.hora ? " · " + esc(o.hora) : "") + " · " + esc(o.setor) + '</span></div>';
    }).join("");
  }

  document.addEventListener("keydown", function(e){ if (e.key === "Escape" && $("painelRH").classList.contains("aberto")) fechar(); });
  let espera = null;
  window.addEventListener("resize", function(){
    if (!$("painelRH").classList.contains("aberto")) return;
    clearTimeout(espera); espera = setTimeout(desenhar, 200);
  });

  return { abrir:abrir, fechar:fechar, periodo:periodo };
})();
</script>
</body>
