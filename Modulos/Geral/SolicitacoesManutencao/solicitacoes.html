<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Solicitação de manutenção</title><script src="../../../js/core/limpezaDados.js?v=20261026"></script><script src="../../../js/core/themePrepaint.js"></script><link rel="stylesheet" href="../../../styles/global.css?v=20261024-abas-globais"><link rel="stylesheet" href="../SolicitacoesCompra/solicitacoes.css?v=20261023-status-prazo"><link rel="stylesheet" href="solicitacoes.css?v=20261023"></head><body><main class="el-page solicitacoes-page predial-page">
<header><div><h1>Solicitação de manutenção</h1></div><button id="novaSolicitacao" class="btn btn-primary" type="button" disabled>+ Nova solicitação</button></header>
<div class="predial-filtros"><input id="busca" type="search" placeholder="Buscar problema, local ou responsável" aria-label="Buscar solicitações"><select id="filtroStatus" aria-label="Situação"><option value="abertas">Em aberto</option><option value="todas">Todas as situações</option><option value="aberta">Solicitada</option><option value="analise">Em análise</option><option value="agendada">Agendada</option><option value="execucao">Em execução</option><option value="concluida">Concluída</option><option value="cancelada">Cancelada</option></select><select id="filtroPrioridade" aria-label="Prioridade"><option value="">Todas as prioridades</option><option value="urgente">Urgente</option><option value="alta">Alta</option><option value="normal">Normal</option><option value="baixa">Baixa</option></select></div>
<p id="retorno" role="status"></p><section class="solicitacoes-tabela"><table><thead><tr><th>Número</th><th>Problema</th><th>Local</th><th>Prioridade</th><th class="solicitacao-prazo text-danger">Necessário até</th><th>Solicitante</th><th>Situação</th><th>Responsável</th><th></th></tr></thead><tbody id="solicitacoes"></tbody></table><p id="vazio" hidden>Nenhuma solicitação nesta situação.</p></section>
<dialog id="solicitacaoDialog"><form id="solicitacaoForm"><header><h2>Solicitar manutenção da estrutura</h2><button type="button" data-fechar aria-label="Fechar">×</button></header><div class="solicitacoes-campos">
<label class="inteira">O que precisa de manutenção?<input name="titulo" placeholder="Ex.: vazamento no banheiro do galpão" required minlength="3" maxlength="200"></label><label>Local dentro da empresa<input name="local" placeholder="Ex.: galpão 2 · banheiro" required minlength="2" maxlength="200"></label><label>Tipo de serviço<select name="categoria"><option value="hidraulica">Hidráulica · vazamentos e encanamento</option><option value="eletrica">Elétrica · iluminação e tomadas</option><option value="alvenaria">Alvenaria · paredes e telhado</option><option value="pintura">Pintura da estrutura</option><option value="portas_janelas">Portas e janelas</option><option value="climatizacao">Climatização e ventilação</option><option value="outros" selected>Outro serviço</option></select></label><label>Prioridade<select name="prioridade"><option value="baixa">Baixa</option><option value="normal" selected>Normal</option><option value="alta">Alta</option><option value="urgente">Urgente</option></select></label><label>Necessário até (opcional)<input name="necessario_ate" type="date"></label><label class="inteira">Descrição do problema<textarea name="descricao" placeholder="Descreva o problema e o serviço necessário." rows="4" required minlength="5" maxlength="5000"></textarea></label></div>
<p id="erroSolicitacao" role="alert"></p><footer><button type="button" data-fechar>Cancelar</button><button class="btn btn-primary" type="submit">Enviar solicitação</button></footer></form></dialog>
<dialog id="atendimentoDialog"><form id="atendimentoForm"><header><h2 id="atendimentoTitulo">Solicitação</h2><button type="button" data-fechar aria-label="Fechar">×</button></header><div id="atendimentoDados"></div><p id="erroAtendimento" role="alert"></p><footer><button type="button" data-fechar>Fechar</button><button id="salvarAtendimento" class="btn btn-primary" type="submit">Salvar atendimento</button></footer></form></dialog>
</main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0"></script><script src="../../../js/core/supabase.js"></script><script src="../../../js/core/context.js?v=20261026-limpeza"></script><script src="../../../js/core/permissions.js?v=20261023-predial"></script><script src="../../../js/core/alerta.js"></script><script src="../../../js/core/companyTheme.js"></script><script type="module" src="solicitacoes.mjs?v=20261023-confirmacao"></script><script src="../../../js/core/moduleTheme.js?v=20261025-mascaras"></script></body></html>
