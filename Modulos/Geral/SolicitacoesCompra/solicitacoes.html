<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Solicitação de compra</title><script src="../../../js/core/limpezaDados.js?v=20261026"></script><script src="../../../js/core/themePrepaint.js"></script><link rel="stylesheet" href="../../../styles/global.css?v=20261024-abas-globais"><link rel="stylesheet" href="solicitacoes.css?v=20261023-status-prazo"><link rel="stylesheet" href="../../../styles/assistente-solicitacao.css?v=20261106-ia3"></head><body><main class="el-page solicitacoes-page">
<header><div><h1>Solicitação de compra</h1></div><button id="novaSolicitacao" class="btn btn-primary" type="button">+ Nova solicitação</button></header>
<p id="retorno" role="status"></p><section class="solicitacoes-tabela"><table><thead><tr><th>Número</th><th>Material</th><th>Quantidade</th><th class="solicitacao-prazo text-danger">Necessário até</th><th>Solicitante</th><th>Situação</th></tr></thead><tbody id="solicitacoes"></tbody></table><p id="vazio" hidden>Nenhuma solicitação enviada.</p></section>
<dialog id="solicitacaoDialog"><form id="solicitacaoForm"><header><h2>Nova solicitação de compra</h2><button type="button" data-fechar aria-label="Fechar">×</button></header><div class="solicitacoes-campos">
<label class="inteira">Material / descrição<input name="descricao_item" required maxlength="500"></label><label>Quantidade<input name="quantidade" type="number" min="0.01" step="0.01" required></label><label>Unidade<input name="unidade" value="un" required maxlength="20"></label><label>Necessário até<input name="data_necessidade" type="date"></label><label class="inteira">Link do produto (opcional)<input name="produto_url" type="url" placeholder="https://..."></label><label class="inteira">Observação<textarea name="observacao" rows="3" maxlength="3000"></textarea></label>
</div><p id="erroSolicitacao" role="alert"></p><footer><button type="button" data-fechar>Cancelar</button><button class="btn btn-primary" type="submit">Enviar para Compras</button></footer></form></dialog>
</main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0"></script><script src="../../../js/core/supabase.js"></script><script src="../../../js/core/context.js?v=20261026-limpeza"></script><script src="../../../js/core/permissions.js?v=20261023-solicitacoes"></script><script src="../../../js/core/alerta.js"></script><script src="../../../js/ui/assistente-solicitacao.js?v=20261106-ia"></script><script type="module" src="solicitacoes.mjs?v=20261106-ia"></script><script src="../../../js/core/companyTheme.js"></script><script src="../../../js/core/moduleTheme.js?v=20261025-mascaras"></script></body></html>
