<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acervo - Expedição</title>
  <link rel="icon" type="image/png" href="../../../logo%20nova%20-%20com%20fundo%20branco.png">
  <script src="../../../js/core/limpezaDados.js?v=20261026"></script><script src="../../../js/core/themePrepaint.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../../styles/global.css?v=20261024-abas-globais">
  <!-- Mesmo visual da Separação de Materiais (colunas, cartões, cabeçalho com busca) -->
  <link rel="stylesheet" href="../../Estoque/SeparacaoMateriais/separacao-materiais.css?v=20261107-teste-usuario">
  <link rel="stylesheet" href="expedicao.css?v=20261107-lista-sublocacao">
<script src="../../../js/core/pedidoFluxo.js?v=20261024-fluxo"></script>
</head>
<body class="triagem-compacta">
<section class="separacao-page el-page exp-page" data-module-root>
  <header class="separacao-header">
    <div class="exp-legenda" aria-label="Legenda de pend&#234;ncias">
      <span><i class="exp-pendencia-dot" aria-hidden="true"></i> Bloqueado &#183; passe o mouse na bolinha para ver o motivo</span>
    </div>
    <div class="separacao-title-block">
      <h1>Expedição</h1>
    </div>
    <label class="separacao-search" for="expBusca">
      <input id="expBusca" type="search" placeholder="Buscar pedido, cliente, evento ou local" autocomplete="off" data-lpignore="true" data-1p-ignore="true">
    </label>
  </header>

  <section class="separacao-board-card">
    <div class="separacao-kanban">
      <section class="separacao-lane separacao-lane-pendente">
        <header><div><h2>Aguardando conferência</h2></div><strong id="expContAguardando">0</strong></header>
        <div class="separacao-lane-list" id="expColAguardando"><div class="empty-state">Carregando…</div></div>
      </section>
      <section class="separacao-lane separacao-lane-andamento">
        <header><div><h2>Em conferência</h2></div><strong id="expContAndamento">0</strong></header>
        <div class="separacao-lane-list" id="expColAndamento"></div>
      </section>
      <section class="separacao-lane separacao-lane-separado">
        <header><div><h2>Aguardando entrega</h2></div><strong id="expContCarregados">0</strong></header>
        <div class="separacao-lane-list" id="expColCarregados"></div>
      </section>
      <section class="separacao-lane exp-lane-pendencias">
        <header><div><h2>Pendências</h2></div><strong id="expContPendencias">0</strong></header>
        <div class="separacao-lane-list" id="expColPendencias"></div>
      </section>
    </div>
  </section>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0"></script>
<script src="../../../js/core/supabase.js"></script>
<script src="../../../js/core/alerta.js"></script>
<script src="../../../js/core/companyTheme.js?v=20260913m"></script>
<script src="../../../js/core/context.js?v=20261026-limpeza"></script>
<script src="../../../js/core/permissions.js?v=20261019-painel-logistico"></script>
<script src="../../../js/ui/decorador-cards.js?v=20261103-exp-compacta"></script>
<script src="expedicao.js?v=20261107-lista-sublocacao"></script>
<script src="../../../js/core/moduleTheme.js?v=20261025-mascaras"></script>
</body>
</html>
