<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acervo - Expedição</title>
  <link rel="icon" type="image/png" href="../../../logo%20nova%20-%20com%20fundo%20branco.png">
  <script src="../../../js/core/themePrepaint.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../../styles/global.css?v=20261008-topo">
  <!-- Mesmo visual da Separação de Materiais (colunas, cartões, cabeçalho com busca) -->
  <link rel="stylesheet" href="../../Estoque/SeparacaoMateriais/separacao-materiais.css?v=20261018-centro">
  <link rel="stylesheet" href="expedicao.css?v=20261018-expedicao">
</head>
<body>
<section class="separacao-page el-page exp-page" data-module-root>
  <header class="separacao-header">
    <div class="separacao-title-block">
      <span class="separacao-kicker">Logística</span>
      <h1>Expedição</h1>
      <p>Carregamento dos pedidos separados.</p>
    </div>
    <label class="separacao-search" for="expBusca">
      <input id="expBusca" type="search" placeholder="Buscar pedido, cliente, evento ou local">
    </label>
  </header>

  <section class="separacao-board-card">
    <div class="separacao-kanban">
      <section class="separacao-lane separacao-lane-pendente">
        <header><div><span>Fila</span><h2>Aguardando carregamento</h2></div><strong id="expContAguardando">0</strong></header>
        <div class="separacao-lane-list" id="expColAguardando"><div class="empty-state">Carregando…</div></div>
      </section>
      <section class="separacao-lane separacao-lane-andamento">
        <header><div><span>Operação</span><h2>Em carregamento</h2></div><strong id="expContAndamento">0</strong></header>
        <div class="separacao-lane-list" id="expColAndamento"></div>
      </section>
      <section class="separacao-lane separacao-lane-separado">
        <header><div><span>Concluídos</span><h2>Carregados</h2></div><strong id="expContCarregados">0</strong></header>
        <div class="separacao-lane-list" id="expColCarregados"></div>
      </section>
    </div>
  </section>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../../js/core/supabase.js"></script>
<script src="../../../js/core/alerta.js"></script>
<script src="../../../js/core/companyTheme.js?v=20260913m"></script>
<script src="../../../js/core/context.js?v=20261009-acesso-estavel2"></script>
<script src="../../../js/core/permissions.js?v=20261017-parametros"></script>
<script src="expedicao.js?v=20261018-cores"></script>
</body>
</html>
