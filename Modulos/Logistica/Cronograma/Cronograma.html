<div class="cronograma-container el-page">
  <!-- Topbar -->
  <div class="topbar">

    <div class="title-wrap">
      <h1>Cronograma Logistico</h1>
      <p>Gerencie e visualize o cronograma de pedidos</p>
    </div>

    <div class="toolbar">
      <div class="week-nav">
        <button type="button" class="btn secondary" onclick="mudarSemana(-7)">Anterior</button>
        <div class="week-badge" id="weekLabel">Carregando semana...</div>
        <button type="button" class="btn secondary" onclick="mudarSemana(7)">Proxima</button>
      </div>
      <div class="toolbar-right">
        <select id="filtroEtapa" class="filter el-select" onchange="renderCronograma()">
          <option value="semAgenda" selected>Somente cronograma</option>
          <option value="comAgenda">Cronograma + Agenda interna</option>
          <option value="triagemAgenda">Triagem + Agenda interna</option>
          <option value="">Todas as etapas</option>
          <option value="Separacao">TRIAGEM</option>
          <option value="Carregamento">Carregamento</option>
          <option value="Montagem">Montagem</option>
          <option value="Desmontagem">Desmontagem</option>
        </select>
        <input id="filtroResponsavel" class="filter el-input" type="text" placeholder="Filtrar responsavel" oninput="renderCronograma()" />
        <input id="filtroCaminhao" class="filter el-input" type="text" placeholder="Filtrar caminhao" oninput="renderCronograma()" />
      </div>
    </div>

  </div>

  <!-- Tabela Cronograma -->
  <div class="board-wrap">
    <table class="board">
      <thead>
        <tr>
          <th>Pedido</th>
          <th id="th0">Ter</th>
          <th id="th1">Qua</th>
          <th id="th2">Qui</th>
          <th id="th3">Sex</th>
          <th id="th4">Sab</th>
          <th id="th5">Dom</th>
          <th id="th6">Seg</th>
        </tr>
      </thead>
      <tbody id="cronogramaBody">
        <tr>
          <td colspan="8" class="empty-state">Carregando cronograma...</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<div class="cronograma-preview-modal hidden" id="cronogramaPreviewModal" aria-hidden="true">
  <div class="cronograma-preview-box">
    <div class="cronograma-preview-header">
      <div>
        <span>Visualizacao do pedido</span>
        <h2 id="cronogramaPreviewTitulo">Pedido</h2>
      </div>
      <div class="cronograma-preview-actions">
        <button type="button" class="btn secondary" onclick="imprimirPreviewCronograma()">Imprimir</button>
        <button type="button" class="btn danger" onclick="fecharPreviewCronograma()">Fechar</button>
      </div>
    </div>
    <div class="cronograma-preview-body" id="cronogramaPreviewBody"></div>
  </div>
</div>
