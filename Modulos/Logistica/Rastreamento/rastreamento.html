<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rastreamento · Logística</title>

<body><main class="rastreador" data-module-root><div id="mapa" aria-label="Mapa de localização da equipe"></div>
<header><h1>Rastreamento</h1><button id="enquadrar" type="button">Ver toda a equipe</button><button id="telaCheia" type="button">Tela cheia</button></header>
