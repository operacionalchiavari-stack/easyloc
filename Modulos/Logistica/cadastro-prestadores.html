<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cadastro e desempenho</title><script src="../../js/core/themePrepaint.js"></script><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="../../styles/global.css?v=20261107-titulos-30"><link rel="stylesheet" href="cadastro-prestadores.css?v=20261122-dados-compacto"></head><body>
<main class="container el-page prest-page"><div class="prest-topo"><nav class="prest-abas"><button class="ativo" data-aba="cadastros">Cadastros</button><button data-aba="parametros">Parâmetros e pontuações</button></nav><h1 id="titulo" class="prest-titulo">Cadastro de Free</h1><input id="busca" class="prest-busca-campo" type="search" placeholder="Buscar por nome ou telefone" aria-label="Buscar por nome ou telefone"></div><p id="aviso" class="prest-aviso" hidden></p>
<section id="cadastros" class="prest-layout"><aside id="lista" class="prest-lista"></aside><article id="ficha" class="prest-ficha"><div class="prest-vazio">Selecione uma pessoa para consultar a ficha.</div></article></section>
<section id="parametros" class="prest-parametros" hidden><header><div><h2>Regras da pontuação</h2><p>A nota começa em 10. Cada ocorrência reduz o peso definido aqui.</p></div><button id="novoParametro" class="prest-btn">+ Novo parâmetro</button></header><div id="listaParametros"></div></section></main>
<dialog id="modalOcorrencia" class="prest-modal"><form method="dialog"><header><h2>Registrar ocorrência</h2><button value="cancel" aria-label="Fechar">×</button></header><label>Motivo<select id="ocParametro"></select></label><label>Quantidade<input id="ocQuantidade" type="number" min="0.1" step="0.1" value="1"></label><label>Observação<textarea id="ocObservacao" rows="4" placeholder="Descreva o que aconteceu"></textarea></label><footer><button value="cancel" class="prest-btn claro">Cancelar</button><button type="button" id="salvarOcorrencia" class="prest-btn">Registrar e descontar</button></footer></form></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0"></script><script src="../../js/core/supabase.js"></script><script src="../../js/core/alerta.js"></script><script src="../../js/core/context.js?v=20261026-limpeza"></script><script src="cadastro-prestadores.js?v=20261122-dados-compacto"></script><script src="../../js/core/moduleTheme.js?v=20261114-autofill-email"></script></body></html>
