<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acervo - Inicializando</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../styles/global.css">

<style>
:root{
  --boot-brand:#2E1F1F;
  --boot-gold:#9f7a45;
  --boot-title:#1f2937;
  --boot-text:#6b7280;
  --boot-line:#eee9e5;
  --boot-track:#f1eeeb;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  width:100vw;
  min-height:100vh;
  overflow:hidden;
  font-family:'Inter',sans-serif;
  color:var(--boot-title);
  background:#ffffff;
  letter-spacing:0;
}

.boot-shell{
  width:100vw;
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:32px 22px;
  background:
    radial-gradient(circle at 50% 35%, rgba(46,31,31,.045), transparent 32%),
    #ffffff;
}

.boot-content{
  width:min(100%, 540px);
  text-align:center;
  display:flex;
  flex-direction:column;
  align-items:center;
}

.boot-wordmark{
  margin-bottom:26px;
  color:var(--boot-brand);
  font-size:clamp(24px, 3.1vw, 34px);
  font-weight:400;
  letter-spacing:.38em;
  line-height:1;
  text-indent:.38em;
}

.boot-greeting{
  margin:0 0 10px;
  color:var(--boot-gold);
  font-size:clamp(13px, 1.8vw, 15px);
  font-weight:600;
  line-height:1.35;
}

.boot-title{
  margin:0;
  color:var(--boot-title);
  font-size:clamp(24px, 3.2vw, 34px);
  font-weight:650;
  line-height:1.08;
}

.boot-subtitle{
  margin:11px 0 0;
  color:var(--boot-text);
  font-size:clamp(13px, 1.8vw, 15px);
  line-height:1.6;
}

.boot-progress{
  position:relative;
  width:min(360px, 76vw);
  height:4px;
  margin-top:28px;
  overflow:hidden;
  border-radius:999px;
  background:var(--boot-track);
}

.boot-progress-fill{
  position:absolute;
  inset:0 auto 0 0;
  width:0%;
  overflow:hidden;
  border-radius:inherit;
  background:linear-gradient(90deg, var(--boot-brand), #7a5a34);
  transition:width .18s ease;
  box-shadow:0 0 22px rgba(46,31,31,.14);
}

.boot-progress-fill::after{
  content:"";
  position:absolute;
  inset:0;
  width:42%;
  background:linear-gradient(90deg, transparent, rgba(255,255,255,.65), transparent);
  animation:progressShine 1.35s ease-in-out infinite;
}

.boot-steps{
  width:min(540px, 92vw);
  display:flex;
  justify-content:center;
  gap:10px;
  margin-top:24px;
}

.boot-step{
  min-height:34px;
  display:inline-flex;
  align-items:center;
  gap:7px;
  padding:0 11px;
  border:1px solid transparent;
  border-radius:999px;
  color:#9ca3af;
  font-size:12px;
  font-weight:600;
  transition:color .28s ease, background .28s ease, border-color .28s ease, transform .28s ease;
}

.boot-step.active{
  color:var(--boot-brand);
  border-color:var(--boot-line);
  background:#fff;
  box-shadow:0 12px 28px rgba(46,31,31,.045);
  transform:translateY(-1px);
}

.boot-step.done{
  color:#6b7280;
}

.boot-step-icon{
  width:16px;
  height:16px;
  display:grid;
  place-items:center;
  border-radius:999px;
  background:#f6f3f1;
  color:currentColor;
}

.boot-step-icon svg{
  width:11px;
  height:11px;
  stroke:currentColor;
  stroke-width:2;
  fill:none;
}

@keyframes progressShine{
  from{ transform:translateX(-120%); }
  to{ transform:translateX(260%); }
}

@media(max-width:640px){
  .boot-shell{
    padding:28px 16px;
  }

  .boot-wordmark{
    margin-bottom:24px;
    font-size:23px;
    letter-spacing:.3em;
    text-indent:.3em;
  }

  .boot-steps{
    flex-direction:column;
    align-items:center;
    gap:8px;
  }

  .boot-step{
    width:min(100%, 280px);
    justify-content:center;
  }
}
</style>
</head>

<body>

<main class="boot-shell" aria-label="Carregando sistema">
  <div class="boot-content">
    <div class="boot-wordmark" id="logoContainer" aria-label="ACERVO">ACERVO</div>

    <p class="boot-greeting" id="bootGreeting">Ol&aacute;</p>

    <h1 class="boot-title" id="bootTitle">
      Preparando seu ambiente
    </h1>

    <p class="boot-subtitle" id="bootSubtitle">
      Carregando informacoes da sua operacao...
    </p>

    <div class="boot-progress" role="progressbar" aria-label="Progresso do carregamento" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div class="boot-progress-fill" id="bootProgress"></div>
    </div>

    <div class="boot-steps" aria-label="Etapas do carregamento">
      <div class="boot-step active" data-step="0">
        <span class="boot-step-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M4 4v6h6"></path><path d="M20 20v-6h-6"></path><path d="M20 9A8 8 0 0 0 6.7 5.1L4 10"></path><path d="M4 15a8 8 0 0 0 13.3 3.9L20 14"></path></svg>
        </span>
        Sincronizando dados
      </div>
      <div class="boot-step" data-step="1">
        <span class="boot-step-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"></path></svg>
        </span>
        Verificando acessos
      </div>
      <div class="boot-step" data-step="2">
        <span class="boot-step-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M3 5h18"></path><path d="M3 12h18"></path><path d="M3 19h18"></path></svg>
        </span>
        Montando seu painel
      </div>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../../js/core/supabase.js"></script>
<script src="../../../js/core/companyTheme.js"></script>
<script src="boot.js"></script>

</body>
</html>
