<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>EasyLoc - Inicializando</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#fbf4ef;
  font-family:'Inter',sans-serif;
  color:#0f2a44;
}

.boot-container{
  text-align:center;
  max-width:420px;
  padding:40px;
}

.boot-logo{
  width:140px;
  height:140px;
  margin:auto;
  border-radius:24px;
  background:#ffffff;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 20px 50px rgba(15,42,68,.08);
  margin-bottom:28px;
  overflow:hidden;
  transition:.3s ease;
}

.boot-logo img{
  max-width:80%;
  max-height:80%;
  object-fit:contain;
}

.boot-title{
  font-size:22px;
  font-weight:600;
  margin-bottom:10px;
}

.boot-subtitle{
  font-size:14px;
  opacity:.7;
  line-height:1.6;
}

.loader{
  margin-top:30px;
  display:flex;
  justify-content:center;
  gap:8px;
}

.dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#ff6a00;
  animation: bounce 1.2s infinite ease-in-out;
}

.dot:nth-child(2){ animation-delay:.2s; }
.dot:nth-child(3){ animation-delay:.4s; }

@keyframes bounce{
  0%,80%,100%{ transform:scale(0); opacity:.3;}
  40%{ transform:scale(1); opacity:1;}
}
</style>
</head>

<body>

<div class="boot-container">

  <div class="boot-logo" id="logoContainer">
    <!-- Logo dinâmica -->
  </div>

  <div class="boot-title" id="bootTitle">
    Preparando seu sistema
  </div>

  <div class="boot-subtitle" id="bootSubtitle">
    Aguarde alguns instantes...
  </div>

  <div class="loader">
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../../js/core/supabase.js"></script>
<script src="boot.js"></script>

<script>
const supabase = window.supabaseClient;

(async () => {

  // 🔐 Verifica sessão
  const { data:{ session } } = await supabase.auth.getSession();

  if(!session){
    window.location.href = "index.html";
    return;
  }

  // 👤 Usuário
const empresaId = sessionStorage.getItem("empresa_id");
const nomeUsuario = sessionStorage.getItem("usuario_nome");

if(!empresaId){
  window.location.href = "index.html";
  return;
}

const primeiroNome =
  nomeUsuario?.split(" ")[0] || "Usuário";

  // 🎯 Atualiza texto personalizado
  document.getElementById("bootTitle").innerHTML =
    `Olá, <strong>${primeiroNome}</strong> 👋`;

  document.getElementById("bootSubtitle").innerHTML =
    `Seu sistema está sendo pré-carregado.<br>
     Em instantes você terá acesso completo.`;

  // 🖼 Logo da empresa
  const logoContainer = document.getElementById("logoContainer");

  if(empresa?.logo_url){
    logoContainer.innerHTML =
      `<img src="${empresa.logo_url}">`;
  } else {
    logoContainer.innerHTML =
      `<div style="
        font-weight:700;
        font-size:22px;
        color:#0f2a44;">
        ${empresa?.nome || "EasyLoc"}
      </div>`;
  }

  // 🔥 Delay elegante
  setTimeout(()=>{
    window.location.href = "dashboard.html";
  }, 2200);

})();
</script>

</body>
</html>
