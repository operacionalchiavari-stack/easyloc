<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>EasyLoc - Inicializando</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../styles/global.css">

<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:'Inter',sans-serif;
  color:var(--color-sidebar, #0f2a44);
  background:var(--color-bg, #fffaf6);
}

.boot-container{
  text-align:center;
  max-width:420px;
  padding:40px;
}

.boot-logo{
  width:112px;
  height:112px;
  margin:auto;
  border-radius:22px;
  background:#ffffff;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 20px 50px rgba(15,42,68,.08);
  margin-bottom:24px;
  overflow:hidden;
  transition:.3s ease;
}

.boot-logo img{
  max-width:80%;
  max-height:80%;
  object-fit:contain;
}

.boot-title{
  font-size:21px;
  font-weight:600;
  margin-bottom:10px;
}

.boot-subtitle{
  font-size:14px;
  opacity:.72;
  line-height:1.6;
}

.loader{
  margin-top:26px;
  display:flex;
  justify-content:center;
  gap:8px;
}

.dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--color-primary, #ff6a00);
  animation:bounce 1.2s infinite ease-in-out;
}

.dot:nth-child(2){ animation-delay:.2s; }
.dot:nth-child(3){ animation-delay:.4s; }

@keyframes bounce{
  0%,80%,100%{ transform:scale(0); opacity:.3;}
  40%{ transform:scale(1); opacity:1;}
}
</style>
</head>

<body>

<div class="boot-container el-page">
  <div class="boot-logo" id="logoContainer"></div>

  <div class="boot-title" id="bootTitle">
    Preparando seu sistema
  </div>

  <div class="boot-subtitle" id="bootSubtitle">
    Aguarde alguns instantes...
  </div>

  <div class="loader">
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../../js/core/supabase.js"></script>
<script src="../../../js/core/companyTheme.js"></script>
<script src="boot.js"></script>

</body>
</html>
