<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acervo - Central de Pedidos</title>
  <link rel="icon" type="image/png" href="../../../logo%20nova%20-%20com%20fundo%20branco.png">
  <script src="../../../js/core/limpezaDados.js?v=20261026"></script><script src="../../../js/core/themePrepaint.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="../../../styles/global.css?v=20261024-abas-globais">
  <link rel="stylesheet" href="CentralPedidos.css?v=20261031-equipes">
  <link rel="stylesheet" href="../../../styles/planilha.css?v=20261030">
  <link rel="stylesheet" href="../comercial-relatorios.css?v=20261030c">
  <!-- Visualização do pedido = prévia do catálogo (cabeçalho, itens por ambiente, PDF). -->
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../Catalogo/catalogo-projetos.css?v=20261030-link-pagamento2">
  <link rel="stylesheet" href="../Catalogo/projeto-apresentacao.css?v=20261030-link-pagamento">
</head>
<body>
<div class="central-pedidos-page el-page" id="centralPedidosPage" data-module-root>
  <header class="el-page-header central-header">
    <div>
      <h1 class="el-page-title">Central de Pedidos</h1>
      <p>Consulta e gestao dos pedidos, eventos e contratos comerciais.</p>
    </div>
    <div class="el-page-actions central-actions-left">
      <!-- Tabelas de Preço fica aqui dentro (pedido do usuário), não no menu. data-module-href: some se a pessoa não tiver permissão (js/core/permissions.js?v=20261019-painel-logistico). -->
      <button type="button" class="btn btn-secondary" id="btnCatalogoCentral" title="Abrir o catálogo (F2) · pesquisar no catálogo (F4)" aria-keyshortcuts="F2">Catálogo <kbd class="central-kbd">F2</kbd></button>
      <button type="button" class="btn btn-secondary" id="btnTabelasPreco" data-module-href="../../Estoque/TabelasPreco/tabelas-preco.html">Tabelas de Preço</button>
      <button type="button" class="btn btn-secondary" id="btnFiltrosPedidos" aria-expanded="false" aria-controls="centralFiltrosPedidos">
        <i data-lucide="sliders-horizontal" aria-hidden="true"></i>
        Filtros
      </button>
    </div>
    <div class="el-page-actions central-actions-right">
      <button type="button" class="btn btn-primary" id="btnNovoPedidoCentral">Novo Pedido</button>
      <input type="search" class="el-input" id="pesquisaGeralPedidos" aria-label="Pesquisar pedidos" placeholder="Pesquisar pedido, cliente..." autocomplete="off" data-lpignore="true" data-1p-ignore="true">
    </div>
  </header>

  <section class="central-filters el-card" id="centralFiltrosPedidos" aria-label="Filtros de pedidos" hidden>
    <div class="el-field">
      <label>Cliente</label>
      <input type="search" class="el-input" id="filtroClientePedido" placeholder="Buscar cliente" autocomplete="off" data-lpignore="true" data-1p-ignore="true">
    </div>
    <div class="el-field">
      <label>Pedido</label>
      <input type="search" class="el-input" id="filtroNumeroPedido" placeholder="Numero" autocomplete="off" data-lpignore="true" data-1p-ignore="true">
    </div>
    <div class="el-field">
      <label>Local</label>
      <input type="search" class="el-input" id="filtroLocalPedido" placeholder="Local do evento" autocomplete="off" data-lpignore="true" data-1p-ignore="true">
    </div>
    <div class="el-field">
      <label>Comercial</label>
      <input type="search" class="el-input" id="filtroComercialPedido" placeholder="Responsavel" autocomplete="off" data-lpignore="true" data-1p-ignore="true">
    </div>
    <div class="el-field">
      <label>Status</label>
      <select class="el-select" id="filtroStatusPedido">
        <option value="">Todos</option>
        <option value="orcamento">Orçamento</option>
        <option value="pre_reserva">Pré-reserva</option>
        <option value="aprovado">Reservado</option>
        <option value="cancelado">Cancelado</option>
        <option value="pendente">Pendente</option>
        <option value="em_separacao">Em separação</option>
        <option value="separado">Separado</option>
        <option value="finalizado">Finalizado</option>
        <option value="catalogo_rascunho">Catálogo: em montagem</option>
        <option value="catalogo_pedido_enviado">Catálogo: pedido enviado</option>
      </select>
    </div>
    <div class="el-field">
      <label>Data Inicial</label>
      <input class="el-input" type="date" id="filtroDataInicialPedido">
    </div>
    <div class="el-field">
      <label>Data Final</label>
      <input class="el-input" type="date" id="filtroDataFinalPedido">
    </div>
  </section>

  <!-- Um botão por situação, com a contagem numa bolinha vermelha piscando; clicar filtra a lista.
       As pré-reservas ficam sempre no topo da lista. -->
  <div class="central-barra">
    <!-- Contas a receber fica dentro da Central (out/2026): troca a lista de pedidos pela visão das parcelas -->
    <div class="central-visao el-tabs" role="group" aria-label="O que ver">
      <button type="button" data-central-visao="pedidos" class="ativa" aria-pressed="true">Pedidos</button>
      <button type="button" data-central-visao="receber" aria-pressed="false">Contas a receber<span class="central-visao-badge" id="centralReceberBadge" hidden></span></button>
    </div>
    <div class="central-situacoes el-tabs" id="centralSituacoes" role="group" aria-label="Filtrar por situação"></div>
    <label class="central-ordem"><span>Ordenar por</span><select class="el-select" id="centralOrdem" aria-label="Ordenar a lista de pedidos"></select></label>
  </div>

  <section class="cr-page cr-embutido" id="centralContasReceber" aria-label="Contas a receber" hidden></section>

  <section class="central-list el-card" id="centralListaTabela">
    <div class="central-table-wrap">
      <table class="central-table">
        <colgroup>
          <col class="central-col-numero">
          <col class="central-col-cliente">
          <col class="central-col-local">
          <col class="central-col-data">
          <col class="central-col-data">
          <col class="central-col-data">
          <col class="central-col-fluxo">
          <col class="central-col-valor">
          <col class="central-col-acoes">
        </colgroup>
        <thead>
          <tr>
            <th>Numero</th>
            <th>Cliente</th>
            <th>Local</th>
            <th>Evento</th>
            <th>Entrega</th>
            <th>Coleta</th>
            <th>Fluxo</th>
            <th>Valor</th>
            <th>Acoes</th>
          </tr>
        </thead>
        <tbody id="centralPedidosTbody"></tbody>
      </table>
    </div>
  </section>

  <div class="central-whatsapp-modal hidden" id="centralWhatsappModal" aria-hidden="true">
    <div class="central-whatsapp-dialog" role="dialog" aria-modal="true" aria-labelledby="centralWhatsappTitulo">
      <div class="central-whatsapp-head">
        <div>
          <span>WhatsApp</span>
          <strong id="centralWhatsappTitulo">Enviar mensagem</strong>
        </div>
        <button type="button" class="central-icon-action" id="btnFecharWhatsappPedido" aria-label="Fechar">
          <i data-lucide="x"></i>
        </button>
      </div>
      <div class="central-whatsapp-body">
        <label>
          Cliente
          <input class="el-input" id="centralWhatsappCliente" readonly>
        </label>
        <label>
          Numero
          <input class="el-input" id="centralWhatsappTelefone" data-mascara="telefone" readonly>
        </label>
        <label class="central-whatsapp-message">
          Mensagem
          <textarea class="el-input" id="centralWhatsappMensagem" rows="5"></textarea>
        </label>
      </div>
      <div class="central-whatsapp-actions">
        <button type="button" class="btn btn-secondary" id="btnCancelarWhatsappPedido">Cancelar</button>
        <button type="button" class="btn btn-primary central-whatsapp-send" id="btnEnviarWhatsappPedido">
          <i data-lucide="send-horizontal"></i>
          Enviar WhatsApp
        </button>
      </div>
    </div>
  </div>

  <div class="central-cadastro-modal hidden" id="centralCadastroRelacionadoModal" aria-hidden="true">
    <div class="central-cadastro-dialog" role="dialog" aria-modal="true" aria-labelledby="centralCadastroRelacionadoTitulo">
      <div class="central-cadastro-head">
        <div>
          <span id="centralCadastroRelacionadoSubtitulo">Cadastro</span>
          <strong id="centralCadastroRelacionadoTitulo">Dados cadastrais</strong>
        </div>
        <button type="button" class="central-icon-action" id="btnFecharCadastroRelacionado" aria-label="Fechar">
          <i data-lucide="x"></i>
        </button>
      </div>
      <div class="central-cadastro-body" id="centralCadastroRelacionadoBody"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../../js/core/supabase.js"></script>
<script src="../../../js/core/alerta.js"></script>
<script src="../../../js/core/companyTheme.js?v=20260913m"></script>
<script src="../../../js/core/context.js?v=20261026-limpeza"></script>
<script src="../../../js/core/permissions.js?v=20261019-painel-logistico"></script>
<script src="../../../js/core/paymentPix.js?v=20261021-divisao"></script>
<script src="../../../js/core/linkPagamento.js?v=20261030-pedido-digital"></script>
<script src="../../../js/core/zapiMessaging.js?v=20261026-acentos"></script>
<script src="../comercial-relatorios.js?v=20261030"></script>
<script src="central-contas-receber.js?v=20261031-equipes"></script>
<link rel="stylesheet" href="../produtividade.css?v=20261031-acompanhamento-cores">
<script src="../produtividade.js?v=20261031-acompanhamento-cores"></script>
<script src="CentralPedidos.js?v=20261031-filtros-unificados"></script>
<script>lucide.createIcons();</script>
<script src="../../../js/core/moduleTheme.js?v=20261025-mascaras"></script>
</body>
</html>
