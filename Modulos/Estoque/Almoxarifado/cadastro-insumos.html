<div class="container el-page">

  <!-- HEADER -->
  <header class="page-header">
    <h1>Insumos Cadastrados</h1>
    <button type="button" class="btn primary" onclick="abrirModalAdicionarInsumo()">
      + Adicionar Insumo
    </button>
  </header>
  <div class="filtros-insumos">

  <input class="el-input"
    type="text"
    id="filtroInsumoTexto"
    placeholder="Pesquisar insumo..."
  />

  <select class="el-select" id="filtroCategoria">
    <option value="">Todas as categorias</option>
  </select>

  <select class="el-select" id="filtroStatus">
    <option value="">Todos os status</option>
    <option value="ativo">Ativo</option>
    <option value="inativo">Inativo</option>
  </select>

</div>


  <!-- TABELA -->
  <section class="table-wrapper">
    <table>
      <thead>
        <tr>
          <th>CÓDIGO</th>
          <th>INSUMO</th>
          <th>CATEGORIA</th>
          <th>MÍNIMO</th>
          <th>ESTOQUE</th>
          <th>UNIDADE</th>
          <th>FORNECEDOR PRINCIPAL</th>
          <th>STATUS</th>
        </tr>
      </thead>
      <tbody id="tabelaInsumos"></tbody>
    </table>
  </section>

</div>

<!-- ================= MODAL NOVO INSUMO ================= -->
<div class="modal hidden el-modal" id="modalAdicionarInsumo">
  <div class="modal-content large novo-insumo-layout el-modal__box">

    <!-- HEADER -->
    <div class="modal-header modal-header-inline">
      <h2>Adicionar insumo</h2>
      <input
        type="text"
        id="nomeInsumoGeradoTopo"
        class="nome-gerado-topo el-input"
        placeholder="Nome do insumo será gerado automaticamente"
        readonly
      >
    </div>

    <!-- CONTEÚDO -->
    <div class="novo-insumo-topo">

      <!-- COLUNA ESQUERDA -->
      <div class="novo-insumo-foto">

        <div class="foto-box">
          <img id="previewFoto" src="" alt="Foto do insumo">
          <div class="foto-placeholder">
            <strong>SEM FOTO</strong>
            <span>EasyLoc</span>
          </div>
        </div>

        <div class="foto-controls">
          <button type="button" onclick="zoomFoto(-0.1)">−</button>

          <label class="btn-inserir-foto">
            Inserir foto
            <input type="file" accept="image/*" onchange="previewNovaFoto(event)">
          </label>

          <button type="button" onclick="zoomFoto(0.1)">+</button>
        </div>

        <!-- LINHA ÚNICA DE CAMPOS -->
        <div class="linha-insumo-unica">
          <div class="form-group el-field">
            <label>Qtd por embalagem</label>
            <input class="el-input" type="number" id="quantidadeEmbalagem" placeholder="Ex: 1, 5, 18">
          </div>

          <div class="form-group el-field">
            <label>Estoque mínimo</label>
            <input class="el-input" type="number" id="novoMinimo">
          </div>

          <div class="form-group el-field">
            <label>Unidade</label>
            <select class="el-select" id="novaUnidade">
              <option>Unidade</option>
              <option>Kg</option>
              <option>Litro</option>
              <option>Metro</option>
            </select>
          </div>

          <div class="form-group el-field">
            <label>Categoria</label>
            <select class="el-select" id="novaCategoria">
              <option>Marcenaria</option>
              <option>Pintura</option>
              <option>Costura</option>
              <option>EPI</option>
              <option>Limpeza</option>
            </select>
          </div>
        </div>

      </div>

      <!-- COLUNA DIREITA -->
      <div class="novo-insumo-dados">

<div class="status-toggle-modern">
  <div 
    class="status-option"
    id="novoStatusAtivo"
    onclick="setNovoStatus('ativo')"
  >
    <span class="dot dot-green"></span>
    Ativo
  </div>

  <div 
    class="status-option"
    id="novoStatusInativo"
    onclick="setNovoStatus('inativo')"
  >
    <span class="dot dot-red"></span>
    Inativo
  </div>
</div>



        <div class="form-group el-field">
          <label>Tipo de produto</label>
          <input class="el-input" id="tipoProduto" placeholder="Ex: Cola, Parafuso, Tinta">
        </div>

        <div class="form-group el-field">
          <label>Especificação</label>
          <input class="el-input" id="especificacaoProduto" placeholder="Ex: PVA, Fosca, 10mm">
        </div>

        <div class="form-group el-field">
          <label>Marca</label>
          <input class="el-input" id="marcaProduto" placeholder="Ex: Cascola, Suvinil">
        </div>

        <div class="form-group el-field">
          <label>Cor (opcional)</label>
          <input class="el-input" id="corProduto" placeholder="Ex: Branco, Preto">
        </div>

      </div>
    </div>

    <!-- FOOTER -->
    <div class="modal-actions modal-footer-right">
      <button type="button" class="btn secondary" onclick="fecharModalAdicionar()">Cancelar</button>
      <button type="button" class="btn primary" onclick="salvarNovoInsumo()">Salvar insumo</button>
    </div>

   </div>
</div>

<!-- ================= MODAL DETALHE INSUMO ================= -->
<div class="modal hidden el-modal" id="modalDetalheInsumo">
  <div class="modal-content large el-modal__box">

    <!-- TOPO -->
    <div class="insumo-topo">

<div class="novo-insumo-foto">

  <div class="foto-box">
    <img id="detalheFoto" src="" alt="Foto do insumo">
    <div class="foto-placeholder">
      <strong>SEM FOTO</strong>
      <span>EasyLoc</span>
    </div>
  </div>

  <div class="foto-controls">
    <button type="button" onclick="zoomFotoDetalhe(-0.1)">−</button>

    <label class="btn-inserir-foto">
      Inserir foto
      <input type="file" accept="image/*" onchange="previewFotoDetalhe(event)">
    </label>

    <button type="button" onclick="zoomFotoDetalhe(0.1)">+</button>
  </div>

</div>


      <!-- DADOS -->
      <div style="flex:1;">
        <h2 id="detalheNome">Nome do Insumo</h2>

<div class="status-toggle-modern">
  <div 
    class="status-option"
    id="detalheStatusAtivo"
    onclick="setStatusDetalhe('ativo')"
  >
    <span class="dot dot-green"></span>
    Ativo
  </div>

  <div 
    class="status-option"
    id="detalheStatusInativo"
    onclick="setStatusDetalhe('inativo')"
  >
    <span class="dot dot-red"></span>
    Inativo
  </div>
</div>


        <div class="kpi-grid" style="margin-top:16px;">
          <div class="kpi-card">
            <div class="kpi-label">Último preço</div>
            <div class="kpi-value" id="kpiUltimo">—</div>
            <div class="kpi-sub" id="kpiUltimoFornecedor">—</div>
          </div>

          <div class="kpi-card">
            <div class="kpi-label">Preço médio</div>
            <div class="kpi-value" id="kpiMedio">—</div>
            <div class="kpi-sub">Histórico</div>
          </div>

          <div class="kpi-card destaque">
            <div class="kpi-label">Menor preço</div>
            <div class="kpi-value" id="kpiMenor">—</div>
            <div class="kpi-sub" id="kpiMenorFornecedor">—</div>
          </div>
        </div>
      </div>




    </div>

    <!-- HISTÓRICO -->
    <div class="inner-table">
      <table>
        <thead>
          <tr>
            <th>Data</th>
            <th>Fornecedor</th>
            <th>Valor</th>
          </tr>
        </thead>
        <tbody id="historicoPrecos"></tbody>
      </table>
    </div>

    <!-- CÓDIGO DE BARRAS -->
<div class="barcode-wrapper">
  <svg id="barcode"></svg>
  <div id="barcodeTexto"></div>
</div>

<div class="modal-actions">
  <button type="button" class="btn secondary" onclick="fecharModalDetalhe()">
    Cancelar
  </button>

  <button type="button" class="btn primary" onclick="salvarAlteracoesDetalhe()">
    Salvar
  </button>
</div>





</div>
</div>
