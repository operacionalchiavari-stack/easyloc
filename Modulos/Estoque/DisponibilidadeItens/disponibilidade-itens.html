<div class="dispon-page el-page" data-module="disponibilidade-itens">
  <div id="disponLista" class="dispon-list-view">
  <!-- Título no centro; à esquerda os filtros Data e Buscar item, à direita como ver as reservas (out/2026).
       O título é o primeiro filho do cabeçalho (o tema reconhece a faixa); a posição vem da grade no CSS. -->
  <header class="dispon-hero dispon-hero-linha">
    <div class="dispon-hero-titulo">
      <span class="dispon-eyebrow">Estoque</span>
      <h1>Disponibilidade de Itens</h1>
      <p>Compare estoque total, reservas por data, manutencao e quantidade disponivel para venda.</p>
    </div>
    <div class="dispon-filters dispon-hero-filtros">
      <label>De
        <input class="el-input" type="date" id="disponData">
      </label>
      <label>Até
        <input class="el-input" type="date" id="disponDataFim">
      </label>
    </div>
    <div class="dispon-hero-dir dispon-hero-busca">
      <label>Buscar item
        <input class="el-input" id="disponBusca" placeholder="Nome ou código" title="Busca pelo nome, código ou categoria">
      </label>
    </div>
  </header>

  <!-- Filtros numa linha simples (18/11/2026). As opções vêm dos itens cadastrados. -->
  <div class="dispon-filtros-linha" role="group" aria-label="Filtros">
    <select class="el-select" id="disponCategoria" aria-label="Categoria"><option value="">Categoria</option></select>
    <select class="el-select" id="disponSubcategoria" aria-label="Subcategoria"><option value="">Subcategoria</option></select>
    <select class="el-select" id="disponCor" aria-label="Cor"><option value="">Cor</option></select>
    <select class="el-select" id="disponMaterial" aria-label="Material"><option value="">Material</option></select>
    <select class="el-select" id="disponEstilo" aria-label="Estilo"><option value="">Estilo</option></select>
    <select class="el-select" id="disponSetor" aria-label="Setor do estoque"><option value="">Setor</option></select>
    <select class="el-select" id="disponTipo" aria-label="Tipo"><option value="">Tipo</option><option value="Item">Item</option><option value="Kit">Kit</option><option value="Componente">Componente</option></select>
    <select class="el-select" id="disponStatus" aria-label="Situação"><option value="">Situação</option><option value="disponivel">Disponível</option><option value="atencao">Atenção</option><option value="indisponivel">Indisponível</option></select>
    <select class="el-select" id="disponReserva" aria-label="Reservas"><option value="">Reservas</option><option value="com">Com reserva no período</option><option value="sem">Sem reserva no período</option></select>
    <button type="button" class="dispon-filtros-limpar" id="disponLimparFiltros" hidden>Limpar filtros</button>
  </div>

  <p class="dispon-periodo-ajuda" id="disponErro" role="alert" hidden></p>
  <section class="dispon-card">
    <div class="dispon-table-wrap">
      <table>
        <thead>
          <tr id="disponCabecalho">
            <th>Foto</th>
            <th>Item</th>
            <th>Categoria</th>
            <th class="dispon-quantity-cell">Total</th>
            <th class="dispon-quantity-cell">Reservado na data</th>
            <th class="dispon-quantity-cell">Manutenção</th>
            <th class="dispon-quantity-cell">Disponível</th>
          </tr>
        </thead>
        <tbody id="disponTabela"></tbody>
      </table>
    </div>
    <button type="button" id="disponMais" class="dispon-infinite-sentinel" aria-live="polite" hidden>Carregar mais itens</button>
  </section>

  </div>

</div>
