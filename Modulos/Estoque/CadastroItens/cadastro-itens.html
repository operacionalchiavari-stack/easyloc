<div class="container el-page">

  <!-- ================= HEADER ================= -->
  <div class="header-list">
    <h2>Itens Cadastrados</h2>

<div class="header-actions">


  <button type="button" class="add-btn btn primary" onclick="itens_openAdd()">+ Adicionar Item</button>

  <button type="button" class="add-btn outline btn secondary" onclick="kits_openAdd()">🧩 Montar Kit</button>


</div>


  </div>


  <!-- ================= FILTROS ================= -->
  <div class="filters">
    <input class="el-input"
      id="itensSearchInput"
      placeholder="Pesquisar item..."
      oninput="itens_aplicarFiltros()"
    >

    <select class="el-select" id="itensTipoFilter" onchange="itens_aplicarFiltros()">
      <option value="">Todos os tipos</option>
      <option value="Item">Item</option>
      <option value="Componente">Componente</option>
      <option value="Kit">Kit</option>
    </select>

    <select class="el-select" id="itensCategoriaFilter" onchange="itens_aplicarFiltros()">
      <option value="">Todas as categorias</option>
    </select>

    <select class="el-select" id="itensStatusFilter" onchange="itens_aplicarFiltros()">
      <option value="">Todos os status</option>
      <option value="Ativo">Ativo</option>
      <option value="Inativo">Inativo</option>
    </select>
  </div>

<!-- ================= TABELA ================= -->
<table class="itens-table" id="itensTable">
<thead>
  <tr>
    <th style="width:70px;">Foto</th>
    <th style="width:80px;">Código</th>
    <th style="width:120px;">Tipo</th>
    <th>Item</th>
    <th style="width:140px;">Setor</th>
    <th style="width:140px;">Valor</th>
    <th style="width:90px;">Estoque</th>
    <th style="width:110px;">Status</th>
  </tr>
</thead>

  <tbody id="itensTableBody">
    <!-- JS vai popular -->
  </tbody>
</table>



<!-- ================= MODAL ITENS ================= -->
<div class="modal el-modal" id="itensModal">
  <div class="modal-content el-modal__box">

    <input type="hidden" id="itensId">

<!-- ===== HEADER ===== -->
<div class="modal-header-item modal-header-fixed modal-header-horizontal">

  <!-- LINHA ÚNICA: TÍTULO + DESCRIÇÃO -->
  <div class="header-line header-line-inline">

    <h3 class="modal-title">Detalhes do Item</h3>

<input
  id="itensDescricaoTotal"
  class="header-desc-total el-input"
  placeholder="Gerado automaticamente"
  readonly
  tabindex="-1"
>


  </div>

  <!-- BOTÃO EDITAR -->
  <button type="button"
    class="edit-btn edit-btn-top"
    onclick="itens_enableEdit()"
    title="Editar item">
    ✏️
  </button>

</div>

    <!-- ===== CONTEÚDO ===== -->
<div class="item-layout item-layout-advanced">

  <!-- FOTO -->
<!-- FOTO COM GUIA PADRÃO -->
<div class="item-foto-box">

<div class="foto-guia-container el-page">

  <div class="foto-preview-wrapper">
    <img
      id="itensFotoPreview"
      src="https://awemuohtvwvrdzfxwrmd.supabase.co/storage/v1/object/public/logos/placeholders/sem-foto.png"
      data-placeholder="https://awemuohtvwvrdzfxwrmd.supabase.co/storage/v1/object/public/logos/placeholders/sem-foto.png"
      alt="Sem foto"
      draggable="false"
    >
  </div>

  <!-- INPUT REAL (OBRIGATÓRIO) -->
<input
  type="file"
  id="itensFotoInput"
  accept="image/*"
  hidden
>

  <div class="foto-guia"></div>

</div>

<div class="foto-controles">

<button
  class="btn-zoom"
  type="button"
  onmousedown="itens_startZoom(1)"
  onmouseup="itens_stopZoom()"
  onmouseleave="itens_stopZoom()">
  +
</button>

  <button
    class="btn-foto"
    type="button"
    onclick="itens_selecionarFoto()">
    Inserir foto
  </button>

<button
  class="btn-zoom"
  type="button"
  onmousedown="itens_startZoom(-1)"
  onmouseup="itens_stopZoom()"
  onmouseleave="itens_stopZoom()">
  −
</button>
</div>


</div>


  <!-- LATERAL (APENAS LINHA 1 e 2) -->
<!-- LATERAL (TOGGLE + LINHAS 1 e 2) -->
<div class="item-side-form">

  <!-- TOGGLE ITEM / COMPONENTE -->
<!-- TOGGLES (FORA DO GRID DE CAMPOS) -->
<div class="item-tipo-status-row">

  <!-- ITEM / COMPONENTE -->
  <div class="item-tipo-toggle-row">
    <button
      type="button"
      class="tipo-btn active"
      onclick="itens_setTipo('Item', this)">
      Item
    </button>

    <button
      type="button"
      class="tipo-btn"
      onclick="itens_setTipo('Componente', this)">
      Componente
    </button>
  </div>

  <!-- ATIVO / INATIVO -->
  <div class="item-status-toggle-row">
<button
  type="button"
  class="status-btn ativo active"
  data-ativo="true"
  onclick="itens_setStatus(this)">
  🟢 Ativo
</button>

<button
  type="button"
  class="status-btn inativo"
  data-ativo="false"
  onclick="itens_setStatus(this)">
  🔴 Inativo
</button>

  </div>

</div>


  <!-- LINHA 1 -->
  <div class="foto-form-row">
    <div class="form-group el-field">
      <label>Código *</label>
<input class="el-input" id="itensCodigo" readonly>
    </div>

    <div class="form-group el-field">
      <label>Produto *</label>
      <input class="el-input" id="itensProduto">
    </div>

    <div class="form-group el-field">
      <label>Material</label>
      <input class="el-input" id="itensMaterial">
    </div>
  </div>

  <!-- LINHA 2 -->
  <div class="foto-form-row">
    <div class="form-group el-field">
      <label>Cor</label>
      <input class="el-input" id="itensCor">
    </div>

    <div class="form-group col-2 el-field">
      <label>Descrição complementar</label>
      <input class="el-input" id="itensDescricaoComplementar">
    </div>
  </div>

</div>

  <!-- ⬇⬇⬇ AGORA FORA DO SIDE ⬇⬇⬇ -->
  <div class="item-bottom-form">

    <!-- LINHA 3 -->
    <div class="foto-form-row">
      <div class="form-group el-field">
        <label>Largura / Diâmetro (m)</label>
<input class="el-input" id="itensLargura" oninput="itens_calcularVolume()">
      </div>
      <div class="form-group el-field">
        <label>Altura (m)</label>
<input class="el-input" id="itensAltura" oninput="itens_calcularVolume()">
      </div>
      <div class="form-group el-field">
        <label>Profundidade (m)</label>
<input class="el-input" id="itensProfundidade" oninput="itens_calcularVolume()">
      </div>
      <div class="form-group el-field">
        <label>Volume cúbico (m³)</label>
<input class="el-input"
  id="itensVolumeCubico"
  placeholder="Auto"
  readonly
  tabindex="-1"
>

      </div>
    </div>

    <!-- LINHA 4 -->
    <div class="foto-form-row">
      <div class="form-group el-field">
        <label>Família</label>
        <input class="el-input" id="itensFamilia">
      </div>
      <div class="form-group el-field">
        <label>Categoria *</label>
        <input class="el-input" id="itensCategoria">
      </div>
      <div class="form-group el-field">
        <label>Setor de estoque *</label>
<select class="el-select" id="itensSetor">
  <option value="">Selecione</option>
  <option value="Almoxarifado">Almoxarifado</option>
  <option value="Estoque Geral">Estoque Geral</option>
  <option value="Decoração">Decoração</option>
  <option value="Louças">Louças</option>
  <option value="Iluminação">Iluminação</option>
  <option value="Móveis">Móveis</option>
</select>

      </div>
      <div class="form-group el-field">
        <label>Exibir no site *</label>
<select class="el-select" id="itensExibirSite">
  <option value="">Selecione</option>
  <option value="true">Sim</option>
  <option value="false">Não</option>
</select>

      </div>
    </div>

    <!-- LINHA 5 -->
    <div class="foto-form-row valores-row">
      <div class="form-group el-field">
        <label>Custo (R$)</label>
        <input class="el-input" id="itensCusto" placeholder="0,00">
      </div>
      <div class="form-group el-field">
        <label>Valor de locação (R$)</label>
        <input class="el-input" id="itensValorLocacao" placeholder="0,00">
      </div>
      <div class="form-group el-field">
        <label>Valor de reposição (R$)</label>
        <input class="el-input" id="itensValorReposicao" placeholder="0,00">
      </div>
    </div>

  </div>

</div>


<!-- ================= AÇÕES DO MODAL ITENS ================= -->
<div class="modal-actions modal-actions-fixed modal-actions-split">

  <!-- AÇÕES CONTEXTUAIS -->
  <div class="modal-actions-left modal-actions-context">

    <button
      type="button"
      class="btn-context"
      title="Galeria de fotos do item">
      <span>Galeria</span>
    </button>

    <button
      type="button"
      class="btn-context"
      title="Histórico de movimentação">
      <span>Histórico</span>
    </button>

    <button
      type="button"
      class="btn-context"
      title="Kits vinculados">
      <span>Kits</span>
    </button>

  </div>

  <!-- BOTÕES PRINCIPAIS -->
  <div class="modal-actions-right">

    <button
      type="button"
      class="btn btn-fechar danger"
      onclick="itens_closeModal()">
      Fechar
    </button>

    <button
      type="button"
      class="btn-save primary"
      onclick="itens_salvar()">
      Salvar
    </button>

  </div>

</div>

</div> <!-- FECHA modal-content -->
</div> <!-- FECHA itensModal -->
