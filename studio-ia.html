<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acervo Studio IA</title>
  <link rel="stylesheet" href="styles/global.css">
  <link rel="stylesheet" href="Modulos/IA/StudioIA/studio-ia.css">
</head>
<body>
  <main id="studioStandaloneRoot"></main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/core/supabase.js"></script>
  <script src="js/core/alerta.js"></script>
  <script>
    window.finalizarCarregamentoModulo = function(){};

    async function initStandaloneStudio(){
      const { data:{ session } } = await window.supabaseClient.auth.getSession();
      if(!session){
        window.location.href = "index.html";
        return;
      }

      let empresaId = sessionStorage.getItem("empresa_id");
      if(!empresaId){
        const { data } = await window.supabaseClient
          .from("usuarios_empresas")
          .select("empresa_id")
          .eq("user_id", session.user.id)
          .maybeSingle();
        empresaId = data?.empresa_id || null;
      }

      window.__CONTEXT = {
        empresa_id: empresaId,
        usuario_id: session.user.id,
        usuario_nome: session.user.email || "Usuario"
      };

      const html = await fetch("Modulos/IA/StudioIA/studio-ia.html").then((r) => r.text());
      document.getElementById("studioStandaloneRoot").innerHTML = html;
      await import("./js/studio-ia/studio-ia.mjs");
      window.__moduleInit?.();
    }

    initStandaloneStudio();
  </script>
</body>
</html>
