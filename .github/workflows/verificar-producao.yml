name: Verificar operação
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verificar:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: diagnostico-operacao
          path: .tmp/*.png
          retention-days: 7
