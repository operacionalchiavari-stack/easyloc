name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # (out/2026) O site só precisa das telas: código do servidor, banco, testes e anotações não vão ao ar
      - name: Remove server-only files
        run: |
          rm -rf api server supabase tests Scripts docs outputs .github
          rm -f ./*.md ./tmp-* package.json package-lock.json deno.lock vercel.json .vercelignore .env.example

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
