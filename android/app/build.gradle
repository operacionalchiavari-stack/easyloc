plugins { id 'com.android.application' }
android {
 namespace 'br.com.chiavari.acervo'
 compileSdk 35
 def firebaseFile = file('google-services.json')
 def firebase = firebaseFile.exists() ? new groovy.json.JsonSlurper().parse(firebaseFile) : null
 def firebaseClient = firebase?.client?.find { it.client_info.android_client_info.package_name == 'br.com.chiavari.acervo' }
 defaultConfig {
  applicationId 'br.com.chiavari.acervo'; minSdk 26; targetSdk 35; versionCode 2; versionName '1.0.0'
  buildConfigField 'boolean', 'FIREBASE_CONFIGURED', firebaseClient ? 'true' : 'false'
  buildConfigField 'String', 'FIREBASE_APP_ID', groovy.json.JsonOutput.toJson(firebaseClient?.client_info?.mobilesdk_app_id ?: '')
  buildConfigField 'String', 'FIREBASE_API_KEY', groovy.json.JsonOutput.toJson(firebaseClient?.api_key?.getAt(0)?.current_key ?: '')
  buildConfigField 'String', 'FIREBASE_PROJECT_ID', groovy.json.JsonOutput.toJson(firebase?.project_info?.project_id ?: '')
  buildConfigField 'String', 'FIREBASE_SENDER_ID', groovy.json.JsonOutput.toJson(firebase?.project_info?.project_number ?: '')
  resValue 'string', 'google_app_id', firebaseClient?.client_info?.mobilesdk_app_id ?: ''
  resValue 'string', 'google_api_key', firebaseClient?.api_key?.getAt(0)?.current_key ?: ''
  resValue 'string', 'gcm_defaultSenderId', firebase?.project_info?.project_number ?: ''
  resValue 'string', 'project_id', firebase?.project_info?.project_id ?: ''
 }
 buildFeatures { buildConfig true }
 signingConfigs {
  release {
   if (System.getenv('ANDROID_KEYSTORE_PATH')) {
    storeFile file(System.getenv('ANDROID_KEYSTORE_PATH'))
    storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
    keyAlias System.getenv('ANDROID_KEY_ALIAS')
    keyPassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
    storeType 'PKCS12'
   }
  }
 }
 buildTypes { release { debuggable false; signingConfig signingConfigs.release } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
 implementation 'androidx.webkit:webkit:1.12.1'
 implementation 'com.google.android.gms:play-services-location:21.3.0'
 implementation 'com.google.firebase:firebase-messaging:24.1.0'
}
